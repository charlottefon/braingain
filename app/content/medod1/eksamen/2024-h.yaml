questions:
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset]
    type: single
    points: 1
    stem: |
      Legeforeningens pris for beste artikkel innen forebyggende medisin gikk til forfattere av artikkelen «Helsetjenestekostnader ved overvekt og fedme på individnivå versus populasjonsnivå – en HUNT-studie», publisert i Tidsskriftet 19. september 2023. Utdrag fra legeforeningen.no:

      > *Utfordrer fremstillinger*
      > *Det vi typisk får høre er at fedme er dyrt for samfunnet (ofte på en avisforside med ett forstørret bilde av en person med alvorlig fedme), sier en av forfatterne.*
      > *– Vi utfordrer denne fremstillingen ved å presentere assosiasjonen mellom BMI og spesialisthelsetjenestekostnader fra ulike perspektiver. Tar vi utgangspunkt i et individperspektiv så er spesialisthelsetjenestekostnader forbundet med alvorlig fedme høyere en kostandene ved overvekt/mild fedme. Men, hvis vi bytter perspektiv til et samfunnsperspektiv så endrer dette seg. Vi illustrerer at fra et samfunnsperspektiv så er spesialisthelsetjenestekostnadene som følger av alvorlig fedme mindre enn kostnadene ved overvekt/mild fedme fordi det er så mange flere som har overvekt/mild fedme.*

      Spørsmål: Hva kalles dette prinsippet som den prisvinnende artikkelen belyser?
    options:
      - «The inverse evidence law»
      - Den kardiovaskulære revolusjonen
      - Det nordiske paradokset
      - Myk paternalisme
      - Livsløpstilnærmingen
      - Forebyggingsparadokset
    answer: [5]
    explanation: Forebyggingsparadokset (Rose) – mange personer med moderat risiko gir flere tilfeller (og her høyere samlede kostnader) enn de få med høy risiko. Derfor gir befolkningsstrategier ofte størst gevinst for samfunnet, selv om hver enkelt har liten nytte.
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: |
      Et tiltak som har som mål å minske sosial ulikhet i helse går ut på å redusere bruken av egenandeler i helsevesenet.

      Hvor i kjeden av tiltak hører det hjemme?
    options: [Midtstrøms, Nedstrøms, Ingen av delene, Oppstrøms]
    answer: [1]
    explanation: Egenandeler virker i helsetjenesten, altså når folk allerede er blitt syke – det er et nedstrøms tiltak. Oppstrøms tiltak retter seg mot strukturelle årsaker (inntekt, utdanning), midtstrøms mot levekår, miljø og levevaner.
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Rasisme former folks helse og helsetjenester i tre gjensidig avhengige dimensjoner. En av disse dimensjonene er...
    options:
      - Epidemiologiske dimensjoner
      - Religiøse dimensjoner
      - Demografiske dimensjoner
      - Institusjonelle dimensjoner
    answer: [3]
    explanation: Rasisme beskrives på tre nivåer – strukturell/institusjonell, interpersonell (mellommenneskelig) og internalisert rasisme. De andre alternativene er ikke dimensjoner av rasisme.
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/samisk-helse]
    type: single
    points: 1
    stem: I Norge er samene et urfolk. Når foregikk fornorskingen av samer i Norge?
    options: ["1940-45", "1970-1990", "1700-1799", "1800-1960"]
    answer: [3]
    explanation: Den offisielle fornorskingspolitikken varte fra ca. midten av 1800-tallet til rundt 1960, med skole, språk og jordlovgivning som viktige virkemidler.
  - n: 5
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: fill
    points: 1
    stem: |
      *Dette er en dra og slipp-oppgave.*

      Plasser de ulike tiltakene (helt inn) i boksene a) oppstrøms, b) midtstrøms eller c) nedstrøms. NB! noen kan høre hjemme i samme boks.
    figure: Tre bokser (Oppstrøms – Midtstrøms – Nedstrøms) med en pil fra oppstrøms mot nedstrøms. Tiltakene som skal plasseres er de tre som er listet under.
    parts:
      - {prompt: "Tiltak knyttet til mindre inntektsulikhet", answer: "Oppstrøms"}
      - {prompt: "Tiltak knyttet til fysiske og sosiale miljøfaktorer", answer: "Midtstrøms"}
      - {prompt: "Tiltak knyttet til levevaner", answer: "Midtstrøms"}
    explanation: |
      Inntektsfordeling er en strukturell (bakenforliggende) årsak → oppstrøms. Levekår/miljø og levevaner er mellomliggende faktorer → midtstrøms. Nedstrøms er tiltak i helsetjenesten, så ingen av disse hører hjemme der.

      Merk: Fasiten er ikke synlig i PDF-en (dra-og-slipp); svaret er utledet fra kursets inndeling (nedstrøms-boksen er gråtonet i oppgaven).
  - n: 6
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvordan er bruk av helsetjenester i siste leveår blant alvorlig syke pasienter fordelt etter sosioøkonomisk status i Norge?
    options:
      - De med lav utdanning mottar flere medisinske tjenester på norske somatiske sykehus enn pasienter med høy utdanning
      - De med høy utdanning mottar flere medisinske tjenester på norske somatiske sykehus enn pasienter med lav utdanning
      - Dette er ikke undersøkt
      - Det er lik bruk etter sosioøkonomisk status
    answer: [1]
    explanation: Norske studier viser at alvorlig syke med høy utdanning får mer sykehusbehandling i siste leveår enn de med lav utdanning – et eksempel på at helsetjenesten selv kan bidra til sosial ulikhet («inverse care law»).
  - n: 7
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Michael Marmot er en anerkjent engelsk sosialepidemiolog og professor. Våren 2023 leverte Marmot sammen med norske og engelske kollegaer anbefalinger for utjevning av helseforskjeller til Helse og omsorgsdepartementet.
      Marmot hevder at urettferdige helseforskjeller er sosiale forskjeller som
    options:
      - skyldes artefaktforklaringer
      - er naturskapte og ikke-forebyggbare
      - skyldes innvandring
      - er unødvendige, sosiale skapte og forebyggbare med rimelige midler
    answer: [3]
    explanation: Helseforskjeller regnes som urettferdige (health inequities) når de er sosialt skapte, unødvendige og kan forebygges med rimelige midler – i motsetning til biologisk betingede forskjeller.
  - n: 8
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: single
    points: 1
    stem: |
      Der modellen for demografisk transisjon er opptatt av fødsler og død, er modellen for epidemiologisk transisjon opptatt av hvordan befolkningens helsebehov endrer seg gjennom de ulike stadiene. Modellene gjelder alle land.
      Hvilket av disse utviklingstrekkene skjer først?
    options:
      - Ingen av alternativene er korrekt
      - Dødsraten faller
      - Alderdomssykdommer dominerer
      - Fødselstallene faller
    answer: [1]
    explanation: I demografisk transisjon faller dødeligheten først (bedre ernæring, hygiene, kontroll med infeksjoner), mens fødselstallene faller senere – derfor befolkningsvekst i mellomfasen. Alderdomssykdommer dominerer først i siste fase.
  - n: 9
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/kortsvar/ovelse-tuberkulosen, samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: multi
    points: 4
    stem: På begynnelsen av 1900-tallet var tuberkulosen den infeksjonssykdommen som tok flest liv i Norge. Innen annen verdenskrig var tuberkulosen omtrent under kontroll. Hvilke tiltak var satt i verk for å få bekjempe tuberkulosen i denne perioden?
    options:
      - Kirurgiske inngrep
      - Kosthold og sosial forbedring
      - Isolasjon av smittebærere
      - Behandling med antibiotika
      - Informasjonskampanje om renslighet
      - Massevaksinasjon med BCG
    answer: [0, 1, 2, 4]
    explanation: Før 1940 var tiltakene bedre levekår og kosthold, isolasjon (sanatorier), opplysning om renslighet og kirurgisk behandling (f.eks. pneumothorax-behandling). Antibiotika (streptomycin) og massevaksinasjon med BCG kom først etter krigen.
  - n: 10
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: single
