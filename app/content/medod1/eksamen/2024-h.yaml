      - Denne mutasjonen fører til en økt stabilitet i trippelheliks, some som også øker stabiliteten av kollagenmolekylet.
      - Mutasjoner i glysin knyttet til OI fører til mangel på kollagen i beinet, som følge av at kollagenproduksjonen er helt stoppet.
