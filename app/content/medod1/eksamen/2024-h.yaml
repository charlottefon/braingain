    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-aminosyre, generell-kjemi/regnetyper/henderson-hasselbalch]
    type: single
    points: 1
    stem: |
      Biologistudenten Jacob forstår at det er svært viktig å kjenne til noe om generell kjemi.
      Han har plutselig med seg 50,0 ml med 0,1 M protonert alanin ($\ce{H2A+}$). Vi vil vite mer, og vi titrerer denne med 0,1 M NaOH...
      $K_{a1} = 4{,}6 \times 10^{-3}$
      $K_{a2} = 2{,}0 \times 10^{-10}$
      Beregn pH etter tilsetting av 70 ml NaOH.
      Vi antar her at ved begynnelsen av titreringen har vi kun syreformen ($\ce{H2A+}$) til stede.
    options: ["2,16", "9,52", "2,71", "9,88"]
    answer: [1]
    explanation: |
      $n(\ce{H2A+}) = 0{,}050 \cdot 0{,}1 = 5{,}0$ mmol; $n(\ce{OH-}) = 0{,}070 \cdot 0{,}1 = 7{,}0$ mmol.
      De første 5,0 mmol OH⁻ gjør alt $\ce{H2A+}$ om til HA (zwitterion). De resterende 2,0 mmol gjør 2,0 mmol HA om til $\ce{A-}$, og 3,0 mmol HA er igjen.
      Buffer i andre trinn: $pK_{a2} = -\log(2{,}0 \times 10^{-10}) = 9{,}70$, og
      $pH = 9{,}70 + \log\frac{2{,}0}{3{,}0} = 9{,}70 - 0{,}18 = 9{,}52$.
  - n: 54
    subject: generell-kjemi
    topics: [generell-kjemi/teori/karbonsyre-og-blodets-ph, generell-kjemi/teori/buffere]
    type: single
    points: 1
    stem: |
      pH er viktig for livet, og mange biomolekyler kan fungere som syrer eller baser.
      Henderson-Hasselbach-likningen kan brukes til å beskrive $pK_a$-verdien, spesielt når vi tenker på bufferløsninger.
      Hva er definisjonen av $pK_a$-verdien i henhold til denne likningen, når vi tenker på pH i blodet?
    options:
      - '$pK_a$ er relatert til konsentrasjonene av bikarbonat og $\ce{CO2}$ (karbonsyre)'
      - '$pK_a$ er den negative logaritmen av hydrogenionkonsentrasjonen'
      - '$pK_a$ er logaritmen til konsentrasjonen av natriumbikarbonat'
      - '$pK_a$ er den negative logaritmen av kaliumkonsentrasjonen i blod'
    answer: [0]
    explanation: "I blodet er $pH = pK_a + \\log\\frac{[\\ce{HCO3-}]}{[\\ce{CO2}]}$, så $pK_a = pH - \\log\\frac{[\\ce{HCO3-}]}{[\\ce{CO2}]}$ – den knytter pH til forholdet mellom bikarbonat og $\\ce{CO2}$/karbonsyre ($pK_a \\approx 6{,}1$). $-\\log[\\ce{H+}]$ er definisjonen av pH, ikke $pK_a$."
  - n: 55
