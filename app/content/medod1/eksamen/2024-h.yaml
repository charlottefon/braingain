    answer: [0]
    explanation: "Salpetersyre protonerer ammoniakk ($\\ce{NH3 + H+ -> NH4+}$), så $[\\ce{NH3}]$ synker. Etter Le Châtelier går likevekten mot venstre – komplekset brytes ned og AgCl felles ut."
