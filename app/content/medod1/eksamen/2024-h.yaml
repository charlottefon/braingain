    type: single
    points: 1
    stem: |
      Geologistudenten Beathe forbereder seg til semestereksamen. Sammen med bestemoren hypoventilerer hun, og dermed øker $[\ce{H2CO3}]$ i hennes blod fra 1,2 mM til 3,0 mM. Blodets $[\ce{HCO3-}]$ forblir stabil ved 24 mM.
      $pK_a$ til karbonsyre ved fysiologiske betingelser er 6,1.
      Hva blir pH i Beathes blod?
    options: ["7,2", "7,0", "5,2", "8,2"]
    answer: [1]
    explanation: "$pH = pK_a + \\log\\frac{[\\ce{HCO3-}]}{[\\ce{H2CO3}]} = 6{,}1 + \\log\\frac{24}{3{,}0} = 6{,}1 + \\log 8 = 6{,}1 + 0{,}90 = 7{,}0$ (respiratorisk acidose; før hypoventilering var pH $6{,}1 + \\log 20 = 7{,}4$)."
