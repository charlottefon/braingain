      - MBP inneholder ingen aminosyrer med positiv ladning på sidekjeden ved fysiologisk pH.
    answer: [1]
    explanation: Når pH > pI er proteinet netto negativt, når pH < pI netto positivt. CaM (pI 4,1) er negativt ved pH 7; MBP (pI 11) er positivt ved pH 10; over pH 11 er begge negative. Den høye pI-en til MBP skyldes nettopp mange Lys/Arg.
  - n: 52
    subject: generell-kjemi
