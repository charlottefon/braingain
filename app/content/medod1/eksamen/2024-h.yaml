    stem: |
      En stipendiat har en prøve, som inneholder to ulike proteiner: MBP (basisk myelinprotein) og CaM (kalmodulin).
      MBP har et isoelektrisk punkt pI=11,0. CaM har et isoelektrisk punkt pI=4,1.
      Hvilken av de følgende påstandene stemmer?
    options:
