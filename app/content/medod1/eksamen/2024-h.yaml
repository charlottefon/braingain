    stem: En vanlig mutasjon som forårsaker osteogenesis imperfecta (OI) er en punktmutasjon som bytter ut glysin med en større aminosyre i kollagen, for eksempel serin eller valin. Hvilket av følgende utsang er riktig?
    options:
