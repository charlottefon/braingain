    stem: 'En enzymkatalysert reaksjon følger Michaelis-Menten-kinetikk. Maksimal reaksjonshastighet ($V_{max}$) er 100 µmol/min, og reaksjonshastigheten ($V_0$) er 50 µmol/min når substratkonsentrasjonen ([S]) er 5 mM. Hva er Michaelis-konstanten ($K_M$)?'
    options: [20 mM, 5 mM, "2,5 mM", 10 mM]
