      - Reaksjonen er eksergon og eksoterm.
      - Reaksjonen er eksergon og endoterm.
      - Reaksjonen er endergon og endoterm.
    answer: [1]
    explanation: "$\\Delta H < 0$ → eksoterm. $\\Delta G = \\Delta H - T\\Delta S$; med $\\Delta H < 0$ og $\\Delta S > 0$ er $\\Delta G < 0$ ved alle temperaturer (f.eks. ved 310 K: $-8500 - 310 \\cdot 18 = -14\\,080$ cal/mol) → eksergon."
