    stem: Hvordan omtaler vi etterkrigstidens største endring i dødelighet i Norge?
    options:
      - Infeksjonssykdommene kom under kontroll
      - Overmedisineringsfenomenet
      - Antropocen klimadødelighet
      - Den kardiovaskulære revolusjonen
    answer: [3]
    explanation: Fra ca. 1970 falt dødeligheten av hjerte- og karsykdom kraftig (mindre røyking, lavere kolesterol og blodtrykk, bedre behandling) – «den kardiovaskulære revolusjonen». Infeksjonssykdommene kom under kontroll tidligere.
