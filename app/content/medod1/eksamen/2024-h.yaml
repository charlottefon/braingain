      a) Kiralt C med Cl opp (i planet), Br ned til venstre (i planet), $\ce{CH3}$ bak (stiplet kile, til høyre) og H fram (fylt kile, ned).

      b) Kiralt C med $\ce{CH2CH2CH3}$ opp (i planet), Br ned til venstre (i planet), H bak (stiplet kile, til høyre) og $\ce{CH3}$ fram (fylt kile, ned).
