  # ---------------- Sosial ulikhet i helse ----------------
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: single
    points: 1
    stem: |
      Medisinsk historie: Epidemiologisk transisjon. Alle stater går gjennom en epidemiologisk transisjon, om enn på ulike tidspunkt og i ulik hastighet. Modellen har mye til felles med den demografiske transisjon. Hvilke av disse endringene skjer først?
    options:
      - Ingen av alternativene er riktig
      - Alderdomssykdommer dominerer
      - Fødselsraten går ned
      - Dødsraten går ned
    answer: [3]
    explanation: I transisjonsmodellene faller dødsraten først (bedre ernæring, hygiene, færre infeksjonsdødsfall). Fødselsraten faller senere, og befolkningen vokser i mellomtiden. Først mot slutten dominerer kroniske sykdommer og alderdomssykdommer.
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: |
      Da sunnhetsloven ble til, var det i en tid da sykdommers etiologi var høyst uklare. To av de største gruppene var kontagionistene og miasmatikerne. Hva var det store paradokset i folkehelsetiltakene de to gruppene sto for?
    options:
      - Selv om kontagionistene hadde rett når det kom til etiologi, ville tiltaket de foreslo - å lukke grensene - ført til at befolkningen sultet.
      - Selv om miasmatikerne tok feil når det gjaldt sykdomsforståelse, hadde tiltakene de sto for nok en større effekt på folkehelsen enn tiltakspakken kontagionistene sto bak.
      - Selv om både kontagionister og miasmatikere hadde en klar tanke om etiologi, hadde ingen av dem egentlig noen folkehelsetiltak å komme med.
      - Selv om miasmatikerne mente sykdom spredte seg i luften, var de motstandere av munnbind - de fikk faktisk innført et forbud.
    answer: [1]
    explanation: Miasmatikerne trodde sykdom kom fra «dårlig luft» fra forråtnelse og skitt. Teorien var feil, men tiltakene deres (renovasjon, kloakk, rent vann, bedre boliger) bedret folkehelsen mer enn kontagionistenes karantene og isolasjon.
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-proporsjonal-universalisme]
    type: text
    points: 3
    stem: |
      **Tiltak for å utjevne sosiale ulikheter:**

      a) Beskriv hva som menes med universelle tiltak. Hva er en potensiell ulempe med rent universelle tiltak når en har som mål å utjevne sosiale ulikheter i helse?

      b) Beskriv hva som menes med målrettede tiltak. Hva er en potensiell svakhet med målrettete tiltak når en har som mål å utjevne sosiale ulikheter i helse?

      c) Beskriv begrepet «proporsjonell universalisme», hva går det ut? Gi et eksempel.
    model: |
      (1 poeng per delspørsmål)

      **a)** Universelle tiltak tilbys hele befolkningen. Ulempe: tas tiltaket opp av alle, bedres helsen for alle og ulikhetene består. Tas det i størst grad opp av dem med best helse og mest ressurser, øker ulikhetene.

      **b)** Målrettede tiltak rettes mot de mest sårbare/utsatte gruppene. Svakhet: man går glipp av store deler av befolkningen som også har dårligere helse enn dem med høyest sosial posisjon (helse følger en gradient).

      **c)** Proporsjonal universalisme beholder prinsippet om universelle tiltak (lik tilgang for alle), men skalaen og intensiteten tilpasses behovet, slik at tiltaket virker best for dem som trenger det mest. Eksempel: barnehage. Alle har rett til en delvis offentlig finansiert plass, men barn med behov kan få fullfinansiert plass og ekstra ressurser.
    modelSource: Sensorveiledning
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: text
    points: 2
    stem: |
      Helsedirektoratet ga NTNU og Institute of health equity i oppdrag å foreslå anbefalinger på tiltak for å utjevne sosiale ulikheter i helse. Rapporten ble overlevert Helsedirektoratet den 10. mars 2023. I denne rapporten beskriver Michael Marmot og kollegaer 8 prinsipp for tiltak for å redusere sosiale ulikheter i helse.

      Nevn 4 av disse, dere får 1/2 poeng for hvert riktige forslag (max 2 poeng totalt).
    model: |
      Fire av disse åtte:

      1. Gi alle barn den beste starten på livet.
      2. Gi alle barn, unge og voksne mulighet til å realisere evnene sine fullt ut og ha kontroll over egne liv.
      3. Skape rettferdig sysselsetting og gode jobber for alle.
      4. Sikre en helsefremmende levestandard for alle.
      5. Skape og utvikle sunne og bærekraftige lokalsamfunn.
      6. Styrke rollen til og virkningen av sykdomsforebygging.
      7. Kjempe mot diskriminering og rasisme og konsekvensene av dette.
      8. Fremme miljømessig bærekraft og utjevning av helseforskjeller samtidig.
    modelSource: Sensorveiledning
  - n: 5
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset]
    type: text
    points: 2
    stem: Beskriv hva forebyggingsparadokset går ut på (2 poeng).
    model: |
      Å nå dem som trenger det mest er et viktig mål, men i et folkehelseperspektiv er mer målretting ikke nødvendigvis det som gir størst helsegevinst totalt. Høyrisikogrupper har stor risiko per person, men er få. I den store gruppen med lav eller moderat risiko er risikoen per person lavere, men antallet er så stort at de fleste sykdomstilfellene oppstår her. Et tiltak som gir liten nytte for hver enkelt i hele befolkningen, kan derfor forebygge flere tilfeller enn et tiltak rettet bare mot høyrisikogruppen.
    modelSource: Sensorveiledning
  - n: 6
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: text
    points: 2
    stem: Hvordan har utviklingen siden år 2000 frem til i dag vært i andel barn som vokser opp i husholdninger med vedvarende lav inntekt? (2 poeng)
    model: Andelen har økt. Fra rundt 4 % av barna i 2000 til om lag 11 % i 2021 (12 % i 2019 og 2020).
    modelSource: Sensorveiledning

