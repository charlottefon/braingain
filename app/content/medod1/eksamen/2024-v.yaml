  # ---------------- Celle1 ----------------
  - n: 27
    subject: cellebiologi
    topics: [cellebiologi/cellen/proteinsyntese-og-vesikkeltransport, cellebiologi/organeller/ru-endoplasmatisk-retikulum, cellebiologi/cellen/cellens-rom-og-organisering]
    type: single
    points: 1
    stem: Hvilken av de følgende prosessene i eukaryote celler skjer i cytoplasma?
    options:
      - Syntese av mRNA.
      - Proteinsyntese på membranbundne ribosomer.
      - Binding av sukkermolekyler til glykoproteiner.
      - Sitronsyresyklus
    answer: [1]
    explanation: Ribosomene på rER sitter på cytosolsiden av ER-membranen, så translasjonen skjer i cytoplasma. mRNA syntetiseres i kjernen, glykosylering skjer i ER-lumen og Golgi, og sitronsyresyklus skjer i mitokondriematriks.
