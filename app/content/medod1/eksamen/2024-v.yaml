    stem: Alkohol dehydrogenase (ADH) er avhengig av nikotinamid adenin dinukleotid ($\ce{NAD+}$) for å kunne oksidere alkoholer. Fordi $\ce{NAD+}$ blir omdannet til NADH og frigjort, er det et kosubstrat i reaksjonen, og NADH er et koprodukt. I tillegg er ADH avhengig av et metall-ion ($\ce{Zn^2+}$) for å kunne gjøre katalyse. $\ce{Zn^2+}$ er ikke endret av ADH, og det er heller ikke bundet sterkt til enzymet. Hvilket uttrykk under beskriver best rollen til $\ce{Zn^2+}$ i reaksjonen katalysert av ADH?
    options: [koenzym, kosubstrat, prostetisk gruppe, kofaktor]
    answer: [3]
    explanation: Et uorganisk metallion som trengs for katalysen er en kofaktor. Koenzymer er organiske molekyler. En prostetisk gruppe er tett (ofte kovalent) bundet, og et kosubstrat endres i reaksjonen.
