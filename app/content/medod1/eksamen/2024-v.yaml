    stem: |
      Et metabolsk enzym har $V_{max}$ = 100 mikromol produkt/min og $K_M$ = 25 mM.

      En sykdomsassosiert mutant av dette enzymet har $V_{max}$ = 100 mikromol produkt/min og $K_M$ = 20 mM. Hva er riktig svar?
    options:
      - Den initiale hastigheten til reaksjonen katalysert av enzymet uten mutasjon ved en konsentrasjon av substrat på 25 mM er 50 mikromol produkt/min.
      - Mutanten har lavere affinitet til substratet enn det normale enzymet
      - Den initiale hastigheten til reaksjonen katalysert av det muterte enzymet ved en konsentrasjon av substrat på 20 mM er 200 mikromol produkt/min.
      - Mutanten forskyver likevekten til produktdannelse i større grad enn det normale enzymet
    answer: [0]
    explanation: |
      Når $[S] = K_M$, er $V_0 = V_{max}[S]/(K_M + [S]) = 100 \times 25/(25 + 25) = 50$ µmol/min.

      Mutanten har *lavere* $K_M$ og dermed høyere affinitet. $V_0$ kan aldri overstige $V_{max}$ (ved 20 mM er den 50 µmol/min). Enzymer påvirker ikke likevekten.
