    stem: |
      Vi vet at likevektskonstanten til den følgende reaksjonen er $K$:

      $\ce{A + B <=> C + D}$

      Hva blir da likevektskonstanten til reaksjonen:

      $\ce{3C + 3D <=> 3A + 3B}$
