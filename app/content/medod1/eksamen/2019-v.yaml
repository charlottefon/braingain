  - n: "4.1"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/loselighet-og-komplekser, generell-kjemi/regnetyper/kompleksdannelse-og-loselighet]
    type: single
    points: 1
    stem: Medisinstudenten Jens har 100 ml av en mettet vannløsning av AgCl. Hvordan kan han øke løseligheten til AgCl?
    options: [Ved å tilsette mer AgCl(s)., Ved å tilsette NaCl., Ved å minke pH., 'Ved å tilsette ammoniakk ($\ce{NH3}$).']
    answer: [3]
    explanation: NH₃ danner komplekset Ag(NH₃)₂⁺, som fjerner fritt Ag⁺, og likevekten AgCl(s) ⇌ Ag⁺ + Cl⁻ forskyves mot høyre. NaCl senker løseligheten (fellesioneffekt), mer fast stoff endrer ingenting, og Cl⁻ er en ekstremt svak base, så pH har praktisk talt ingen effekt.
