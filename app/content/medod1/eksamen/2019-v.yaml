      - sykloheksanol < 2-klorosykloheksanol < fenol < p-nitrofenol < p-metylfenol
      - fenol < p-nitrofenol < p-metylfenol < sykloheksanol < 2-klorosykloheksanol
      - sykloheksanol < 2-klorosykloheksanol < p-metylfenol < fenol < p-nitrofenol
      - p-metylfenol < fenol < p-nitrofenol < 2-klorosykloheksanol < sykloheksanol
    answer: [2]
    explanation: Alkoholer er svakere syrer enn fenoler (ingen resonansstabilisering av anionet). Cl trekker elektroner induktivt, så 2-klorsykloheksanol er litt sterkere enn sykloheksanol. Blant fenolene destabiliserer elektrondonerende CH₃ fenoksidet (svakere), mens elektrontiltrekkende NO₂ stabiliserer det ved resonans (sterkest).
