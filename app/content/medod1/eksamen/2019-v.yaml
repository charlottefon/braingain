      $\ce{Zn^2+ + 2e- -> Zn(s)}$  −0.763 V
      $\ce{Cu^2+ + 2e- -> Cu(s)}$  +0.377 V
      Hva er standard cellepotensiale for denne galvaniske cellen?
    options: ["+1.140 V", "-1.140 V", "-0.386 V", "+0.386 V"]
    answer: [0]
    explanation: Cu²⁺ reduseres (katode), Zn oksideres (anode) – $E^\circ_\text{cell} = 0{,}377 - (-0{,}763) = +1{,}140$ V. En galvanisk celle har alltid positiv $E^\circ_\text{cell}$. (Tabellverdien for Cu²⁺/Cu er egentlig +0,337 V, som gir 1,100 V – men regn med oppgitte tall.)
