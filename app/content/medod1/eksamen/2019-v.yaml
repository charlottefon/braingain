  - n: "4.4"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/kombinere-likevektskonstanter]
    type: single
    points: 2
    stem: |
      Vi har følgende to reaksjoner:
      A + B ⇌ C (reaksjon 1)
      2 C ⇌ D + E (reaksjon 2)
      Vi kan måle likevektskonstantene til begge reaksjonene:
      $K_c = 0.5$ (reaksjon 1)
      $K_c = 100$ (reaksjon 2)
      Hva blir da likevektskonstanten til følgende reaksjon:
      2 A + 2 B ⇌ D + E
    options: ["5000", "101", "50", "25"]
    answer: [3]
    explanation: Reaksjon 1 multiplisert med 2 gir $K = 0{,}5^2 = 0{,}25$. Summen med reaksjon 2 gir produktet av K-ene – $0{,}25 \times 100 = 25$.
