  - n: "4.25"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/likevektskonstant-fra-konsentrasjoner]
    type: single
    points: 2
    stem: |
      Vi betrakter følgende likevekt ved 1600 °C:
      $\ce{Br2(g) <=> 2 Br(g)}$

      Når vi tar 1,05 mol $\ce{Br2}$ i en beholder med volum 0,980 liter, er det 1,20 % av det opprinnelige $\ce{Br2}$ som er spaltet ved likevekt.
      Beregn likevektskonstanten $K_c$ for reaksjonen!
    options: ['$6{,}4 \times 10^{-4}$', '$5{,}4 \times 10^{-4}$', '$1{,}6 \times 10^{-4}$', '$2{,}5 \times 10^{-2}$']
    answer: [0]
    explanation: |
      $[\ce{Br2}]_0 = 1{,}05 / 0{,}980 = 1{,}071$ M. Spaltet: $x = 0{,}0120 \cdot 1{,}071 = 0{,}01286$ M.
      Likevekt: $[\ce{Br}] = 2x = 0{,}02571$ M, $[\ce{Br2}] = 1{,}071 - 0{,}013 = 1{,}059$ M.
      $K_c = \dfrac{[\ce{Br}]^2}{[\ce{Br2}]} = \dfrac{(0{,}02571)^2}{1{,}059} = \dfrac{6{,}61 \times 10^{-4}}{1{,}059} \approx 6{,}2 \times 10^{-4}$.
      Merk: nøyaktig regning gir 6,2 × 10⁻⁴. Det offisielle svaret 6,4 × 10⁻⁴ er det nærmeste alternativet (avviket skyldes trolig avrunding).
