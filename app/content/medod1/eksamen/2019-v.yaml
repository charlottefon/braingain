questions:
  - n: "2.1"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: text
    points: 8
    stem: Nevn ulike faktorer som kan bidra til at sosiale ulikheter i helse overføres fra generasjon til generasjon.
    model: |
      - Helseforskjeller i voksen alder skyldes i stor grad forskjeller i materielle, psykososiale og atferdsrelaterte risikofaktorer i fosterliv og barndom.
      - Forhold i svangerskapet, som dårlig ernæringstilstand hos mor, bidrar til prematur sykdomsutvikling hos barnet og gjør det mer sårbart for ytre påkjenninger.
      - Epigenetiske forandringer: uttrykket av gener kan modifiseres av kjemiske forandringer i DNA og i proteinene DNA pakkes rundt, under befruktning, fosterutvikling og perinatalt. For eksempel kan eksponeringer foreldrene har vært utsatt for (som røyking) gi epigenetiske forandringer som øker risikoen for allergi og astma hos barna.
      - Sosial læring: foreldre er rollemodeller for barn når det gjelder helsevaner og valg av utdanning.
      - Utdanning: foreldre med lav utdanning har dårligere forutsetninger for å hjelpe barna med skolearbeid, og barna får dermed dårligere forutsetninger for å gjøre det bra på skolen.
      - Oppvekstmiljø:
        - *Fysisk:* barns eksponering for støv, lukt, støy og annen forurensning er ulikt fordelt etter foreldrenes utdanning og inntekt, og påvirker sykdomsrisikoen.
        - *Psykisk:* foreldrenes sosioøkonomiske status påvirker barnas psykososiale miljø; andelen barn og unge i skilsmissefamilier er større i lavere sosiale lag.
      - Ressursknapphet og helseproblemer kan gjensidig forsterke hverandre over livsløpet.
    modelSource: Sensorveiledning
  - n: "2.2"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: text
    points: 3
    stem: Hva handler Forsdal-Barkerhypotesen om?
    model: |
      - Kalles også **programmeringshypotesen**: forhold i svangerskapet og i spedbarnsalderen kan gi prematur sykdomsutvikling senere i livet.
      - Forsdahl tok utgangspunkt i levekårene i barne- og ungdomsårene; Barker viste at det samme gjaldt når en tok utgangspunkt i miljøet i fosterlivet og ernæringssituasjonen i første leveår.
      - Dårlig ernæring i fosterlivet og de første leveårene gir økt risiko for overvekt, diabetes og hjerte- og karsykdom senere i livet. Sannsynligvis blir fosterets metabolisme innstilt på en næringsfattig verden og tar godt vare på enhver kalori – det øker risikoen for overvekt når næringstilgangen blir normal.
    modelSource: Sensorveiledning
