    explanation: Tre elektronegative Cl-atomer stabiliserer det negativt ladede karboksylatet (induktiv effekt) bedre enn ett, så trikloreddiksyre er sterkere. Aldehyd + alkohol (H⁺) gir hemiacetal og videre acetal. Laktose er reduserende. SN2 på (R)-2-brombutan gir (S)-2-butanol.
