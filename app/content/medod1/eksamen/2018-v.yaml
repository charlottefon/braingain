    topics: [generell-kjemi/teori/buffere]
    type: single
    points: 1
    stem: En buffer er...
    options:
      - en blanding av en sterk syre og en sterk base.
      - en løsning av en sterk syre ved lav konsentrasjon.
      - en blanding av en svak syre og dens konjugerte base.
      - en blanding av en svak syre og en sterk syre.
    answer: [2]
    explanation: En buffer består av et svakt korresponderende syre–base-par (HA/$\ce{A-}$) i sammenlignbare mengder. Det kan nøytralisere både tilsatt syre ($\ce{A-}$ tar opp $\ce{H+}$) og tilsatt base (HA avgir $\ce{H+}$).
  - n: "4.10"
