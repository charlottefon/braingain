    options: [hydrogenbindinger, kovalente bindinger, dipol-dipolbindinger, ion-dipolbindinger]
    answer: [3]
    explanation: Ionene hydratiseres av ion–dipol-krefter. $\ce{Na+}$ omgis av O-enden og $\ce{Cl-}$ av H-endene til vannmolekylene.
  - n: "4.12"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/standard-cellepotensial]
    type: single
    points: 1
    stem: |
      For en galvanisk celle har vi følgende reaksjon:

      $\ce{Zn(s) + Cu^2+ -> Zn^2+ + Cu(s)}$

      Standard reduksjonspotensial for halv-celle-reaksjonene er:

      $\ce{Zn^2+ + 2e- -> Zn(s)}$  −0,763 V

      $\ce{Cu^2+ + 2e- -> Cu(s)}$  +0,377 V

      Hva er standard cellepotensiale for denne galvaniske cellen?
    options: ["−1,140 V", "+1,140 V", "+0,386 V", "−0,386 V"]
    answer: [1]
    explanation: |
      Cu²⁺ reduseres (katode) og Zn oksideres (anode):

      $E^\circ_{\text{celle}} = E^\circ_{\text{katode}} - E^\circ_{\text{anode}} = 0{,}377 - (-0{,}763) = +1{,}140$ V.

      En galvanisk celle har alltid $E^\circ > 0$. (Tabellverdien for Cu²⁺/Cu er egentlig +0,34 V, men oppgaven oppgir +0,377 V.)
  - n: "4.13"
