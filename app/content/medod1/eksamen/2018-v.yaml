    explanation: $\ce{CO2}$ fra lufta løses og danner karbonsyre ($\ce{CO2 + H2O <=> H2CO3 <=> H+ + HCO3-}$), så vannet blir svakt surt (pH ca. 5,6).
  - n: "4.15"
