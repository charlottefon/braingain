    answer: [1]
    explanation: $\log\frac{[\ce{A-}]}{[\ce{HA}]} = 1 \Rightarrow [\ce{A-}]:[\ce{HA}] = 10:1$, så den protonerte andelen er $1/11 \approx 9\,\%$.
  - n: "4.7"
    subject: proteiner
    topics: [generell-kjemi/regnetyper/isoelektrisk-punkt, generell-kjemi/teori/flerprotiske-syrer-og-aminosyrer]
    type: single
    points: 1
    stem: Kalmodulin er et intracellulært protein som binder kalsiumioner ($\ce{Ca^2+}$). Når $\ce{Ca^2+}$ bindes til kalmodulin, endrer proteinet form og kan derved påvirke en rekke enzymer og andre proteiner. Det isoelektriske punktet til kalmodulin i myelin er 4,1. Hva kan man si om elektrisk nettoladning til kalmodulin ved nøytral pH (pH = 7)?
    options: [Nettoladning er positiv., Nettoladning er negativ., Nettoladning er 0., "Nettoladning er 4,1."]
    answer: [1]
    explanation: Når pH > pI, har proteinet avgitt flere protoner enn ved pI og er negativt ladet. Kalmodulin er rikt på Asp/Glu, noe som også passer med at det binder $\ce{Ca^2+}$.
  - n: "4.8"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/loselighetsprodukt]
    type: single
    points: 1
    stem: |
      Sølvsulfid er et tungtløselig salt:

      $\ce{Ag2S(s) <=> 2 Ag+(aq) + S^2-(aq)}$

      En mettet løsning av $\ce{Ag2S}$ viste seg å inneholde $1{,}077 \times 10^{-17}$ M $\ce{S^2-}$.

      Hva er løselighetsproduktet $K_{sp}$ for sølvsulfid?
    options: ["$1{,}077 \\times 10^{-17}$", "$1{,}16 \\times 10^{-34}$", "$5{,}0 \\times 10^{-51}$", "$1{,}25 \\times 10^{-51}$"]
    answer: [2]
    explanation: |
      $[\ce{S^2-}] = s = 1{,}077\times10^{-17}$ M og $[\ce{Ag+}] = 2s$.

      $K_{sp} = (2s)^2 \cdot s = 4s^3 = 4 \times (1{,}077\times10^{-17})^3 = 4 \times 1{,}249\times10^{-51} = 5{,}0\times10^{-51}$.

      ($1{,}25\times10^{-51}$ får man hvis man glemmer faktoren 4.)
  - n: "4.9"
