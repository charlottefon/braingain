    points: 1
    stem: |
      Vi har følgende to reaksjoner:

      A + B ⇌ C (reaksjon 1)

      2 C ⇌ D + E (reaksjon 2)

      Vi kan måle likevektskonstantene til begge reaksjonene:

      $K_c = 0{,}5$ (reaksjon 1)

      $K_c = 100$ (reaksjon 2)

      Hva blir da likevektskonstanten til følgende reaksjon:

      2 A + 2 B ⇌ D + E
    options: ["50", "5000", "101", "25"]
    answer: [3]
    explanation: |
      Reaksjon 1 ganget med 2 gir $K = 0{,}5^2 = 0{,}25$. Lagt sammen med reaksjon 2 (C faller bort) multipliseres konstantene:

      $K = 0{,}25 \times 100 = 25$.
  - n: "4.11"
