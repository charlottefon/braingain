  - n: "4.71"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/jern-sporstoffer-og-oksygentoksisitet]
    type: single
    points: 1
    stem: |
      Oksygentilførsel blir ofte brukt til kritisk syke pasienter, men oksygen kan også være skadelig. For å begrense faren for oksygentoksisitet bør man sørge for at ...

      **Velg ett alternativ**
    options:
      - "...det ikke er oksygenradikaler i pustegassen."
      - "...pustegassen består av 100 % oksygen"
      - "...pusting i 100 % oksygen bare benyttes i kort tid."
      - "...oksygentrykket er så høyt som mulig."
    answer: [2]
    explanation: Oksygentoksisitet skyldes økt dannelse av reaktive oksygenforbindelser i vevet ved høyt $p\ce{O2}$ over tid, ikke radikaler i selve gassen. Høye $\ce{O2}$-konsentrasjoner bør derfor bare brukes kortvarig.
  - n: "4.72"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/jern-sporstoffer-og-oksygentoksisitet]
    type: single
    points: 1
    stem: |
      Hvilken av påstandene er **IKKE** riktig?

      **Velg ett alternativ**
    options:
      - Hepcidin hemmer jernabsorpsjonen.
      - Sykdommen hemokromatose skyldes unormalt økt absorpsjon av jern.
      - Et vegetabilsk kosthold er generelt gunstig for jernopptaket.
      - Jern lagres i cellene vesentlig bundet til ferritin.
    answer: [2]
    explanation: Plantekost inneholder bare ikke-hem-jern, som tas dårligere opp enn hem-jern fra kjøtt og fisk. Fytater (fullkorn) og polyfenoler (te, kaffe) hemmer i tillegg opptaket. De andre påstandene er riktige.
