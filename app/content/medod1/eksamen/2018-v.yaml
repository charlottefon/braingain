  - n: "3.1"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilke tiltak vil du karakterisere som et «nedstrøms» forebyggende tiltak?
    options: [Påbud om bruk av bilbelte, Økt bruk av midtdelere på trafikkerte veier, Advarsel om helseskader på tobakksprodukter, Bedre kapasitet på fedmeoperasjoner]
    answer: [3]
    explanation: Fedmeoperasjoner behandler en tilstand som allerede har oppstått, hos enkeltpersoner i helsetjenesten (nedstrøms). Bilbeltepåbud, midtdelere og advarselsmerking er strukturelle tiltak rettet mot hele befolkningen.
  - n: "3.2"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilke yrkesgrupper blant menn har den laveste forventede levealder?
    options: [Bedriftsledere, Butikkekspeditører, Hotell- og restaurantansatte, Lærere]
    answer: [2]
    explanation: I norske data har menn i hotell- og restaurantyrker lavest forventet levealder (mye røyking og alkohol, lav inntekt og utdanning, skiftarbeid). Lærere og ledere ligger høyest.
  - n: "3.3"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-seleksjon-eller-kausalitet]
    type: single
    points: 1
    stem: Sosiale ulikheter i forhold til helse og arbeid i Norge
    options:
      - Det er relativt få med helseproblemer som kommer i arbeid sammenliknet med andre land
      - Det er ingen sammenheng mellom utdanningsnivå og risiko for å falle ut av arbeidslivet ved sykdom
      - Personer med lite utdanning har økt risiko for å falle ut av arbeidslivet dersom de blir syke
      - Personer med høy utdanning og høye arbeidskrav har økt risiko for å falle ut av arbeidslivet dersom de blir syke
    answer: [2]
    explanation: Personer med lite utdanning har oftere fysisk krevende jobber med liten fleksibilitet og færre alternativer. Sykdom fører derfor oftere til uførhet og varig utstøting fra arbeidslivet for dem (helserelatert seleksjon).
  - n: "3.4"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet, samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: "Forsdahl-Barker har lansert en hypotese som sier at det er en sammenheng mellom:"
    options:
      - mors vekt i svangerskapet og barnets vekt ved fødselen
      - mors kosthold i svangerskapet og risikoen for ADHD hos barnet
      - mors ernæring i svangerskapet og risikoen for kroniske sykdommer hos barnet i voksen alder
      - mors alder og risikoen for misdannelser hos barnet
    answer: [2]
    explanation: Forsdahl–Barker-hypotesen (fosterprogrammering) er et eksempel på livsløpsperspektivet. Dårlige oppvekstvilkår og underernæring i fosterlivet og tidlig barndom øker risikoen for hjerte- og karsykdom og diabetes i voksen alder.
  - n: "3.5"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset, samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: Hva menes med forebyggingsparadokset?
    options:
      - Det henviser til forebyggende tiltak som tilsynelatende ikke har effekt, f.eks at det bevilges stadig mere penger til tiltak innen psykisk helse, men likevel har et økende andel av befolkningen angst og depresjon
      - At de som raskest tar til seg informasjon om forebyggende tiltak er de som trenger det minst.
      - Når forebyggende tiltak mot ett helseproblem ser ut til å medvirke til økning av et annet helserelatert problem, f.eks. at antall snusere har økt etter hvert som antall røykere har gått ned
      - Hvis en ønsker å redusere sykeligheten og dødeligheten av høyt blodtrykk mest mulig i befolkningen er det bedre å henvende seg til dem som har liten risiko for slike sykdommer enn dem som har stor risiko
    answer: [3]
    explanation: Rose sitt forebyggingsparadoks går ut på at de fleste tilfellene kommer fra den store gruppen med lav eller moderat risiko. Et tiltak som gir liten nytte for hver enkelt, kan derfor gi stor gevinst for befolkningen. Alternativ 2 beskriver et annet fenomen (ulik respons på informasjon, som kan øke ulikheten).
  - n: "3.6"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Røyking forklarer mer av helseulikhetene i Nord-Europa enn i Sør-Europa. I følge Mackenbach kan dette skyldes
    options:
      - Kunnskapsnivået om helseskader ved røyking er mindre i Sør-Europa
      - Det er flere som røyker i Nord-Europa enn i Sør-Europa
      - Røykevanene er mer jevnt fordelt i forskjellige sosiale lag i Sør-Europa
      - Det er flere fattige i Sør-Europa enn i Nord-Europa
    answer: [2]
    explanation: Røykeepidemien kom senere til Sør-Europa. Der har røyking (særlig blant kvinner) ennå ikke blitt like skjevt fordelt mot lavere sosiale lag, og da kan røyking forklare mindre av helseforskjellene.
  - n: "3.7"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: Hvilke tiltak er mest «oppstrøms» i forhold til et sunt kosthold i befolkningen?
    options: [Mer undervisning om riktig kosthold, Kostholdsrådgivning fra helsepersonell, Subsidier på frukt og grønnsaker, Skolemat til alle i grunnskolen]
    answer: [2]
    explanation: Prisvirkemidler (subsidier og avgifter) endrer rammebetingelsene for hele befolkningen uten at den enkelte må gjøre noe aktivt. Undervisning og rådgivning ligger lenger nedstrøms.
  - n: "3.8"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/miljomedisin]
    type: single
    points: 1
    stem: Høyere forekomst av allergi og autoimmune sykdommer kan skyldes
    options:
      - At mennesker i økende grad eksponeres for miljøgifter
      - At mennesker utsettes for færre mikrober enn tidligere
      - At flere diagnostiseres pga. mer oppmerksomhet rundt disse sykdommene blant helsepersonell
      - At mennesker spiser mer mat med konserveringsmidler
    answer: [1]
    explanation: Ifølge hygienehypotesen (eller «old friends»-hypotesen) gir mindre mikrobiell eksponering tidlig i livet et dårligere «trent» immunsystem. Det øker risikoen for allergi og autoimmunitet.
  - n: "4.1"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-og-h3o-omregning, generell-kjemi/regnetyper/mol-og-konsentrasjon]
    type: single
    points: 1
    stem: |
      Vi har en prøve med et volum på 10 ml. Vi har målt at prøven inneholder 5 nmol $\ce{H3O+}$.

      Hva er pH til prøven?
    options: ["9,3", "8,3", "6,3", "0,3"]
    answer: [2]
    explanation: |
      $[\ce{H3O+}] = \frac{5 \times 10^{-9}\text{ mol}}{0{,}010\text{ L}} = 5 \times 10^{-7}$ M

      $pH = -\log(5\times10^{-7}) = 7 - 0{,}70 = 6{,}3$
  - n: "4.2"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/termodynamikk, generell-kjemi/regnetyper/gibbs-fri-energi]
    type: single
    points: 1
    stem: |
      En professor analyserer en viktig biokjemisk reaksjon med hjelp av kalorimetri. Hun måler de følgende verdiene:

      $\Delta H = +8{,}0$ kcal/mol

      $\Delta S = -28$ cal/(mol K)

      Hva kan vi si om reaksjonen basert på dette?
    options: [Reaksjonen er endergon og endoterm., Reaksjonen er endergon og eksoterm., Reaksjonen er eksergon og endoterm., Reaksjonen er eksergon og eksoterm.]
    answer: [0]
    explanation: $\Delta H > 0$ → endoterm. Med $\Delta S < 0$ blir $\Delta G = \Delta H - T\Delta S$ positiv ved alle temperaturer (begge ledd er positive) → endergon.
  - n: "4.3"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/losninger-og-konsentrasjon, generell-kjemi/regnetyper/osmolaritet-ekvivalenter-ionestyrke]
    type: single
    points: 1
    stem: |
      Vann er kroppens dominerende bestanddel og har mange viktige fysikalsk-kjemiske egenskaper. Begrepet osmolaritet er viktig i forhold til diffusjon.

      Hvordan defineres osmolaritet?
    options:
      - Osmolaritet er antall mol løste partikler per liter vann
      - Osmolaritet er diffusjon av partikler fra et område med lav konsentrasjon av vann
      - Osmolaritet er den negative logaritmen til hydrogenion-konsentrasjonen
      - Osmolaritet er antallet ladninger løst per liter vann.
    answer: [0]
    explanation: Osmolaritet = mol osmotisk aktive partikler per liter løsning (osmol/L). 1 M NaCl gir f.eks. ca. 2 osmol/L fordi saltet dissosierer til to ioner. Strengt tatt er det «per liter løsning». Per kg vann kalles osmolalitet.
  - n: "4.4"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/syrer-baser-og-ph]
    type: single
    points: 1
    stem: Hvilken av disse er en sterk syre?
    options: [10 mM HCl, 1 M fosforsyre, 1 mM NaOH, "0,1 M glutaminsyre"]
    answer: [0]
    explanation: Syrestyrke handler om graden av protolyse, ikke om konsentrasjonen. HCl protolyseres fullstendig selv ved lav konsentrasjon. Fosforsyre og glutaminsyre er svake syrer, og NaOH er en sterk base.
  - n: "4.5"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-aminosyre, proteiner/aminosyrer/alanin]
    type: single
    points: 1
    stem: |
      Vi har 50,0 ml med 0,1 M protonert alanin ($\ce{H2A+}$). Vi titrerer med 0,1 M NaOH.

      $K_{a1} = 4{,}6 \times 10^{-3}$

      $K_{a2} = 2{,}0 \times 10^{-10}$

      Beregn pH etter tilsetting av 80 ml NaOH.
    options: ["9,88", "9,52", "2,16", "2,71"]
    answer: [0]
    explanation: |
      $n(\ce{H2A+}) = 50{,}0\text{ ml} \times 0{,}1\text{ M} = 5{,}0$ mmol; $n(\ce{OH-}) = 80\text{ ml}\times0{,}1\text{ M} = 8{,}0$ mmol.

      De første 5,0 mmol gjør alt om til HA (første ekvivalenspunkt). De resterende 3,0 mmol gir 3,0 mmol $\ce{A-}$, og det er igjen 2,0 mmol HA.

      $pK_{a2} = -\log(2{,}0\times10^{-10}) = 9{,}70$, og $pH = 9{,}70 + \log\frac{3{,}0}{2{,}0} = 9{,}70 + 0{,}18 = 9{,}88$.
  - n: "4.6"
