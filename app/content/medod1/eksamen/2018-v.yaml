note: Ny/utsatt eksamen. Del 1 (1.1–1.12, akuttmedisin) er utelatt. Oppgåvene er nummererte etter del (2.x nomenklatur, 3.x samfunnsmedisin, 4.x kjemi/celle/protein).
questions:
  - n: "2.1"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/ordstilling-og-uttrykk]
    type: single
    points: 1
    stem: Hvilken kasus styrer preposisjonen cum?
    options: [Genitiv, Nominativ, Akkusativ, Ablativ]
    answer: [3]
    explanation: cum (med), sine (uten) og de/ex/in (i betydningen «i/på») styrer ablativ. post, ante og per styrer akkusativ.
  - n: "2.2"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adnominal-genitiv]
    type: single
    points: 1
    stem: Hvilket av følgende uttrykk inneholder en apposisjon?
    options: [Nervus recurrens, Ulcus duodeni, Musculus flexor, Ligamentum latum]
    answer: [2]
    explanation: Apposisjon = to substantiv i samme kasus, der det andre forklarer det første (musculus flexor = «muskelen bøyeren»). recurrens og latum er adjektiv (attributt), og duodeni er genitivsattributt.
