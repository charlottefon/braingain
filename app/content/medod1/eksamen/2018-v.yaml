    subject: proteiner
    topics: [proteiner/teori/enzymkatalyse, proteiner/teori/enzymer-egenskaper]
    type: text
    points: 5
    stem: Oppgi de 5 viktigste egenskaper til "active seat" (aktivt sete) i enzymer
    model: |
      1. **Aktive seter er tredimensjonale.** De dannes av residuer som kan ligge langt fra hverandre i sekvensen, men som kommer nær hverandre når proteinet folder seg.
      2. **Det aktive setet er en liten del av proteinet.** De fleste enzymer er større enn 12 kDa, men bare noen få residuer deltar i substratbindingen og selve reaksjonen.
      3. **Aktive seter er kløfter eller furer, vanligvis upolare (hydrofobe).** Vann holdes ute med mindre det selv deltar i reaksjonen, men setet kan ha ladde grupper.
      4. **Substratet bindes med mange svake interaksjoner**, vanligvis hydrogenbindinger, som posisjonerer substratet riktig.
      5. **Det aktive setet er spesifikt for substratet.** Det har komplementær form og gir riktig nærhet og orientering (lock-and-key/induced fit).
    modelSource: Sensorveiledning
  - n: "4.64"
    subject: proteiner
    topics: [proteiner/teori/myoglobin-og-hemoglobin, proteiner/aminosyrer/glutamat, proteiner/aminosyrer/valin]
    type: text
    points: 5
    stem: Forklar det du vet om sigdcelleanemi
    model: |
      Sigdcelleanemi er en **arvelig (genetisk) sykdom** som skyldes en punktmutasjon i genet for β-kjeden i hemoglobin. Mutasjonen gir én aminosyresubstitusjon: **Glu6 → Val6 (E6V)**.

      Glutamat i posisjon 6 er polar og negativt ladet og ligger på proteinets overflate. Når den byttes med den hydrofobe valinen, oppstår en hydrofob «klebeflekt». Spesielt i deoksygenert tilstand aggregerer Hb-tetramerene da til lange **fibrer**.

      Fibrene endrer Hb-strukturen og -funksjonen og gjør at de røde blodcellene forandres fra runde (bikonkave) til **sigdformede**, derav navnet. (Sigdcellene er stive, går lettere i stykker (hemolyse → anemi) og kan tette små kar.)
    modelSource: Sensorveiledning
  - n: "4.65"
    subject: cellebiologi
    topics: [generell-kjemi/regnetyper/ph-og-h3o-omregning, cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    figure: Siggaard-Andersen acid-base chart (vedlegg).
    stem: Hva skjer hvis pH i blodet endres fra 7,6 til 7,3?
    options:
      - Base excess (BE) faller med 3
      - pH påvirker ikke endringer i $p\ce{CO2}$
      - $p\ce{CO2}$ økes fra 4,0 til 6,3
      - Konsentrasjonen av syre-ioner ($\ce{H+}$) økes til det dobbelte
    answer: [3]
    explanation: |
      En pH-reduksjon på 0,3 enheter svarer til en faktor $10^{0{,}3} = 2$ i $[\ce{H+}]$:

      $10^{-7{,}3}/10^{-7{,}6} = 10^{0{,}3} \approx 2$ (fra ca. 25 til ca. 50 nmol/L).

      Hvordan BE og $p\ce{CO2}$ endrer seg, kan ikke avgjøres bare fra pH.
  - n: "4.66"
    subject: cellebiologi
    topics: [generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, cellebiologi/sammensatte-tema/multippel-sklerose-og-myelin, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: |
      En 62-årig mann er kjent på avdelingen. Han har hatt MS i lang tid og blitt jevnt dårligere i det siste året. De siste dagene har i tillegg hatt en akutt luftveisinfeksjon. Hans samboer sier hun har forsøkt å få ham til å bruke CPAP men at han får panikk når han må ligge med maske. På formiddagen i dag får hun ikke kontakt med ham og ringer til Nevrologisk avdeling, og han blir så innlagt. Vakthavende rekvirerer røntgen av lungene og en cerebral CT. Først får han svar på blodgasser:

      pH: 7,11 (norm. 7,35 - 7,45); $\text{PaCO}_2$: 23,56 (norm. 4,5 - 6,0 kPa)

      $\text{PaO}_2$: 8,94 (norm. 11,0 - 14,0 kPa); BE: 24,2 (norm. -3 - 3 mmol/L)

      Hva slags syre-base-forstyrrelse er dette?
    options:
      - Respiratorisk acidose
      - Metabolsk acidose som er delvis respiratorisk kompensert
      - Respiratorisk acidose som er delvis metabolsk kompensert
      - Metabolsk acidose
    answer: [2]
    explanation: pH er lav (acidose), og $\text{PaCO}_2$ er ekstremt høy, så den primære forstyrrelsen er respiratorisk (hypoventilering pga. MS-svekket respirasjonsmuskulatur og infeksjon). BE er sterkt positiv (+24), dvs. nyrene har holdt tilbake $\ce{HCO3-}$. Det er metabolsk kompensasjon, men pH er fortsatt lav, altså bare delvis kompensert.
  - n: "4.67"
    subject: cellebiologi
    topics: [generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: |
      En kvinne med langtkommen kronisk obstruktiv lungesykdom (KOLS), men uten annen kompliserende sykdom, har ved en blodgassanalyse en $p\ce{CO2}$ på 7,5 kPa (kiloPascal). Prøven ble tatt mens pasienten pustet romluft.

      **Hvilket annet funn vil være sannsynlig samtidig?**
    options:
      - pH > 7,4
      - $p\ce{O2}$ > 12 kPa
      - $p\ce{CO2}$ vil bli normalisert etter tilførsel av oksygen
      - BE (Base Excess) > 0
    answer: [3]
    explanation: Kronisk $\ce{CO2}$-retensjon gir respiratorisk acidose som nyrene kompenserer ved å holde tilbake $\ce{HCO3-}$. Da blir BE positiv. pH blir sjelden over 7,4 (kompensasjonen er ikke fullstendig), $p\ce{O2}$ er lav på romluft, og $\ce{O2}$-tilførsel kan heller øke $p\ce{CO2}$.
  - n: "4.68"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/jern-sporstoffer-og-oksygentoksisitet]
    type: single
    points: 1
    stem: |
      Hvilken av disse påstandene er riktig?

      **Velg ett alternativ**
    options:
      - Utskillelsen av jern er nøye regulert.
      - Jernoverskudd er bra for antioksidantforsvaret.
      - Jernmangel fører alltid til anemi (blodmangel).
      - Sitrusfrukter kan øke jernabsorbsjonen.
    answer: [3]
    explanation: C-vitamin (askorbat) reduserer $\ce{Fe^3+}$ til lettere absorberbart $\ce{Fe^2+}$ og øker opptaket av ikke-hem-jern. Kroppen har ingen regulert jernutskillelse (reguleringen skjer på absorpsjonen via hepcidin). Fritt jern er prooksidativt (Fenton-reaksjonen), og jernmangel kan foreligge uten anemi (tømte lagre).
  - n: "4.69"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/jern-sporstoffer-og-oksygentoksisitet]
    type: single
    points: 1
    stem: |
      Hvilket av disse sporelementene inngår **IKKE** i vurderingen av ernæringsstatus?

      **Velg ett alternativ**
    options: [Selen, Kobber, Sink, Kadmium]
    answer: [3]
    explanation: Selen, kobber og sink er essensielle sporelementer (bl.a. i glutationperoksidase og superoksiddismutase). Kadmium har ingen biologisk funksjon og er en toksisk miljøgift.
