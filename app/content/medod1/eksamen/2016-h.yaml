  - n: "5.23b"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-svak-syre, generell-kjemi/regnetyper/henderson-hasselbalch]
    type: single
    points: 1
    stem: |
      Samme titrering (100 ml 0,1 M HA, $K_a = 6 \times 10^{-6}$, titreres med 1 M NaOH).

      Beregn pH etter å ha tilsatt 5 ml NaOH.
    options: ["pH=5,7", "pH=5,2", "pH=6,1", "pH=7,5"]
    answer: [1]
    explanation: |
      $n(\ce{HA}) = 10$ mmol, $n(\ce{OH-}) = 5$ mmol → 5 mmol HA og 5 mmol A⁻ (halvtitrert).
