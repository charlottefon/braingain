      Hvilken kasus er pedis i uttrykket «digiti pedis dextri»?
    options: [Nominativ, Akkusativ, Genitiv]
    answer: [2]
    explanation: |
      pes, pedis (3. dekl.) – pedis er genitiv entall («fotens»), og dextri samsvarer med pedis.
  - n: "3.2c"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adnominal-genitiv, nomenklatur/uttrykk/musculus-flexor-hallucis-longus]
    type: single
    points: 1
    stem: |
      Hvilket ord er apposisjon i uttrykket «musculus flexor hallucis brevis operatus»?
    options: [Musculus, Hallucis, Flexor]
    answer: [2]
    explanation: |
      Apposisjon er et substantiv som står i samme kasus ved siden av hovedordet og forklarer det nærmere – *flexor* («bøyer») utdyper *musculus*. hallucis er genitiv.
  - n: "3.2d"
