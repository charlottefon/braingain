    stem: |
      Ved å plotte (1/enzymatisk reaksjonshastighet) mot (1/substratkonsentrasjon) oppnår man et Lineweaver-Burk-plott. I et eksperiment har man en inhibitor tilstede. I plottet ditt får man to rette linjer med ulike stigningstall som krysser i et gitt punkt på x-aksen.

      Hvilket av følgende alternativer er riktig:
    options:
      - Km endres i nærvær av en inhibitor
      - Reaksjonshastigheten forblir uendret ved tilstedeværelse av en inhibitor
      - Inhibitoren er en kompetitiv inhibitor («competitive inhibitor»)
      - Inhibitoren er en ikke-kompetitiv inhibitor («noncompetitive inhibitor»)
    answer: [3]
    explanation: |
      Skjæring med x-aksen er $-1/K_m$ – felles skjæringspunkt der betyr uendret Km. Ulik helning og ulikt y-skjæringspunkt ($1/V_{max}$) betyr redusert Vmax → (ren) ikke-kompetitiv hemming. Kompetitive hemmere gir linjer som krysser på y-aksen.
