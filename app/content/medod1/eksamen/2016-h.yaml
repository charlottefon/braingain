    points: 1
    stem: |
      Ta utgangspunkt i uttrykket «thrombosis arteriae cerebri anterioris».
      Til hvilket ord er «anterioris» et attributivt tillegg?
    options: [Arteriae, Cerebri, Thrombosis]
    answer: [0]
    explanation: |
      Det er arterien som er fremre (arteria cerebri anterior = hjernens fremre arterie); anterioris står derfor i genitiv i samsvar med arteriae.
