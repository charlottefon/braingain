questions:
  # ---------------- Medisinsk nomenklaturlære ----------------
  - n: "3.1a"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/ordstilling-og-uttrykk]
    type: single
    points: 1
    stem: |
      Hva må et uttrykk starte med?
    options: [Et adjektiv, Et substantiv, Et partisipp]
    answer: [1]
    explanation: |
      Et medisinsk-latinsk uttrykk starter med hovedordet, et substantiv i nominativ; attributter (adjektiv, genitiv) følger etter.
  - n: "3.1b"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/ordstilling-og-uttrykk]
    type: single
    points: 1
    stem: |
      I hvilken kasus må første ord stå?
    options: [Nominativ, Genitiv, Ablativ]
    answer: [0]
    explanation: |
      Hovedordet står i nominativ (grunnformen); f.eks. *fractura* colli femoris.
  - n: "3.1c"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adnominal-genitiv]
    type: single
    points: 1
    stem: |
      Hvilken kasus betegner eier/relasjon?
    options: [Akkusativ, Nominativ, Genitiv]
    answer: [2]
    explanation: |
      Genitiv svarer på «hvem/hva sin?» – f.eks. *cancer prostatae* = kreft i prostata (prostatas kreft).
  - n: "3.1d"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adjektiv-1-2-og-perfektum-partisipp]
    type: single
    points: 1
    stem: |
      Hva betyr kongruens?
    options: [Samsvar, Forskjell, Uavhengighet]
    answer: [0]
    explanation: |
      Kongruens (samsvarsbøyning) betyr at adjektivet står i samme kjønn, tall og kasus som substantivet det beskriver.
  - n: "3.1e"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adjektiv-1-2-og-perfektum-partisipp]
    type: single
    points: 1
    stem: |
      Hvilken handling uttrykker perfektum partisipp?
    options: [Framtidig, Fortidig, Samtidig]
    answer: [1]
    explanation: |
      Perfektum partisipp (f.eks. *operatus* = operert) uttrykker en fullført, fortidig handling; presens partisipp (*perforans*) uttrykker samtidig handling.
  - n: "3.2a"
    subject: nomenklatur
    topics: [nomenklatur/ordliste, nomenklatur/uttrykk/dens-caninus]
    type: single
    points: 1
    stem: |
      Hva betyr «dens molaris»?
    options: [Hjørnetann, Jeksel, Fortann]
    answer: [1]
    explanation: |
      dens molaris = jeksel (kverntann). Hjørnetann = dens caninus, fortann = dens incisivus.
  - n: "3.2b"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/tredje-deklinasjon-m-f, nomenklatur/uttrykk/musculus-extensor-digiti-minimi-pedis-dextri]
