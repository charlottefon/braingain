  # ---------------- Ulikskap i helse ----------------
  - n: "4.1a"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Barnedødeligheten i Norge er 2/1000. Hva er den i Angola?
    options: [200/1000, 100/1000, 50/1000, 5/1000]
    answer: [1]
    explanation: |
      Angola hadde en av verdens høyeste barnedødeligheter, rundt 100 per 1000 – omtrent 50 ganger høyere enn i Norge. Det illustrerer de store globale helseforskjellene.
  - n: "4.1b"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: "Ulikhetene mellom de 5 % rikeste landene i verden og lavinntektsland har:"
    options:
      - Økt siste 60 år
      - Minket siste 60 år
      - Vært stabile siste 60 år
      - Minket i perioden 1950-1980 og har siden økt
    answer: [1]
    explanation: |
      Globalt har forskjellene i helse (f.eks. levealder og barnedødelighet) mellom rike og fattige land blitt mindre de siste tiårene, fordi lav- og mellominntektsland har hatt stor forbedring.
  - n: "4.1c"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Hvilken påstand om jobbkrav er mest riktig?
    options:
      - Høye krav kan være skadelig dersom det er kombinert med at arbeidstakerne har liten kontroll over sin egen arbeidshverdag
      - Høye krav på jobb gir økt risiko for helseproblemer
      - Høye krav på jobb gir redusert risiko for helseproblemer
      - Høye krav kombinert med høy kontroll over egen arbeidshverdag gir økt risiko for helseproblemer
    answer: [0]
    explanation: |
      Krav–kontroll-modellen (Karasek) – det er kombinasjonen høye krav og lav kontroll («high strain») som gir økt risiko, f.eks. for hjerte-kar-sykdom. Høye krav med høy kontroll («aktive jobber») er ikke skadelig.
  - n: "4.1d"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: |
      Hvilken påstand om helsetjenesten i Norge er riktig?
    options:
      - De med lavest sosioøkonomisk status bruker helsetjenestene mest
      - De med lavest sosioøkonomisk status bruker helsetjenestene minst
      - De med lavest sosioøkonomisk status har større sjanse for å bli henvist til spesialist
      - Prognosen etter behandling har ingen sammenheng med sosioøkonomisk status i Norge
    answer: [1]
    explanation: |
      Fasiten er at de med lavest sosioøkonomisk status bruker helsetjenestene minst i forhold til behovet sitt (særlig spesialisthelsetjenesten). Det motsatte er det omvendte omsorgsprinsippet («inverse care law»). Nyanse – målt i antall besøk bruker grupper med lav SØS ofte fastlegen mer, men de blir sjeldnere henvist til spesialist og har dårligere prognose.
  - n: "4.1e"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-proporsjonal-universalisme]
    type: single
    points: 1
    stem: "Den mest effektive måten å forebygge sosiale ulikheter i helse i Norge er:"
    options:
      - Informasjonskampanjer om hva som er anbefalt treningsmengde per dag
      - Å gi folk individuelt tilpasset rådgivning om trening på legekontoret
      - Støtte opprettelsen av flere treningssentre
      - Obligatorisk fysisk aktivitet hver dag i grunnskolen
    answer: [3]
    explanation: |
      Et strukturelt, universelt tiltak som når alle barn uavhengig av foreldrenes ressurser, utjevner. Informasjonskampanjer, individuell rådgivning og treningssentre benyttes mest av dem med høy utdanning/inntekt og kan øke ulikheten.
  - n: "4.2a"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      *(Figur: «Totaldødelighet blant menn 45–59 år etter utdanning, Norge 1970–1990-årene» (Zahl et al. 2003). Døde per 100 000 (aldersjustert) for perioder 1970–77, 1980–87 og 1990–97 i fire utdanningsgrupper (0–9, 10–12, 13–16 og 17+ år). Dødeligheten faller i alle grupper, men raskest blant de høyt utdannede; gruppen med 0–9 år ligger høyest (ca. 1150 → 980), gruppen med 17+ år lavest (ca. 730 → 380). Relativ ulikhetsindeks (RII) = 1,7, 2,1 og 2,8.)*

      Ulikheter i helse i Norge i dag skyldes...
    figure: Linjediagram over totaldødelighet etter utdanningsnivå, Norge 1970–1997, med RII 1,7 → 2,1 → 2,8.
    options:
      - ...aldersfordeling i samfunnet
      - ...forskjeller i utdanning
      - ...at noen grupper ikke har kunnskap om kosthold, trening og røyking
      - ...genetikk
    answer: [1]
    explanation: |
      Utdanning (sammen med inntekt og yrke) er en sentral sosial helsedeterminant, og dødeligheten følger en gradient etter utdanningslengde. Kunnskapsmangel alene forklarer lite – ulikhetene er strukturelt betinget.
  - n: "4.2b"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Hva måler vi med relativ ulikhetsindeks?
    options:
      - Totaldødeligheten i gruppen med lavest utdanning
      - Totaldødeligheten i gruppen med høyest utdanning
      - Forskjellen i totaldødelighet i forskjellige utdanningsgrupper
      - Totaldødeligheten i forskjellige tidsperioder
    answer: [2]
    explanation: |
      RII er et relativt mål på ulikhet over hele den sosiale gradienten – forholdet mellom dødeligheten nederst og øverst i (utdannings)fordelingen. RII = 1 betyr ingen ulikhet.
  - n: "4.3a"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Hvordan har den relative ulikhetsindeksen utviklet seg i forhold til utdanning og totaldødelighet de siste 30 årene?
    options:
      - Den har vært stabil
      - Den har blitt større
      - Den har gått opp og ned fra år til år
      - Den har blitt mindre
    answer: [1]
    explanation: |
      RII økte fra 1,7 til 2,8 (figuren i 4.2). Dødeligheten falt i alle grupper, men mest blant de høyt utdannede, så de relative forskjellene ble større.
  - n: "4.3b"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Hva er ønsket utvikling av relativ ulikhetsindeks?
    options: [At den øker, At den holder seg konstant, At den går mot 1, At den går mot 0]
    answer: [2]
    explanation: |
      RII er et forholdstall; RII = 1 betyr lik dødelighet i alle utdanningsgrupper. Den kan ikke gå mot 0 med mindre de lavest utdannede skulle få lavere dødelighet enn de høyest utdannede.
  - n: "4.3c"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset]
    type: single
    points: 1
    stem: |
      Begrepet «høyrisikostrategi» henviser til hva?
    options:
      - Forebyggende tiltak som har svært usikkert evidensgrunnlag
      - Forebyggende tiltak som er rettet mot særlig utsatte grupper
      - Forebyggende tiltak som kan ha potensielt skumle bivirkninger
      - Forebyggende tiltak med høy risiko for liten effekt
    answer: [1]
    explanation: |
      Høyrisikostrategien (Rose) retter seg mot individer/grupper med høy risiko, i motsetning til befolkningsstrategien som forskyver risikoen i hele befolkningen.
  - n: "4.3d"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: |
      Hvilket av følgende tiltak er mest «oppstrøms» i forhold til å utjevne sosiale ulikheter i helse?
    options:
      - Opprettelse av kommunale frisklivssentraler
      - Skolekampanjer som oppfordrer foreldre til å la elevene gå eller sykle til skolen i stedet for å kjøre dem
      - Progressiv skattlegging av inntekt og formue
      - Flere helsestasjonskontroller i småbarnsalderen
    answer: [2]
    explanation: |
      Oppstrømstiltak endrer den sosioøkonomiske fordelingen selv (inntekt, utdanning, klasse). Progressiv skatt omfordeler inntekt; de andre tiltakene er midt- eller nedstrøms.
  - n: "4.3e"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: |
      Råd om kosthold og fysisk aktivitet hos person med økt risiko for hjerteinfarkt er et...
    options: [...oppstrøms tiltak, ...midtstrøms tiltak, ...nedstrøms tiltak, Ingen av delene]
    answer: [2]
    explanation: |
      Individrettet rådgivning i helsetjenesten til en som allerede har høy risiko, er et nedstrømstiltak (og en høyrisikostrategi).
  - n: "4.4a"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: |
      Røykeforbud på restauranter for å forebygge røykerelaterte helseproblemer er et...
    options: [...oppstrøms tiltak, ...nedstrøms tiltak, ...høyrisikostrategi tiltak, Ingen av delene]
    answer: [0]
    explanation: |
      Et lovpålagt, strukturelt tiltak som endrer omgivelsene for hele befolkningen regnes som oppstrøms (befolkningsstrategi), i motsetning til individrettet røykesluttbehandling (nedstrøms).
  - n: "4.4b"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: single
    points: 1
    stem: |
      Hva er viktigste grunn til at levealderen har økt i Norge de siste 100 årene?
    options:
      - Vi har fått effektive midler mot infeksjoner (antibiotika)
      - Vi har fått bedre behandling av kreftsykdommer
      - Vi har fått bedre behandling av hjerte-kar sykdommer
      - Vi har fått lavere spedbarnsdødelighet
    answer: [3]
    explanation: |
      Fallet i spedbarns- og barnedødelighet (bedre ernæring, boforhold, hygiene, vann og kloakk) bidro mest til økt forventet levealder; mye av økningen skjedde før antibiotika kom på 1940-tallet.
  - n: "4.4c"
