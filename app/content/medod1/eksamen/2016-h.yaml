    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Hvilke av følgende yrkesgrupper har lavest forventet levealder i Norge?
    options:
      - Lærere og annet undervisningspersonale
      - Helsepersonell
      - Ansatte i handel og kontor
      - Ansatte i hotell og restaurant
    answer: [3]
    explanation: |
      Hotell- og restaurantansatte har kortere utdanning, lavere inntekt, mer skiftarbeid og høyere forekomst av røyking og alkoholbruk enn de andre gruppene – i tråd med den sosiale gradienten.
  - n: "4.4d"
