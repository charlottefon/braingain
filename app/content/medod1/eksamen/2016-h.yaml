    type: single
    points: 1
    stem: "I følge «Oxford Textbook of Global Public Health» brukes begrepet «relativ fattigdom» for å beskrive:"
    options:
      - Forskjellen i andelen fattige i befolkningen i forskjellige land
      - Evnen til å fungere sosialt i forhold til normative krav til levestandard i det samfunnet en tilhører
      - Endringer i fattigdomsgrense over tid i et samfunn
      - Prosentvis forskjell i inntekt mellom de 10 % som tjener mest og de 10 % som tjener minst i samfunnet
    answer: [1]
    explanation: |
      Relativ fattigdom måles mot levestandarden i det samfunnet man lever i (f.eks. under 60 % av medianinntekten) – å mangle ressurser til å delta på lik linje med andre. Absolutt fattigdom handler om å mangle det man trenger for å overleve.

