  # ───────────── Cellebiologi, kjemi og proteiner ─────────────
  - n: 43
    subject: proteiner
    topics: [proteiner/teori/proteinmetoder]
    type: single
    points: 1
    stem: Hvilken egenskap ved proteiner utnyttes IKKE i rensing?
    options: [Størrelse, Løselighet, Sekundærstruktur, Bindingsaffinitet]
