    stem: Du har isolert to enzymer som katalyserer den samme reaksjonen og måler hasigheten for produktdannelse spektrofotometrisk. Begge enzymene er stabile og aktive ved temperaturene du måler ved. Du observerer at hastigheten for produktdannelse er dobbelt så høy ved 37 grader som ved 25 grader Celsius for enzym 1. For enzym 2 observerer du tilnærmet den samme hastigheten for produktdannelse ved de to ulike temperaturene. Hva indikerer disse observasjonene?
    options:
      - Enzym 1 har en større forskjell i fri energi mellom substrat og produkt enn enzym 2.
      - Enzym 1 har en mindre forskjell i fri energi mellom substrat og transisjonstilstand enn enzym 2.
      - Enzym 1 har en mindre forskjell i fri energi mellom substrat og produkt enn enzym 2.
      - Enzym 1 har en større forskjell i fri energi mellom substrat og transisjonstilstand enn enzym 2.
    answer: [1]
    explanation: |
      Forskjellen mellom substrat og produkt (ΔG for reaksjonen) er den samme for begge enzymene, siden de katalyserer samme reaksjon – så svaret må handle om aktiveringsenergien.

      Merk: Det offisielle svaret virker feil. Etter Arrhenius ($k = A e^{-E_a/RT}$) er det reaksjonen med **høyest** aktiveringsenergi som er mest temperaturavhengig: en dobling fra 25 til 37 °C tilsvarer $E_a \approx R\ln 2 / (1/298 - 1/310) \approx 44$ kJ/mol, mens enzym 2 (nesten ingen temperaturavhengighet) må ha svært lav barriere. Enzym 1 burde altså ha *større* forskjell mellom substrat og transisjonstilstand (siste alternativ).
