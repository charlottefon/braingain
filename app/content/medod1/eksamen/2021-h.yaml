  # ───────────── Samfunnsmedisin ─────────────
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Se på grafen med oversikten over GINI indeksen. Hvilket utsagn er korrekt?
      **Velg ett alternativ:**

      | Land | Gini-koeffisient |
      |---|---|
      | Slovakia | 0,236 |
      | Island | 0,250 |
      | Norge | 0,262 |
      | Danmark | 0,264 |
      | Finland | 0,269 |
      | Sverige | 0,280 |
      | Tyskland | 0,289 |
      | Frankrike | 0,301 |
      | Spania | 0,330 |
      | Storbritannia | 0,366 |

      *Kilde: OECD (2021), Income inequality (indicator).*
    figure: Søylediagram (OECD 2021) over Gini-koeffisient for inntekt; verdiene er gjengitt i tabellen.
    options:
      - Sverige er det nordiske landet med lavest inntektsulikhet
      - Frankrike har levere inntektsulikhet enn alle de nordiske landene
      - Norge har høyere inntektsulikhet enn Finland
      - Island er det nordiske landet med lavest inntektsulikhet
    answer: [3]
    explanation: Lavere Gini = mindre ulikhet. Island (0,250) har lavest blant de nordiske; Sverige (0,280) har høyest av de nordiske, Frankrike (0,301) ligger over alle, og Norge (0,262) ligger under Finland (0,269).
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: single
    points: 1
    stem: "Alle stater går gjennom en epidemiologisk transisjon, om enn på ulike tidspunkt og i ulik hastighet. Modellen har mye til felles med den demografiske transisjonen. Hvilke av disse endringene skjer først:"
    options:
      - Dødsraten går ned
      - Alderdomssykdommer dominerer
      - Fødselsraten går ned
      - Ingen av alternativene er riktig
    answer: [0]
    explanation: Først faller dødeligheten (særlig av infeksjoner og blant barn) mens fødselsraten fortsatt er høy – det gir befolkningsvekst. Fødselsraten faller senere, og til slutt dominerer kroniske «alderdomssykdommer».
  - n: 15
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: Hvilket av følgende tiltak er mest «oppstrøms» i forhold til å utjevne sosiale ulikheter i helse?
    options:
      - Tiltak som forsøker å få unge med mye skolefravær ut i arbeidslivet
      - Gratis tannhelsetjeneste for voksne
      - Tilbud om røykesluttkurs på kommunale frisklivssentraler
      - Sunnere mat i skolekantiner
    answer: [0]
    explanation: Oppstrøms tiltak virker på de bakenforliggende sosiale determinantene (utdanning, arbeid, inntekt). Arbeidsinkludering av unge med skolefravær påvirker selve livssjansene; tannhelse og røykeslutt er nedstrøms (helsetjeneste/individuell atferd), og skolemat er et livsstilstiltak.
  - n: 16
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilket utsagn beskriver best sammenhengen mellom forventet levealder (på y-aksen) etter husholdningsinntekt (på x-aksen) i Norge i perioden 2005 til 2015?
    options:
      - En brattere kurve for de høyeste inntektene sammenlignet med de med de laveste inntektene
      - En brattere kurve for de med lavest inntekt enn de med høyest inntekt
      - En flat kurve for de høyeste inntektene
      - En jevn stigning i levealder fra de med lavest inntekt til de med høyest inntekt
    answer: [1]
    explanation: Kurven er en gradient gjennom hele inntektsfordelingen, men den er brattest nederst – en liten inntektsøkning blant de fattigste henger sammen med mye lengre levealder, mens kurven flater ut (men ikke helt) blant de rikeste (Kinge et al. 2019).
  - n: 17
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: Hva innebærer en høyrisikostrategi i folkehelsearbeidet?
    options:
      - Innebærer at en setter i gang tiltak som krever lite ressurser, men har høy risiko for de det gjelder
      - Innebærer at en setter i gang tiltak mot de med antatt høyest risiko
      - Innebærer at en setter i gang tiltak som krever mye ressurser og høy risiko for å berøre andre tiltak
      - Innebærer at en setter i gang tiltak med lav evidens og høy risiko for å feile
    answer: [1]
    explanation: Høyrisikostrategien (Rose) retter tiltak mot individene med høyest risiko, i motsetning til befolkningsstrategien som forsøker å flytte hele risikofordelingen.
  - n: 18
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvordan har forskjell i forventet levealder mellom 35-åringer som har grunnskole og de som har høyskole/universitetsutdanning utviklet seg fra 1960 årene og frem til 2020?
    options:
      - For kvinner har det vært en særlig økning siden 2000-tallet
      - Forskjellene har ligget jevnt høyt for kvinner
      - For menn var det en økning i forskjell frem til begynnelsen av 2000-tallet og deretter en avflating
      - Forskjellene har ligget jevnt høyt for menn
    answer: [2]
    explanation: Utdanningsforskjellene i levealder har økt markant siden 1960-tallet for begge kjønn (de var altså ikke «jevnt høye»). For menn økte forskjellen fram til begynnelsen av 2000-tallet og har deretter flatet ut.
  - n: 19
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: I en kommune kommer det frem at mange elever har psykiske plager. Det ser ut til å særlige være hyppig blant barn og unge i lavinntektsfamilier. Hvilket tiltak kan antas å ha størst effekt på utjevning av sosial ulikhet i psykisk helse?
    options:
      - Gi god informasjon til lærere om hvordan foreldre kan hjelpe barn som har symptomer på angst og depresjon
      - Be et firma som Dr.Dropin etablere seg på nærmiljøets handlesenter
      - Etablere gratis fritidsklubb for barn og ungdom med vekt på inkluderende aktiviteter
      - Mer vekt på psykisk helse i fagene i skolen
    answer: [2]
    explanation: Et gratis, inkluderende lavterskeltilbud fjerner økonomiske barrierer og når barn i lavinntektsfamilier (strukturelt tiltak). Informasjonstiltak og kommersielle helsetilbud brukes mest av de ressurssterke og kan øke ulikheten.
  - n: 20
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: The inverse care law beskriver
    options:
      - At de med størst behov for helse- og omsorgstjenester har det dårligste tjenestetilbudet
      - At det kan være små tiltak som kan være med på å bedre helsen i et samfunn
      - At helsehjelp til grupper med høy sosial status ofte fører til overbehandling
      - At det tjenestetilbudet som er mest effektivt koster minst
    answer: [0]
    explanation: Tudor Hart (1971) – tilgjengeligheten av god helsehjelp varierer omvendt med behovet i befolkningen den betjener.
  - n: 21
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilket element er av særlig betydning i den psykososiale forklaringsmodellen for sosial ulikheter i helse?
    options: [Gener, Stress, Røyking, Ernæring]
    answer: [1]
    explanation: Den psykososiale modellen forklarer ulikhet med kronisk stress (lav kontroll, lav sosial status, usikkerhet) som virker biologisk via stressakser. Røyking og ernæring hører til den atferdsmessige (kulturelle) forklaringsmodellen.
  - n: 22
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hva menes med begrepet «dobbelt urettferdighet» når en snakker om ulikhet i helse?
    options:
      - Mennesker med lavere sosial bakgrunn har både dårligere levekår og opplever mer sykdom og tidlig død
      - De med økt genetisk sårbarhet for sykdom ender også ofte nederst i det sosiale hierarkiet
      - Mennesker med lavere sosial bakgrunn har både dårligere levekår og har dårligere evner til å ta gode valg
      - Det å ta uheldige valg om livsstil fører til mer sykdom og kan føre deg lenger ned i det sosiale hierarkiet
    answer: [0]
    explanation: Urettferdigheten er dobbel fordi de som allerede har dårligst levekår (urettferdig fordeling av ressurser) i tillegg får mer sykdom og kortere liv.
  - n: 23
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-tuberkulosen]
    type: single
    points: 1
    stem: Sunnhetsloven av 1860 - helsevesenets grunnlov - var inspirert av to konkurrerende etiologier, fra henholdsvis kontagionister og miasmatikere. Hvilket av disse tiltakene var det miasmatikerne ivret mest for?
    options:
      - Sanitetstiltak
      - Segregering (isolasjon av syke)
      - Smittesporing
      - Karantene
    answer: [0]
    explanation: Miasmatikerne mente sykdom skyldtes «dårlig luft» fra forråtnelse og skitt, og ville derfor ha sanitære tiltak (renovasjon, kloakk, rent vann, bedre boliger). Isolasjon, smittesporing og karantene er kontagionistenes tiltak.
  - n: 24
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset]
    type: single
    points: 1
    stem: Hva beskriver forebyggingsparadokset?
    options:
      - Det beskriver at det er vanskelig å se umiddelbare effekter av forebygging
      - Det beskriver at selv om det er mange kjente risikofaktorer er det fremdeles vanskelig å forebygge brystkreft
      - Det beskriver at det selv med tilbud om vaksiner dør kvinner av livmorhalskreft
      - Det beskriver at det å forebygge hos mange med lav risiko kan ha større effekter enn store endringer hos få med stor risiko
    answer: [3]
    explanation: Rose – et tiltak som gir stor gevinst for befolkningen gir lite for hver enkelt deltaker, fordi de fleste tilfellene kommer fra den store gruppen med lav/moderat risiko.
  - n: 25
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilken påstand er mest riktig når det gjelder formuesfordelingen i Norge?
    options:
      - Formuesulikheten er større enn inntekstulikheten
      - Formuesulikheten og innteksulikheten er av samme størrelsesorden
      - Formuesulikheten er mindre i Norge enn de fleste andre OECD land
      - Formuesulikheten er mindre enn inntekstulikheten
    answer: [0]
    explanation: I Norge er formue langt skjevere fordelt enn inntekt (Gini for formue er mye høyere enn for inntekt), og formuesulikheten er ikke spesielt lav i internasjonal sammenheng.

