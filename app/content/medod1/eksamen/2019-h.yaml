    answer: [0]
    explanation: |
      $[\ce{H3O+}] = \dfrac{5 \times 10^{-9}\ \text{mol}}{0{,}010\ \text{L}} = 5 \times 10^{-7}$ M, så $pH = -\log(5 \times 10^{-7}) = 6{,}30$.
  - n: 64
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/protolyttfordeling, cellebiologi/sammensatte-tema/multippel-sklerose-og-myelin]
    type: single
    points: 1
    stem: |
      Myelin i både det sentrale og perifere nervesystemet inneholder flere spesifikke proteiner. Ett av disse er basisk myelinprotein (MBP), som er viktig for dannelse av myelin og som deltar i sykdomsprosesser i for eksempel multippel sklerose.
      Den elektriske ladningen i myelinproteiner er svært viktig for å binde sammen lipidmembranene i myelin.
      MBP-proteinet har 169 aminosyrer, og mange av disse har sidekjeder som kan fungere som syrer eller baser:

      - 18 stykker arginin ($pK_a \approx 12$)
      - 9 stykker asparaginsyre ($pK_a \approx 4$)
      - 2 stykker glutaminsyre ($pK_a \approx 4$)
      - 13 stykker lysin ($pK_a \approx 10$)
      - 10 stykker histidin ($pK_a \approx 6$)

      Hva blir elektrisk nettoladning til MBP ved nøytral pH (pH=7)?
    options: ["+30", "+20", "+31", "-1"]
    answer: [1]
    explanation: |
      Ved pH 7: Arg og Lys (pKa > 7) er protonert → +18 + 13 = +31. Asp og Glu (pKa < 7) er deprotonert → −9 − 2 = −11. His (pKa 6 < 7) er hovedsakelig nøytral (bare ~9 % protonert). N- og C-terminalen opphever hverandre.
      Netto: +31 − 11 = **+20**. (+30/+31 får man om man teller histidin som positivt eller glemmer de sure.)
