    type: single
    points: 1
    stem: Chymotrypsin er et viktig enzym. Hvilken katalytisk aktivitet har chymotrypsin?
    options:
      - Chymotrypsin hydrolyserer proteiner og estere
      - Chymotrypsin er en kinase som fosforylerer Ser-residuer
      - Chymotrypsin hydrolyserer kun estere
      - Chymotrypsin binder oksygen
    answer: [0]
