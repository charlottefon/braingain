      Velg det alternativet nedenfor som **IKKE** er betegnende for reaksjonen på bildet.

      Reaksjonen på bildet: 3-bromo-3-metylheksan i vandig aceton danner et plant karbokation, som angripes av $\ce{H2O}$ (−H⁺) fra begge sider og gir to enantiomere 3-metylheksan-3-ol.

      Utgangsstoffet er tegnet med Br opp (i planet), $\ce{CH3}$ til høyre (i planet), $\ce{CH3CH2}$ til venstre på stiplet kile (bak planet) og $\ce{CH3CH2CH2}$ ned til venstre på heltrukket kile (mot betrakteren).
    figure: Reaksjonsskjema – kilestrektegnet 3-bromo-3-metylheksan → plant karbokation (tom p-orbital) → to speilvendte 3-metylheksan-3-ol-produkter. Stereokjemien til utgangsstoffet er beskrevet i oppgaveteksten.
    options:
      - IUPAC-navnet til utgangsstoffet (reaktanten) er (S)-3-Bromo-3-metylhexan
      - Produktene av reaksjonen foreligger som både R- og S-konfigurasjon
      - Dette er en Sn1-reaksjon
      - Produktet vil samlet sett ikke være optisk aktivt (rasemisk)
    answer: [0]
    explanation: |
      Prioritet: Br > propyl > etyl > metyl. Metyl (lavest) ligger i planet, så man må se langs C–CH₃-bindingen; da går Br → propyl → etyl med klokka → reaktanten er **(R)**, ikke (S).
      De øvrige utsagnene stemmer: tertiært substrat + protisk løsemiddel gir SN1 via et plant karbokation, angrep fra begge sider gir R og S i like mengder (rasemat, optisk inaktivt).
