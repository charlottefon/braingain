      Vi vet:
      $\ce{Ag+ + e- -> Ag(s)}$   $E^0 = +0{,}799$ V
      $\ce{Sn^2+ + 2e- -> Sn(s)}$   $E^0 = -0{,}136$ V
    options: ["E = +1,666 V", "E = +0,926 V", "E = +0,867 V", "E = -1,003 V"]
    answer: [2]
    explanation: |
