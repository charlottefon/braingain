    stem: Ladninga til et polypeptid er avhengig av pH. Hva er ladning til et pentapeptid med sekvens Ala-Gly-Tyr-Lys-Val ved pH 7?
    options: ["0", "-1", "+1", "+3"]
    answer: [2]
    explanation: Ved pH 7 er N-terminalen $\ce{-NH3+}$ (+1), lysins sidekjede $\ce{-NH3+}$ (+1) og C-terminalen $\ce{-COO-}$ (−1). Tyrosin (pKa ~10) er uladet. Netto +1.
