    topics: [proteiner/teori/proteinmetoder]
    type: single
    points: 1
    stem: SDS-PAGE (Sodiumdodecylsulphate-polyacrylamide gel electrophoresis) er en ofte brukt teknikk for å studere og separere proteiner i en gel ved hjelp av et elektrisk felt. Hva er det viktigste parameteret for separasjonen av proteinene?
    options: [Proteinets totale ladning, Proteinets densitet, Proteinets størrelse, Proteinets isoelektriske punkt]
    answer: [2]
    explanation: SDS denaturerer proteinene og gir dem en jevn negativ ladning per masseenhet, så de separeres bare etter størrelse (masse). pI brukes i isoelektrisk fokusering.
  - n: 110
    subject: proteiner
    topics: [proteiner/teori/myoglobin-og-hemoglobin, proteiner/aminosyrer/valin]
    type: single
    points: 1
    stem: Mutasjoner i hemoglobin- (Hb)-gener fører til unormal binding og tilførsel av oksygen. Hb-mutanten HbS er knyttet til sigdcelleanemi. HbS aggregerer og former langstrakte fibrer som til og med endrer formen på røde blodceller og kan hindre blodstrømmen i kapillærene. Hva er den molekylære mekanismen for aggregering av HbS?
    options:
      - HbS er posttranslasjonelt modifisert
      - Mutasjonen fører til at en hydrofob aminosyre er plassert i overflaten av HbS-subenhetene, noe som fremkaller ugunstige interaksjoner mellom subenhetene
      - Hem-gruppen i hver HbS-subenhet stabler seg på toppen av hverandre
      - Mutasjonen fører til repulsive elektrostatiske interaksjoner, og HbS-subenheter interagerer ikke med hverandre for å danne tetramerer
    answer: [1]
    explanation: Glu6Val i β-kjeden gir en hydrofob valin på overflaten som binder til en hydrofob lomme på et annet deoksy-HbS-tetramer, slik at molekylene polymeriserer til fibre. («Ugunstige» betyr her uønskede, patologiske interaksjoner.)
  - n: 111
    subject: proteiner
    topics: [proteiner/teori/enzymkatalyse, proteiner/aminosyrer/serin]
    type: single
    points: 1
    stem: Hva er rollen til «oxyanion-hole» i chymotrypsin og andre serinproteaser?
    options:
      - Å hjelpe enzymet til å stabilisere det tetrahedrale intermediatet i reaksjonen
      - Å hjelpe enzymet å binde seg til et bestemt substrat
      - Å plassere substratet i riktig retning med hensyn til den katalytiske triaden
      - Å stabilisere produktet
    answer: [0]
    explanation: Oksyanionhullet er NH-grupper i ryggraden som hydrogenbinder til den negativt ladde oksygenet i det tetraedriske intermediatet (og transisjonstilstanden). Substratspesifisiteten bestemmes av S1-lommen.
  - n: 112
    subject: proteiner
    topics: [proteiner/teori/peptidbindingen]
    type: single
    points: 1
    stem: Hvilke av disse egenskapene karakteriserer peptidbindingen i proteiner ?
    figure: Dipeptid +H3N–CH(R1)–C(=O)–NH–CH(R2)–COO⁻ med en pil som markerer peptidbindingen (C–N).
    options:
      - De fire atomene (O,C,N,H) er i samme plan
      - Alle utsagnene er riktige
      - Den har delvis dobbeltbinding-karakter
      - Peptidbindinger roterer ikke
    answer: [1]
    explanation: Resonans mellom C=O og nitrogenets ensomme par gir C–N-bindingen delvis dobbeltbindingskarakter, så den er plan (O, C, N, H og begge Cα i samme plan) og roterer ikke fritt. Fleksibiliteten ligger i φ- og ψ-vinklene.
  - n: 113
    subject: proteiner
    topics: [proteiner/teori/enzymkatalyse]
    type: single
    points: 1
    stem: Hva er riktig om enzymatisk katalyse?
    options:
      - Den katalytiske aktiviteten er ikke avhengig av temperatur
      - Enzymet må være til stede i samme konsentrasjon som substratet
      - Enzymer endrer ikke likevektskonstanten for en gitt reaksjon
      - Enzymer endrer likevektskonstanten for en gitt reaksjon
    answer: [2]
    explanation: Enzymer senker aktiveringsenergien likt for begge retninger og endrer derfor bare hvor fort likevekten nås, ikke K. Enzymer virker i katalytiske (små) mengder.
  - n: 114
    subject: proteiner
    topics: [proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: Regulering av enzymaktivitet inkluderer reversible og irreversible mekanismer. Hvilken av disse regulerende mekanismene er irreversibel?
    options: [Kompetitiv inhibisjon, Acetylering (for eks. av histoner), Proteolytisk aktivering, Allosterisk regulering]
    answer: [2]
    explanation: Ved proteolytisk aktivering kløyves peptidbindinger i et zymogen (f.eks. kymotrypsinogen → kymotrypsin); dette kan ikke reverseres. Acetylering kan fjernes av deacetylaser.
  - n: 115
    subject: proteiner
    topics: [proteiner/teori/enzymregulering, proteiner/teori/folding-og-modifisering]
    type: single
    points: 1
    stem: "Fosforylering av utvalgte residuer er en viktig mekanisme for regulering av enzymaktivitet. Velg det korrekte utsagnet om fosforylering:"
    options:
      - Fosforylering er en irreversibel regulerende mekanisme
      - Fosforylering involverer ikke kovalent binding av fosfatgrupper til proteiner
      - Fosforylering utføres av proteinkinaser
      - Fosforylerering utføres av proteinfosfataser
    answer: [2]
    explanation: Proteinkinaser overfører fosfat fra ATP kovalent til Ser, Thr eller Tyr. Fosfataser fjerner fosfatet igjen, så mekanismen er reversibel.
  - n: 116
    subject: proteiner
    topics: [proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: "Det faktum at allosteriske enzymer er bemerkelsesverdig følsomme for kontroll, gjør dem til ideelle kandidater for å katalysere:"
    options:
      - Den konstante konversjonen av metabolitt A til B
      - Det hastighetsbegrensende trinnet i reaksjonsveien («Committed step»)
      - Forskjellige reaksjonsveier
      - Alle trinnene i en reaksjonsvei
    answer: [1]
    explanation: Allosteriske enzymer katalyserer typisk det første irreversible, forpliktende trinnet i en vei (f.eks. ATCase i pyrimidinsyntesen), der feedback-hemming fra sluttproduktet gir effektiv kontroll.
  - n: 117
    subject: proteiner
    topics: [proteiner/teori/proteinstruktur, proteiner/aminosyrer/prolin]
    type: single
    points: 1
    stem: Alfa-heliks er en av de viktigste sekundærstrukturene i proteiner. Hvilken av de følgende aminosyrene vil kunne bryte eller forhindre dannelse av en kontinuerlig alfa-helix?
    options: [Lysin, Prolin, Asparagin, Leucin]
    answer: [1]
    explanation: Prolin mangler N–H til hydrogenbindingen i heliksen, og ringen låser φ-vinkelen – den er en «heliksbryter».
  - n: 118
    subject: proteiner
    topics: [proteiner/teori/proteinstruktur]
    type: single
    points: 1
    stem: Hvilke kjemiske bindinger er hovedansvarlige for dannelsen av sekundærstrukturer i proteiner?
    options: [Elektrostatiske bindinger, Hydrofobe bindinger, Dipolmomenter, Hydrogenbindinger]
    answer: [3]
    explanation: α-helikser og β-flak stabiliseres av hydrogenbindinger mellom C=O og N–H i polypeptidryggraden. Hydrofobe interaksjoner er viktigst for tertiærstrukturen.
  - n: 119
    subject: proteiner
    topics: [proteiner/teori/proteinmetoder]
    type: single
    points: 1
    stem: Når man utfører gelfiltreringskromatografi, hvilke proteiner kommer først ut av kolonnen?
    options: [De minste proteinene, Alle proteinene med positiv ladning, Alle proteinene med negativ ladning, De største proteinene]
    answer: [3]
    explanation: Store proteiner kommer ikke inn i porene i kulene og passerer raskt; små proteiner diffunderer inn i porene, får lengre vei og elueres sist.
  - n: 120
    subject: proteiner
    topics: [proteiner/enzymkinetikk, lab/ovelser/enzymkinetikk-adh]
    type: single
    points: 1
    stem: I etanolmetabolismen katalyserer alkoholdehydrogenase (ADH) konversjonen av etanol til acetaldehyd. En ADH isolert fra en bakterie har $K_m$=0.1 mM og $V_{max}$=0.26 µM/min for etanol som substrat og $K_m$=0.008 mM og $V_{max}$=0.23 µM/min for oktanol som substrat. Hvilket substrat kommer til å bli konvertert raskest til produkt med en blanding (forhold 1:1) av begge substrater?
    options:
      - Det blir ingen aktivitet når begge substrater tilsettes samtidig, v=0
      - Etanol
      - Lik hastighet (v) for begge substrater
      - Oktanol
    answer: [3]
    explanation: |
      Med to konkurrerende substrater bestemmes forholdet mellom hastighetene av $V_{max}/K_m$: oktanol $0{,}23/0{,}008 \approx 29$ mot etanol $0{,}26/0{,}1 = 2{,}6$. Oktanol omsettes ~11 ganger raskere – den lave $K_m$ (høy affinitet) veier tyngst.
  - n: 121
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: Et forskningsprosjekt har som mål å øke den katalytiske effektiviteten til et enzym via setestyrt mutagenese uten å forandre mekanismen eller spesifisiteten til den katalyserte reaksjonen. Hva kommer til å være resultatet i et vellykket prosjekt?
    options:
      - Enzymet viser lavere $K_m$ og høyere $k_{cat}$
      - Enzymet viser høyere $K_m$
      - Enzymet viser både høyere $K_m$ og høyere $k_{cat}$
      - Enzymet viser både lavere $K_m$ og lavere $k_{cat}$
    answer: [0]
    explanation: Katalytisk effektivitet = $k_{cat}/K_m$. Den øker sikrest ved både høyere $k_{cat}$ (raskere omsetning) og lavere $K_m$ (bedre binding).
  - n: 122
    subject: proteiner
    topics: [proteiner/teori/enzymer-egenskaper, proteiner/teori/folding-og-modifisering]
    type: single
    points: 1
    stem: Enzymaktivitet øker vanligvis med økende temperatur opp til et visst punkt. Hva er grunnen til at den positive relasjonen melllom aktivitet og varme opphører?
    options: [Denaturering av enzym, Hydrolyse av polypeptidkjede, Salting-out av enzymet, Ionisering av katalytiske aminosyrer]
    answer: [0]
    explanation: Over temperaturoptimum brytes de svake bindingene som holder den native strukturen sammen, og enzymet denatureres.
  - n: 123
    subject: proteiner
    topics: [proteiner/teori/folding-og-modifisering]
    type: single
    points: 1
    stem: Hvilken prosess som involverer proteiner er assosiert med flere neurodegenerative sykdommer, inkludert Alzheimers sykdom?
    options: [Fosforylering av proteiner, Mangel på α-kjeder av hemoglobin, Glykosylering av proteiner, Amyloid-aggregering av proteiner]
    answer: [3]
    explanation: Feilfoldede proteiner (f.eks. amyloid-β i Alzheimer, α-synuklein i Parkinson, prioner) danner uløselige β-flak-rike amyloidfibriller. Mangel på α-kjeder gir α-talassemi.
  - n: 124
    subject: proteiner
    topics: [proteiner/teori/myoglobin-og-hemoglobin]
    type: single
    points: 1
    stem: "Bohr-effekten beskriver blant annet hvordan pH påvirker binding av oksygen til hemoglobin. Velg riktig alternativ:"
    options:
      - Ved lav pH binder protoner til forskjellige grupper i hemoglobin, noe som fører til konversjonen av T-formen til R-formen
      - I sure løsninger binder hemoglobin oksygen med lavere affinitet enn i basiske løsninger
      - I sure løsninger binder hemoglobin oksygen med høy affinitet
      - Ved lav pH binder protoner til forskjellige grupper i hemoglobin, noe som fører til konversjonen av den tetrameriske R-formen til en dimer
    answer: [1]
    explanation: H⁺ protonerer bl.a. His146 i β-kjeden, som da danner saltbroer som stabiliserer **T**-formen (lav affinitet). Dermed avgis mer O₂ i sure, metabolsk aktive vev.
