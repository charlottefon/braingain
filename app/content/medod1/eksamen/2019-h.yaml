  # ───────────── Samfunnsmedisin ─────────────
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilken av disse tjenestene er vist å bidra til sosial utjevning i følge Sammendragsrapporten til Espen Dahl og co?
    options:
      - Leksehjelp
      - Kontantstøtte
      - Fritt skolevalg
      - Gratis barnehagetilbud av god kvalitet til lavinntektsfamilier
    answer: [3]
    explanation: Barnehage av god kvalitet gir størst gevinst for barn fra ressurssvake familier og er et dokumentert utjevnende tiltak. Kontantstøtte og fritt skolevalg kan tvert imot øke ulikheten.
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Helseulikheter i Norge som skyldes faktorer i arbeidsmiljøet
    options:
      - Er betydelige, og dette bidrar til at industriarbeidere har gjennomsnittlig lavere forventet levealder enn personer som er arbeidsledige
      - Er ubetydelige
      - Er betydelige, spesielt i forhold til farlige fysiske og kjemiske eksponeringer
      - Er betydelige, spesielt i forhold til psykososialt arbeidsmiljø, organisatoriske forhold og arbeidstidsordninger
    answer: [3]
    explanation: Arbeidsmiljøet bidrar betydelig til sosial ulikhet i helse, i dag særlig gjennom psykososiale faktorer (lav kontroll, høye krav), organisering og skiftarbeid. Arbeidsledige har lavere levealder enn sysselsatte.
  - n: 15
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: Hvilket av følgende tiltak er mest «oppstrøms» i forhold til å utjevne sosiale ulikheter i helse?
    options:
      - Opprettelse av kommunale frisklivssentraler
      - Flere helsestasjonskontroller i småbarnsalderen
      - Skolekampanjer som oppfordrer til fysisk aktivitet, f.eks. be foreldre la elevene gå eller sykle til skolen i stedet for å kjøre dem
      - Tiltak for å redusere frafall fra videregående skole
    answer: [3]
    explanation: Fullført utdanning er en grunnleggende sosial determinant (påvirker arbeid, inntekt og helse gjennom livet). Frisklivssentraler, helsestasjon og atferdskampanjer ligger lenger nedstrøms.
  - n: 16
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset]
    type: single
    points: 1
    stem: Hva menes med forebyggingsparadokset?
    options:
      - Hvis en ønsker å redusere sykeligheten og dødeligheten knyttet til en risikofaktor, f.eks. høyt blodtrykk, mest mulig i befolkningen vil det ha en større effekt å henvende seg til alle, ikke bare til dem som har høy risiko.
      - Det henviser til forebyggende tiltak som tilsynelatende ikke har effekt, f.eks at det bevilges stadig mer penger til tiltak innen psykisk helse, men likevel har en økende andel av befolkningen angst og depresjon
      - At de som raskest tar til seg informasjon om forebyggende tiltak er de som trenger det minst.
      - Når forebyggende tiltak mot ett helseproblem ser ut til å medvirke til økning av et annet helserelatert problem, f.eks. at antall snusere har økt etter hvert som antall røykere har gått ned
    answer: [0]
    explanation: Rose – de fleste tilfellene kommer fra den store gruppen med moderat risiko, så en liten senkning av risikoen for alle gir mer enn å behandle de få med høy risiko.
  - n: 17
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilket utsagn om endringer i sosiale ulikheter i forventet levealder blant kvinner i Norge er mest riktig?
    options:
      - Forskjellene var stabile fra 1960 til 2000, men har så minket de siste årene
      - Forskjellene har minket jevnt siden 1960-tallet
      - Forskjellene har vært stabile siden 1960-tallet
      - Forskjellene har økt siden 1960-tallet
    answer: [3]
    explanation: Utdannings- og inntektsforskjellene i levealder har økt for både kvinner og menn siden 1960-tallet, for kvinner også etter 2000.
  - n: 18
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: single
    points: 1
    stem: Sosiale forskjeller i helse er synlige fra
    options: [50-årene, Fosterlivet, 70-årene, Skolealder]
    answer: [1]
    explanation: Livsløpsperspektivet – sosiale forskjeller vises allerede i fosterlivet (f.eks. fødselsvekt og prematuritet etter mors sosioøkonomiske status).
  - n: 19
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva er den mest sannsynlige årsaken til at det er større sosiale ulikheter i forventet levealder i Norge enn Spania som har en mindre utbygd velferdsstat enn vi har? Det er
    options:
      - større sosiale forskjeller i røykevaner i Norge
      - større sosiale forskjeller i inntekt i Norge
      - større sosiale forskjeller i fysisk aktivitet i Norge
      - større sosiale forskjeller i kosthold i Norge
    answer: [0]
    explanation: I Nord-Europa ble røyking tidlig en lavstatusvane med sterk sosial gradient, mens røyking i Sør-Europa lenge var jevnere fordelt (eller vanligst i høystatusgrupper). Inntektsforskjellene er mindre i Norge enn i Spania.
  - n: 20
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva mener vi med den sosiale gradienten i forhold til helseforskjeller?
    options:
      - At en person oppnår høyere sosioøkonomisk status enn sine foreldre
      - At helsen øker med økende sosioøkonomisk status langs hele skalaen
      - At lavere sosioøkonomiske grupper møter større utfordringer i skolen og arbeidslivet
      - At det er sosiale barrierer som hindrer tilgang til gode helsetjenester for deler av befolkningen
    answer: [1]
    explanation: Gradienten betyr at helsen bedres trinn for trinn oppover hele den sosiale rangstigen – ikke bare et skille mellom «fattige» og resten.
  - n: 21
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Fattigdomsraten i Norge har økt de siste 20 årene i alle de opplistede gruppene under bortsett fra blant
    options: [ungdom, enslige forsørgere, barnefamilier, eldre]
    answer: [3]
    explanation: Andelen eldre med lavinntekt har gått ned (bl.a. pga. bedre pensjoner), mens vedvarende lavinntekt har økt blant barnefamilier, enslige forsørgere og unge.
  - n: 22
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva betyr det dersom Gini-koeffisienten er 1?
    options:
      - Det er middels inntektsulikhet
      - Det er liten inntektsulikhet
      - Det er ingen inntektsulikhet
      - Det er ekstremt stor inntektsulikhet
    answer: [3]
    explanation: Gini = 0 betyr at alle har lik inntekt; Gini = 1 betyr at én person har all inntekten (maksimal ulikhet). Norge ligger rundt 0,25.

