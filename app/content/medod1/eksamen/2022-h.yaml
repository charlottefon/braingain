    points: 1
    stem: "Hvis vi er opptatt av at tilgangen til helsetjenesten skal være rettferdig for alle i den forstand at alle skal ha lik tilgang til den, bør vi i hovedsak fokusere på:"
    options:
      - Hva helsetjenesten tilbyr
      - At alle får samme behandling når de mottar helsehjelp
      - Både hva helsetjenesten tilbyr og hva brukerne evner å benytte seg av
      - Hva brukerne evner å benytte seg av
    answer: [2]
    explanation: Tilgjengelighet (Levesques modell) oppstår i samspillet mellom tjenestens egenskaper (tilgjengelig, akseptabel, til å betale osv.) og brukernes evner (til å oppfatte behov, søke, nå fram, betale, engasjere seg). Begge sider må med.
  - n: 16
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: I undervisningen i sosial ulikhet i helse har vi gjennomgått flere måter å definere helse på. Hvordan forstår Verdens helseorganisasjon begrepet "helse"?
    options:
      - Helse er en tilstand av fullstendig fysisk velvære
      - Helse er å være i stand til å forsørge seg selv gjennom eget arbeid
      - Helse er fravær av sykdom og lyte
      - Helse er en tilstand av fysisk, mentalt og sosialt velvære
    answer: [3]
    explanation: WHO (1948) – «en tilstand av fullstendig fysisk, psykisk og sosialt velvære og ikke bare fravær av sykdom eller lyte». Bare fysisk velvære eller bare fravær av sykdom er for snevert.
  - n: 17
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: I en undersøkelse av barn og ungdom, «ungdata» kommer det frem at 15% av elever i Bergen i 2021 rapporterte at de aldri har vært med i en organisasjon, klubb eller lag. Hvilken offentlig aktør har i følge Lov om folkehelsearbeid (folkehelseloven) hovedansvar for å holde oversikt over helsetilstanden i befolkningen i Bergen og faktorer som virker inn på helsen der?
    options:
      - Helse- og omsorgsdepartementet
      - Bergen kommune
      - Folkehelseinstituttet
      - Helsedirektoratet
    answer: [1]
    explanation: Folkehelseloven § 5 pålegger kommunen å ha oversikt over helsetilstanden og påvirkningsfaktorer i sin befolkning. FHI og Helsedirektoratet støtter med data (bl.a. folkehelseprofiler), men ansvaret ligger hos kommunen.
  - n: 18
    subject: samfunnsmedisin
