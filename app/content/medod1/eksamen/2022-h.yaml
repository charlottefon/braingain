    stem: Absolutt fattigdom defineres som
    options:
      - Å ikke være i stand til å betale egne regninger
      - Å ha en inntekt under $1.90 daglig
      - Å ha en inntekt under $19.0 daglig
      - Å ha en inntekt under 10% av befolkningen
    answer: [1]
    explanation: Verdensbankens grense for ekstrem/absolutt fattigdom var 1,90 USD per person per dag (i 2022). Merk at grensen senere er oppjustert (til 2,15 og fra 2025 3 USD), så sjekk hvilken verdi pensum bruker.
  - n: 19
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilken rolle spiller helsetjenesten i forklaringer på sosial ulikhet i helse?
    options:
      - En av de viktigste forklaringene til hvorfor vi har sosial ulikhet i helse
      - En faktor som er uten betydning for utvikling av sosial ulikhet i helse
      - Det er uklart hvilken rolle helsetjenesten spiller for utviklingen av sosial ulikhet i helse
      - En faktor som kan bidra til å opprettholde sosial ulikhet i helse
    answer: [3]
    explanation: Helsetjenesten er en nedstrøms determinant med relativt liten rolle for hvorfor ulikhetene oppstår, men ulik bruk og kvalitet kan opprettholde og forsterke dem.
  - n: 20
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset]
    type: single
    points: 1
    stem: Sherpatrapper bygges flere steder i Norge. Et av argumentene for å bygge disse er å tilrettelegge for fysisk aktivitet og påvirke folkehelsen. Tanken er at små sykdomsforebyggende og helsefremmende endringer hos mange kan ha større effekt enn store endringer hos få. Hva kalles prinsippet bak en slik tankegang?
    options:
      - Høyrisikostrategi
      - Livsløpsperspektivet
      - Nedstrøms strategi
      - Forebyggingsparadokset
    answer: [3]
    explanation: Forebyggingsparadokset (Rose) – de fleste sykdomstilfellene kommer fra den store gruppen med moderat risiko, så en liten endring hos mange (befolkningsstrategi) gir større gevinst enn store endringer hos få høyrisikoindivider.
  - n: 21
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: "Sosiale helseulikheter er i følge Lucks egalitarisme urettferdig fordi:"
    options:
      - Helse er en verdi i seg selv, viktigere enn andre goder
      - Helse er en byggestein i menneskers livsforutsetninger og nødvendig for livsutfoldelse
      - Kontrollerbare faktorer som kun krever økonomiske midler kan rette opp ulikheten
      - Mennesker skal ikke holdes ansvarlige for forhold som er utenfor individets kontroll
    answer: [3]
    explanation: Luck egalitarianism skiller mellom valg og «flaks» – ulikhet som skyldes forhold utenfor individets kontroll (f.eks. foreldrenes sosiale posisjon) er urettferdig. Alternativ 2 er nærmere Daniels/Sen sitt argument.
  - n: 22
    subject: samfunnsmedisin
