      | | (1) | (2) | (3) |
      |---|---|---|---|
      | CF₄ | C med **dobbeltbinding** til hver F; hver F har 2 frie elektronpar | C med **enkeltbinding** til hver F; hver F har 3 frie elektronpar | C med enkeltbinding til hver F; hver F har bare 2 frie elektronpar |
      | H₂O | H–O–H, O har 2 frie elektronpar | H–O–H med et elektronpar på hver H, ingen frie par på O | H–O–H med et elektronpar på hver H **og** 2 frie par på O |
      | NH₃ | N bundet til 3 H, N har bare ett enslig elektron (ett punkt) | N bundet til 3 H, N har ett fritt elektronpar | N bundet til 3 H, elektronpar på hver H og ett fritt par på N |

