questions:
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Hva er den viktigste endringen i dødsårsaker etter annen verdenskrig på befolkningsnivå?
    options:
      - Barnedødeligheten kom under kontroll, med en voldsom nedgang fra 1950-1970 (barnedødsmirakelet).
      - Stor nedgang i dødeligheten som følge av hjerte-/karsykdommer (den kardiovaskulære revolusjon).
      - Sterk vekst i antall voldsomme dødsfall, altså ulykker, skader, forgiftninger (voldsparadokset).
      - Stor nedgang i dødsfall som følge av kreft/svulster (kreftgåten).
    answer: [1]
    explanation: Fra ca. 1970 falt dødeligheten av hjerte- og karsykdom kraftig (den kardiovaskulære revolusjon) – den viktigste endringen i dødsårsaksmønsteret etter krigen. Barnedødeligheten var allerede kraftig redusert før 1950, og kreftdødeligheten har ikke falt tilsvarende.
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Sunnhetsloven er også kalt "helsevesenets grunnlov". Hvilken av følgende påstander er FEIL?
    options:
      - Sunnhetsloven etablerte permanente sunnhetskommisjoner i alle distrikt, ledet av distriktslegen.
      - Sunnhetsloven innførte tvungen vaksinasjon mot kopper og tuberkulose.
      - Sunnhetsloven dreide seg om tilsyn, forebygging og kamp mot epidemiske, endemiske og smittsomme sykdommer.
      - Sunnhetsloven ble til før vi visste at infeksjonssykdommer var forårsaket av smittestoff (bakterier).
    answer: [1]
    explanation: Sunnhetsloven (1860) opprettet sunnhetskommisjoner ledet av distriktslegen og handlet om tilsyn og tiltak mot smittsomme sykdommer – før bakteriologien. Den innførte ikke vaksinasjon; BCG mot tuberkulose kom først på 1900-tallet.
  - n: 15
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
