    stem: Hvilken av de følgende påstandene om lipoproteiner er korrekt?
    options:
      - Lav LDL- (low density lipoprotein-) konsentrasjon i plasma kan lede til blodpropp.
      - Lipoproteiner er vannløslige pakker som tillater transport av kolesterol i plasma.
      - VLDL (very low density lipoprotein) inneholder mestparten av kolesterol i plasma.
      - HDL (high density lipoprotein) transporterer kolesterol fra leveren til perifere vev.
    answer: [1]
    explanation: Lipoproteiner har et hydrofilt skall (fosfolipider, kolesterol, apoproteiner) rundt en hydrofob kjerne og frakter kolesterol/fett i blodet. Det er høy LDL som gir aterosklerose, LDL (ikke VLDL) bærer mest kolesterol, og HDL frakter kolesterol fra vev tilbake til leveren.
