  - n: 103
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: |
      Et metabolsk enzym har $V_{max} = 150$ µmol produkt/min og $K_M = 25$ mM.

      En sykdomsassosiert mutant av dette enzymet har $V_{max} = 50$ µmol produkt/min og $K_M = 20$ mM. Hva er riktig svar?

      **Velg ett alternativ**
    options:
      - Mutanten forskyver likevekten til produktdannelse i større grad enn det normale enzymet
      - Mutanten har lavere affinitet til substratet enn det normale enzymet
      - Den initiale hastigheten til reaksjonen katalysert av det muterte enzymet ved en konsentrasjon av substrat på 20 mM er 50 µmol produkt/min.
      - Ved en substratkonsentrasjon på 20 mM for det muterte enzymet vil hastigheten for produktdannelse være 25 µmol produkt/min.
    answer: [3]
    explanation: |
      Ved $[S] = K_M$ er $v_0 = V_{max}/2$: $v_0 = \dfrac{50 \cdot 20}{20 + 20} = 25$ µmol/min. Lavere $K_M$ (20 vs 25 mM) betyr *høyere* affinitet, og enzymer endrer aldri likevekten.
