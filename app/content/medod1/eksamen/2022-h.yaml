      - '$K_M = 0{,}5$ mM; $V_{max} = 55$ mM/min'
    answer: [3]
    explanation: Kurven nærmer seg asymptotisk ~55 mM/min (Vmax). Halvparten, ~27–29 mM/min, nås ved ca. 0,5 mM substrat, så $K_M \approx 0{,}5$ mM. (25 mM/min er ½Vmax, ikke Vmax.)
