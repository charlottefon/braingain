    points: 1
    stem: Hvilket utsagn stemmer om fattigdom i Norge?
    options:
      - Andel barn som vokser opp i familie med vedvarende lav inntekt har økt de siste 20 årene
      - Andel eldre med lavinntekt er større enn andel barn i familier med lav husholdningsinntekt
      - Andel barn som vokser opp i familie med vedvarende lav husholdningsinntekt har blitt redusert de siste 20 årene
      - Andel eldre med vedvarende lav inntekt har økt de siste 20 årene
    answer: [0]
    explanation: Andelen barn i husholdninger med vedvarende lavinntekt økte fra rundt 4 % i 2000 til nesten 12 % rundt 2020, mens andelen eldre med lavinntekt har gått ned.
  - n: 23
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Du skal skrive et innlegg i studentavisen om sosial ulikhet i helse. Du vil innledningsvis åpne med noen årsaksforklaringer til hvorfor vi også i Norge observerer dette fenomenet. Hvilket av de følgende alternativene er **ikke** regnet som sentral forklaringsmodell på at vi ser sosiale ulikhet i helse i Norge?
    options:
      - Livsløpsperspektivet
      - Perspektivet om materielle forklaringer
      - Forebyggingsparadokset
      - Sosiale helsedeterminanter perspektivet (SDH)
    answer: [2]
    explanation: Forebyggingsparadokset er et argument for befolkningsstrategi i forebygging, ikke en forklaringsmodell for sosial ulikhet. Livsløp, materielle forklaringer og SDH er sentrale forklaringsmodeller.
  - n: 24
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: single
    points: 1
    stem: Transisjon betyr overgang. Hva er forskjellen mellom den demografiske og den epidemiologiske transisjonen?
    options:
      - Den demografiske transisjonen beskriver hvordan befolkningens størrelse øker, mens den epidemiologiske transisjonen beskriver hvordan befolkningens størrelse går ned.
      - Den demografiske transisjon dreier seg om befolkningens størrelse og sammensetning, og hvordan denne endrer seg over tid. Den epidemiologiske transisjon dreier seg om hvordan sykdomsbildet endrer seg når befolkningssammensetningen endres.
      - Den demografiske transisjonen dreier seg om folkehelsetiltak, mens den epidemiologiske transisjon dreier seg om hva medisinen kan bidra med for den enkelte pasient.
      - Den demografiske transisjonen har to faser (før/etter), mens den epidemiologiske transisjonen beskriver tre faser (før/under/etter).
    answer: [1]
    explanation: Demografisk transisjon = overgang fra høy til lav fødsels- og dødsrate (befolkningens størrelse og alderssammensetning). Epidemiologisk transisjon = skiftet fra infeksjonssykdommer til kroniske, ikke-smittsomme sykdommer som hoveddødsårsak.
