      - Misfolding og aggregering er ikke toksisk for nevronene.
      - Det er kun «intrinsically disordered proteins (IDPs)» som aggregerer i nevroner
      - Mutasjoner i noen gener (f.eks. i α-synuclein) kan lede til arvelig Parkinsons sykdom
    answer: [3]
    explanation: Punktmutasjoner/duplikasjoner i α-synuklein-genet (SNCA) gir arvelig Parkinson. Amyloidaggregater er ofte irreversible og toksiske, og også foldede proteiner kan aggregere.
