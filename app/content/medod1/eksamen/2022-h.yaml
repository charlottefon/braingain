      Plottet: hyperbolsk Michaelis–Menten-kurve. Avleste punkter omtrent – 0,5 mM → ca. 29 mM/min; 1,0 mM → ca. 38 mM/min; 1,5 mM → ca. 41 mM/min; 2,0 mM → ca. 45 mM/min; kurven flater ut mot ca. 50–55 mM/min (y-aksen går til 50 mM/min).

