    type: single
    points: 1
    stem: |
      Dersom en person har inntatt metanol, vil behandling med etanol redusere hastigheten for omdannelse av formaldehyd til format (maursyre)?

      **Velg ett alternativ:**
    options:
      - Nei, etanol vil kun hemme reaksjonen katalysert av alkohol dehydrogenase (ADH) og vil ikke påvirke omdannelsen av formaldehyd til format
      - Ja, etanol vil bli omdannet til acetaldehyd, og acetaldehyd vil konkurrere med formaldehyd om det aktive setet av aldehyd dehydrogenase (ALDH)
      - Ja, etanol vil bli omdannet til acetaldehyd, og acetaldehyd vil konkurrere med metanol om det aktive setet av alkohol dehydrogenase (ADH)
      - Ja, etanol vil bli omdannet til format, og format vil konkurrere med metanol om det aktive setet av alkohol dehydrogenase (ADH)
    answer: [1]
    explanation: Steget formaldehyd → format katalyseres av ALDH. Etanol oksideres av ADH til acetaldehyd, som er et alternativt substrat for ALDH og konkurrerer med formaldehyd. (Etanol konkurrerer i tillegg med metanol om ADH, men det er etanol – ikke acetaldehyd – som gjør det.)
