      Multipliser reaksjon 1 med 2: $2\,A + 2\,B \rightleftharpoons 2\,C$, $K = 0{,}5^2 = 0{,}25$. Legg til reaksjon 2 (konstantene multipliseres): $K = 0{,}25 \cdot 100 = 25$.
