    stem: Hvilket av følgende funn gir sterkest støtte til endosymbioseteorien?
    options:
      - Mitokondrier har sirkulært DNA som ligner på det man finner hos bakterier
      - Mitokondrier deler seg ikke
      - Mitokondrier kan syntetisere alle proteiner selvstendig
      - Mitokondrier har lineært DNA som ligner det man finner hos eukaryoter
    answer: [0]
    explanation: Sirkulært, bakterielignende DNA (sammen med egne 70S-lignende ribosomer, dobbel membran og deling ved fisjon) peker mot at mitokondrier stammer fra en bakterie tatt opp av en forløpercelle. Mitokondrier deler seg, og de fleste mitokondrieproteinene kodes i kjernen.
  - n: 21
