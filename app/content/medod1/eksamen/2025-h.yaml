  # ---------------- Cellebiologi ----------------
  - n: 19
    subject: cellebiologi
    topics: [cellebiologi/cellen/den-generelle-cellen, cellebiologi/cellen/proteinsyntese-og-vesikkeltransport]
    type: single
    points: 1
    stem: Hvordan kan en mutasjon i DNA påvirke informasjonsflyten i det sentrale dogmet?
    options:
      - Den påvirker kun translasjonshastigheten, ikke aminosyresekvensen og proteinets struktur
      - Den kan endre RNA-sekvensen, og aminosyresekvensen og strukturen til proteinet
      - Den har ingen effekt fordi RNA korrigerer alle feil
      - Den kan endre RNA-sekvensen og aminosyresekvensen i proteinet, men ikke strukturen
    answer: [1]
    explanation: Informasjonen flyter DNA → RNA → protein. En endret DNA-sekvens transkriberes til endret mRNA, som kan gi en annen aminosyresekvens – og siden sekvensen bestemmer foldingen, kan også strukturen (og funksjonen) endres.
  - n: 20
    subject: cellebiologi
