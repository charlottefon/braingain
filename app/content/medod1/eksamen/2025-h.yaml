    stem: |
      Vi har følgende standardreduksjonspotensialer for to spennende halvreaksjoner:

      $\ce{A+ + e- -> A(s)}$  $E^\circ = +0{,}373$ V
      $\ce{B^2+ + 2e- -> B(s)}$  $E^\circ = -0{,}241$ V

      Hva kan du si om den følgende totalreaksjonen og dens standardcellepotensial ($E^\circ_\text{cell}$) samt standard frienergiforandring ($\Delta G^\circ$)?

      $\ce{2A+ + B(s) -> 2A(s) + B^2+}$
    options:
      - '$E^\circ_\text{cell} < 0$ og $\Delta G^\circ < 0$'
      - '$E^\circ_\text{cell} > 0$ og $\Delta G^\circ < 0$'
      - '$E^\circ_\text{cell} > 0$ og $\Delta G^\circ > 0$'
      - '$E^\circ_\text{cell} < 0$ og $\Delta G^\circ > 0$'
    answer: [1]
    explanation: |
      $\ce{A+}$ reduseres (katode) og B oksideres (anode): $E^\circ_\text{cell} = E^\circ_\text{katode} - E^\circ_\text{anode} = 0{,}373 - (-0{,}241) = +0{,}614$ V $> 0$. Da er $\Delta G^\circ = -nFE^\circ_\text{cell} < 0$ (spontan). $E^\circ$ og $\Delta G^\circ$ har alltid motsatt fortegn, så alternativ 1 og 3 er umulige.
