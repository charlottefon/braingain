questions:
  # ---------------- Samfunnsmedisin ----------------
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: multi
    points: 2
    stem: |
      Hvilke mål på sosioøkonomisk posisjon kan man bruke når man undersøker sosial ulikhet i helse? Velg alle riktige svar.

      (0,5 poeng for hvert riktige svar, −0,5 for hvert feil svar, minste mulige poengsum er 0)
    options:
      - Geografisk boområde
      - Inntekt
      - Yrke
      - Utdanning
    answer: [0, 1, 2, 3]
    explanation: De klassiske indikatorene er utdanning, yrke og inntekt. Geografisk boområde (f.eks. bydel eller kommune) brukes også som mål på sosioøkonomisk posisjon, fordi bosted henger tett sammen med inntekt og levekår.
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilket av de følgende alternativene er *ikke* regnet som sentral forklaringsmodell på at vi ser sosial ulikhet i helse i Norge?
    options:
      - Livsløpsperspektivet
      - Forebyggingsparadokset
      - Perspektivet om materielle forklaringer
      - Sosiale helsedeterminant-perspektivet (SDH)
    answer: [1]
    explanation: Forebyggingsparadokset handler om at de fleste sykdomstilfellene kommer fra den store gruppen med moderat risiko – det er et argument for befolkningsstrategi, ikke en forklaringsmodell for sosial ulikhet. Livsløp, materielle forklaringer og sosiale helsedeterminanter er alle forklaringsmodeller.
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: Hvilket av følgende indikatorer brukes vanligvis for å måle folkehelsen i en befolkning?
    options:
      - Dødsårsaksanalyse
      - Legemiddelomsetning
      - Spørreundersøkelser
      - Forventet levealder
    answer: [3]
    explanation: Forventet levealder er den mest brukte samleindikatoren for folkehelse – den oppsummerer dødeligheten i alle aldersgrupper i ett tall og kan sammenlignes over tid og mellom land og grupper.
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva måles ved hjelp av Gini-koeffisienten?
    options:
      - Graden av tillit til helsevesenet innenfor et land eller befolkning
      - Formuefordelingen innenfor et land eller befolkning
      - Graden av religiøsitet innenfor et land eller befolkning
      - Inntektsulikhet innenfor et land eller befolkning
    answer: [3]
    explanation: Gini-koeffisienten måler inntektsulikhet fra 0 (alle har lik inntekt) til 1 (én person har all inntekt). Den kan i prinsippet også brukes på formue, men det vanlige og forventede svaret er inntektsulikhet.
  - n: 5
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Oppvekstvilkår har stor effekt på helse og helseulikhet. Hvordan har barnefattigdommen i Norge utviklet seg de siste tjue årene?
    options:
      - Andel barn som lever i lavinntektsfamilier har økt med ca. 30%
      - Andel barn som lever i lavinntektsfamilier har økt med ca. 10%
      - Andel barn som lever i lavinntektsfamilier har gått ned ca. 10%
      - Andel barn som lever i lavinntektsfamilier har gått ned ca. 30%
    answer: [1]
    explanation: Andelen barn i husholdninger med vedvarende lavinntekt økte fra rundt 4 % i 2000 til rundt 12 % i 2018–2020, altså en økning på ca. 8–10 *prosentpoeng*. Merk at «ca. 10%» her må leses som prosentpoeng; relativt sett er andelen nesten tredoblet.
  - n: 6
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/temaer/velferdsstat-og-helsetjeneste]
    type: single
    points: 1
    stem: Hvilken av følgende lover blir ofte omtalt som «helsevesenets grunnlov»?
    options:
      - Helseforetaksloven
      - Sunnhetsloven
      - Helsepersonelloven
      - Smittevernloven
      - Pasient- og brukerrettighetsloven
    answer: [1]
    explanation: Sunnhetsloven av 1860 opprettet helseråd (sunnhetskommisjoner) i hver kommune, ledet av distriktslegen, og regnes som starten på det offentlige, forebyggende helsevesenet – derav «helsevesenets grunnlov».
  - n: 7
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: text
    points: 5
    stem: Modellene for demografisk og epidemiologisk transisjon har mange fellestrekk. Beskriv kort likheter og forskjeller mellom hva de to modellene er opptatt av (2–3 setninger).
    model: |
      Modellen for demografisk transisjon beskriver befolkningsutviklingen over tid, med fokus på befolkningens størrelse, sammensetning, geografisk fordeling, fruktbarhet, dødelighet og migrasjon. Modellen for epidemiologisk transisjon undersøker hva som skjer med sykdomsbildet når befolkningssammensetningen endrer seg. Begge modeller beskriver overganger i befolkningsutviklingen gjennom fire stadier (enkelte snakker om et 5. stadium – «fem stadier» gir også full uttelling), og kurvene ser like ut siden utgangspunktet er den samme befolkningen.
    modelSource: Sensorveiledning
  - n: 8
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-tuberkulosen]
    type: single
    points: 1
    stem: Før annen verdenskrig var sykdommer en vanlig dødsårsak i Norge. Hvilken av følgende sykdommer tok flest liv i Norge rundt 1900?
    options:
      - Spanskesyken
      - Tyfoidfeber
      - Tuberkulose
      - Lepra (spedalskhet)
    answer: [2]
    explanation: Tuberkulose var den infeksjonssykdommen som tok flest liv i Norge rundt 1900. Spanskesyken kom først i 1918–1920, og lepra var da i sterk tilbakegang.
  - n: 9
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: multi
    points: 2
    stem: |
      Rasisme og diskriminering forekommer i helsevesenet. Hvilke av disse tiltakene har dokumentert effekt i å motvirke rasisme i helsevesenet? Velg alle riktige svar.

      (1 poeng for hvert riktige svar, −1 poeng for hvert feil svar, minste mulige poengsum er 0)
    options:
      - Sikre likeverdig tilgang til politiske, økonomiske, fysiske og sosiale ressurser
      - Utsatte grupper gis belønning, gjerne i form av penger, etter gjennomført helseundersøkelse
      - Gjennomført bruk av uttrykk for tillit og samarbeid som understreker at alle har likeverdig status
      - "Premisset er feil: Rasisme og diskriminering er ikke et problem i det norske helsevesenet"
    answer: [0, 2]
    explanation: Tiltakene speiler rasismens dimensjoner – institusjonelt (likeverdig tilgang til ressurser) og mellommenneskelig (hverdagslige uttrykk for tillit og samarbeid som understreker likeverdig status). Pengebelønning er ikke et dokumentert tiltak mot rasisme, og diskriminering er dokumentert også i Norge (f.eks. blant samer).
  - n: 10
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/samisk-helse]
    type: single
    points: 1
    stem: I 2016 gjennomførte tidsskriftet Lancet den største internasjonale studien på urfolkshelse noen gang. Funnene representerer 154 millioner urfolk globalt. Hva var det viktigste funnet?
    options:
      - Dårlig økonomisk utvikling i land med urfolk gjør at helsetilstanden til disse gruppene er markert lavere enn majoritetsbefolkningene
      - Det er ikke dårlig økonomisk utvikling som er årsaken til dårlig helse blant urfolk, men at urfolk stiller bakerst i alle køer når det gjelder velferdsutvikling
      - Urfolk verden over har lavt utdannelsesnivå, og helseinformasjon når ikke frem til disse gruppene uten spesiell tilrettelegging
      - Miljøgifter som slippes ut i naturen, blir konsentrert oppover i næringskjeden, og på grunn av kostholdet er urfolk særlig utsatte
    answer: [1]
    explanation: Lancet-studien (Anderson mfl. 2016) fant at urfolk hadde dårligere helse enn majoritetsbefolkningen også i rike land – problemet er ikke landets økonomi, men at urfolk havner bakerst i køen når velferden fordeles.
  - n: 11
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: single
    points: 1
    stem: Fra unnfangelse til død påvirkes våre kropper av egenskaper ved omgivelsene. I dette samspillet, hvilke tre kroppslige systemer betegnes som adaptive systemer?
    options:
      - Nervesystemet, hormon- (endokrin-) systemet, respirasjonssystemet
      - Hormon- (endokrin-) systemet, respirasjonssystemet, sirkulasjonssystemet
      - Nervesystemet, sirkulasjonssystemet, immunsystemet
      - Nervesystemet, hormon- (endokrin-) systemet, immunsystemet
    answer: [3]
    explanation: Nervesystemet, hormonsystemet og immunsystemet er de adaptive systemene som «oversetter» miljøpåvirkninger (stress, oppvekstvilkår) til biologiske endringer – sentralt i livsløpsperspektivet.
  - n: 12
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: single
    points: 1
    stem: «Livsløpsperspektivet» slår fast at sosiale forhold i oppveksten spiller inn på helsen i voksen alder. En viktig del av perspektivet er Forsdahl-Barker sin programmeringshypotese. Denne sier det er en sammenheng mellom
    options:
      - mors vekt i svangerskapet og barnets vekt ved fødselen
      - mors ernæring i svangerskapet og risikoen for kroniske sykdommer hos barnet i voksen alder
      - mors alder og risikoen for misdannelser hos barnet
      - mors kosthold i svangerskapet og risikoen for ADHD hos barnet
    answer: [1]
    explanation: Forsdahl (fattigdom i oppveksten → hjerte-kar-dødelighet) og Barker (lav fødselsvekt → kronisk sykdom) beskrev at underernæring i fosterlivet «programmerer» kroppen og øker risikoen for kroniske sykdommer (bl.a. hjerte-kar-sykdom, diabetes) i voksen alder.
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-tuberkulosen]
    type: multi
    points: 4
    stem: |
      På begynnelsen av 1900-tallet var tuberkulosen den infeksjonssykdommen som tok flest liv i Norge. Innen annen verdenskrig var tuberkulosen omtrent under kontroll. Hvilke tiltak var satt i verk for å bekjempe tuberkulosen i denne perioden (1900–1940)?

      (1 poeng for hvert riktige svar, −1 poeng for hvert feil svar, minste mulige poengsum er 0)
    options:
      - Kirurgiske inngrep
      - Massevaksinasjon med BCG
      - Informasjonskampanje om renslighet
      - Kosthold og sosial forbedring
      - Isolasjon av smittebærere
      - Behandling med antibiotika
    answer: [0, 2, 3, 4]
    explanation: Før 1940 brukte man isolasjon (sanatorier/pleiehjem), opplysning om renslighet (ikke spytte på gulvet), bedre kosthold og boforhold, og kirurgisk behandling (f.eks. pneumothorax-behandling). Massevaksinasjon med BCG og antibiotika (streptomycin) kom først etter krigen.
  # ---------------- Nomenklatur ----------------
  - n: 14
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/endelsesoversikt, nomenklatur/grammatikk/tredje-deklinasjon-m-f, nomenklatur/grammatikk/fjerde-og-femte-deklinasjon]
    type: fill
    points: 3
    stem: |
      Angi tall og kasus til følgende ord (velg blant Nom sg, Akk sg, Gen sg, Abl sg, Nom pl, Akk pl, Gen pl, Abl pl).

      Nom = nominativ, Akk = akkusativ, Gen = genitiv, Abl = ablativ, sg = entall (singularis), pl = flertall (pluralis)
    parts:
      - { prompt: iride, answer: Abl sg }
      - { prompt: umbilicos, answer: Akk pl }
      - { prompt: colli, answer: Gen sg }
      - { prompt: causam, answer: Akk sg }
      - { prompt: situ, answer: Abl sg }
      - { prompt: cariei, answer: Gen sg }
      - { prompt: meningium, answer: Gen pl }
      - { prompt: dolore, answer: Abl sg }
      - { prompt: cancro, answer: Abl sg }
      - { prompt: capsulas, answer: Akk pl }
      - { prompt: capitis, answer: Gen sg }
      - { prompt: encephalis, answer: Abl pl }
    explanation: |
      *iris, iridis* (3. dekl.) → abl sg *-e*; *umbilicus* (2.) → akk pl *-os*; *collum* (2.) → gen sg *-i*; *causa* (1.) → akk sg *-am*; *situs* (4.) → abl sg *-u*; *caries* (5.) → gen sg *-ei*; *meninx, meningis* (3., i-stamme) → gen pl *-ium*; *dolor, doloris* (3.) → abl sg *-e*; *cancer, cancri* (2.) → abl sg *-o*; *capsula* (1.) → akk pl *-as*; *caput, capitis* (3.) → gen sg *-is*; *encephalon* (2.) → abl pl *-is*.
  - n: 15
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adjektiv-1-2-og-perfektum-partisipp, nomenklatur/grammatikk/adjektiv-3-deklinasjon-og-presens-partisipp, nomenklatur/grammatikk/komparasjon]
    type: fill
    points: 5
    stem: Fyll inn riktig samsvarsbøyning (velg riktig form av adjektivet).
    parts:
      - { prompt: "manus (dexter, dextrum, dextra) – høyre hånd", answer: manus dextra }
      - { prompt: "ulcus (diabetica, diabeticus, diabeticum) – diabetisk sår", answer: ulcus diabeticum }
      - { prompt: "anaemia (grava, grave, gravis) – alvorlig blodmangel", answer: anaemia gravis }
      - { prompt: "ligamentum (anterioris, anterior, anterius) – fremre ligament/bånd", answer: ligamentum anterius }
      - { prompt: "dens (caninus, caninum, canina) – hjørnetann", answer: dens caninus }
      - { prompt: "paresis (cerebralis, cerebrale, cerebralus) – cerebral parese", answer: paresis cerebralis }
      - { prompt: "colitis (ulcerosus, ulcerosa, ulcerosum) – sårfylt tykktarmbetennelse", answer: colitis ulcerosa }
      - { prompt: "genu (sinistra, sinister, sinistrum) – venstre kne", answer: genu sinistrum }
      - { prompt: "partus (difficilis, difficilum, difficile) – vanskelig fødsel", answer: partus difficilis }
      - { prompt: "origo (incerta, incertus, incertum) – ukjent/usikkert opphav", answer: origo incerta }
    explanation: |
      Adjektivet skal ha substantivets kjønn, tall og kasus. Hunkjønn: *manus* (4. dekl.), *anaemia*, *paresis*, *colitis*, *origo*. Intetkjønn: *ulcus*, *ligamentum*, *genu*. Hankjønn: *dens*, *partus*. Merk at *-us* i *manus/partus* ikke avslører kjønnet, og at 3. deklinasjons adjektiv (*gravis, cerebralis, difficilis*) har samme form i hankjønn og hunkjønn. Komparativ *anterior* har intetkjønn *anterius*.
  - n: 16
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adjektiv-1-2-og-perfektum-partisipp, nomenklatur/grammatikk/komparasjon]
    type: fill
