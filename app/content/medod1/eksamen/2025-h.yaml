    options: ["a) R, b) S", "a) R, b) R", "a) S, b) R", "a) S, b) S"]
    answer: [3]
    explanation: |
      a) Prioritet: Br > propyl > etyl > CH₃. CH₃ peker bakover, så vi leser direkte: Br (ned) → propyl (opp) → etyl (ned til venstre) går mot klokken → **S**. b) Prioritet: Cl > propyl > etyl > CH₃. Cl (høyre) → propyl (ned til venstre) → etyl (opp) går med klokken, men laveste prioritet (CH₃) peker mot oss, så vi snur: **S**.
