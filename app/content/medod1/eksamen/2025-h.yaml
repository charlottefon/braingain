    subject: organisk-kjemi
    topics: [organisk-kjemi/biomolekyler/glykosidbindinger-og-disakkarider, organisk-kjemi/reaksjoner/oksidasjon-av-aldehyder, lab/ovelser/karbohydrater]
    type: text
    points: 4.5
    stem: Oppgi om Benedicts prøve og Barfoeds prøve gir positivt eller negativt resultat for maltose, mannose og sukrose, og forklar hvorfor dette blir utfallet for hver av de to testene for hvert av de tre sukkerne.
    model: |
      | Sukker | Benedict | Barfoed | Begrunnelse |
      |---|---|---|---|
      | Maltose | Positiv | Negativ | Reduserende **disakkarid**: glukoseenheten har et fritt anomert karbon som kan åpnes til aldehydform og redusere Cu²⁺. Disakkarider reagerer for langsomt i Barfoeds sure løsning til å gi utslag innen tiden (> 3 min) → negativ. |
      | Mannose | Positiv | Positiv | Reduserende **monosakkarid** (aldose) med fri aldehydgruppe i åpen kjedeform (foreligger i liten, men tilstrekkelig grad). Monosakkarider reduserer Cu²⁺ raskt nok også i sur løsning (1–3 min). |
      | Sukrose | Negativ | Negativ | **Ikke-reduserende** disakkarid: begge anomere karboner er bundet i α,β(1→2)-glykosidbindingen, så ingen av ringene kan åpnes til aldehyd/keton. |

      **Benedict** påviser reduserende sukker (Cu²⁺ → Cu⁺, rødt bunnfall av Cu₂O). **Barfoed** er surere og strengere: bare sterke reduksjonsmidler (typisk monosakkarider) gir rask utfelling, mens reduserende disakkarider regnes som negative.

      Poeng: 0,25 for hvert riktige utfall per test og sukker, og 0,5 for hver forklaring (0,25 for reduserende/ikke-reduserende mono-/disakkarid, 0,25 for fritt anomert karbon / kan åpnes til aldehydform – og at maltose reduserer for langsomt til Barfoed).
    modelSource: Sensorveiledning
