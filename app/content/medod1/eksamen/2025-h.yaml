    stem: Hvilket av følgende beskriver korrekt rekkefølge for intracellulær transport i en eukaryot celle?
    options:
      - "Endocytisk vei: plasmamembranen → lysosomer → kjerne"
      - "Endocytisk vei: plasmamembranen → Golgi → lysosomer"
      - "Sekretorisk vei: endoplasmatisk retikulum → Golgi → plasmamembranen"
      - "Sekretorisk vei: plasmamembranen → endosomer → Golgi"
