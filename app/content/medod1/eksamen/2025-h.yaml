    stem: |
      Bøy følgende adjektiv i alle kjønn og kasus, entall og flertall: *optimus*, 1+2 = best, svært god.

      (Hver rute er en nedtrekksmeny med de 12 formene optimus, optima, optimum, optimi, optimae, optimo, optimam, optimos, optimas, optimorum, optimarum, optimis.)
    parts:
      - { prompt: sg. Nom – M, answer: optimus }
      - { prompt: sg. Nom – F, answer: optima }
      - { prompt: sg. Nom – N, answer: optimum }
      - { prompt: sg. Akk – M, answer: optimum }
      - { prompt: sg. Akk – F, answer: optimam }
      - { prompt: sg. Akk – N, answer: optimum }
      - { prompt: sg. Gen – M, answer: optimi }
      - { prompt: sg. Gen – F, answer: optimae }
      - { prompt: sg. Gen – N, answer: optimi }
      - { prompt: sg. Abl – M, answer: optimo }
      - { prompt: sg. Abl – F, answer: optima }
      - { prompt: sg. Abl – N, answer: optimo }
      - { prompt: pl. Nom – M, answer: optimi }
      - { prompt: pl. Nom – F, answer: optimae }
      - { prompt: pl. Nom – N, answer: optima }
      - { prompt: pl. Akk – M, answer: optimos }
      - { prompt: pl. Akk – F, answer: optimas }
      - { prompt: pl. Akk – N, answer: optima }
      - { prompt: pl. Gen – M, answer: optimorum }
      - { prompt: pl. Gen – F, answer: optimarum }
      - { prompt: pl. Gen – N, answer: optimorum }
      - { prompt: pl. Abl – M, answer: optimis }
      - { prompt: pl. Abl – F, answer: optimis }
      - { prompt: pl. Abl – N, answer: optimis }
    explanation: |
      *optimus* (superlativ av *bonus*) bøyes som et vanlig 1.+2. deklinasjons adjektiv: hankjønn og intetkjønn etter 2. deklinasjon (*-us/-um, -i, -o; pl. -i/-a, -os/-a, -orum, -is*), hunkjønn etter 1. deklinasjon (*-a, -am, -ae, -a; pl. -ae, -as, -arum, -is*). Intetkjønn har alltid nom = akk, og i flertall *-a*.
