  - n: 18
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adnominal-genitiv, nomenklatur/grammatikk/ordstilling-og-uttrykk, nomenklatur/uttrykk/fractura-colli-femoris-sinistri]
    type: fill
    points: 5
    stem: Oversett til latin (velg riktig form av hvert ord).
    parts:
      - { prompt: "den lange halsmuskelen – (musculi, musculo, musculus, musculis) (collae, colla, colli, collum) (longae, longus, longum, longi)", answer: musculus colli longus }
      - { prompt: "brudd på høyre lårhals – (fractura, fracturarum, fracturis, fracturae) (collae, colli, collum, collis) (femoris, femori, femuris, femur) (dextrae, dexter, dextrum, dextri)", answer: fractura colli femoris dextri }
