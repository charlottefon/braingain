    stem: Urea, varme, detergenter og sterke syrer er denaturanter, og de brukes i studier om stabilitetet til proteiner, ofte sammen med reduktanter som beta-mercaptoethanol. Noen proteiner kan denaturere reversibelt (avhengig av konsentrasjon og styrke av denaturant). Hva betyr reversibel denaturering for et enzym? Velg kun ett riktig svaralternativ.
    options:
      - Enzymet får tilbake den native strukturen (men ikke den enzymatiske aktiviteten) når man eliminerer denaturanten (eventuelt også beta-mercaptoethanol)
      - Enzymet får tilbake kun den sekundære strukturen når man eliminerer denaturanten (eventuelt også beta-mercaptoethanol)
      - Enzymet får tilbake den native strukturen og funksjonen når man eliminerer denaturanten (eventuelt også beta-mercaptoethanol)
      - Enzymet får tilbake funksjonen (full enzymatisk aktivitet), men ikke den native strukturen når man eliminerer denaturanten (eventuelt også beta-mercaptoethanol)
    answer: [2]
    explanation: Anfinsens ribonuklease-forsøk viser at når denaturanten fjernes, refoldes proteinet spontant til den native strukturen og gjenvinner aktiviteten. Struktur og funksjon henger sammen, og aminosyresekvensen bestemmer foldingen.
