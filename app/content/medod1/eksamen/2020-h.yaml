    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-svak-syre, generell-kjemi/regnetyper/henderson-hasselbalch]
    type: single
    points: 1
    stem: |
      Vi titrerer 25,0 ml av en énprotisk organisk syre HA med $pK_a = 4{,}92$ med 0,200 M NaOH, mens vi fortløpende måler pH.
      Regn ut pH-verdien når vi har tilsatt 6,0 ml NaOH. Vi finner ut at ekvivalenspunktet finnes ved 22,0 ml tillsatt NaOH.
    options: ['pH=4,36', 'pH=5,35', 'pH=4,92', 'pH=4,49']
    answer: [3]
    explanation: |
      $n(\ce{HA})_0 = 22{,}0 \times 0{,}200 = 4{,}40$ mmol. Tilsatt $\ce{OH-}$: $6{,}0 \times 0{,}200 = 1{,}20$ mmol.
      Etterpå: $\ce{A-} = 1{,}20$ mmol, $\ce{HA} = 3{,}20$ mmol.
      $pH = 4{,}92 + \log(1{,}20/3{,}20) = 4{,}92 - 0{,}43 = 4{,}49$.
