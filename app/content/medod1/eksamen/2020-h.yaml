questions:
  # ───────────── Samfunnsmedisin ─────────────
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilket utsagn beskriver best den sosiale fordelingen av helsetjenestebruk i Norge?
    options:
      - Høyt utdannende pasienter med kreftsykdom blir like ofte henvist til poliklinisk avtale på sykehuset som dem med lavere utdanning
      - Personer med kort utdanning benytter seg oftere av aktivt valg av fastlege
      - Man finner lite eller ingen sosioøkonomisk ulikhet i bruk av tannlegetjenester
      - Man finner lite eller ingen sosioøkonomisk ulikhet i bruk av allmennleger
    answer: [3]
    explanation: Fastlege/allmennlege brukes like mye eller mer av lavstatusgrupper (lite ulikhet når man justerer for behov). Spesialisthelsetjeneste, poliklinikk og tannlege brukes derimot mer av høyt utdannede og høytlønte.
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Hva har vært den viktigste endringen i dødsårsaker i Norge de siste 70 år?
    options:
      - Kraftig nedgang i hjerte-/karsykdommer
      - Kraftig nedgang i infeksjonssykdommer
      - Kraftig nedgang i kreftdødeligheten
      - Kraftig nedgang i voldsomme dødsfall
    answer: [0]
    explanation: «Den kardiovaskulære revolusjon» – hjerte- og kardødeligheten har falt kraftig siden ca. 1970 (kosthold, røykeslutt, medikamenter). Det store fallet i infeksjonsdødelighet skjedde tidligere (før ca. 1950).
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: På en videregående skole er det en uheldig utvikling når det gjelder overvekt. Problemene ser ut til å være størst blant de ungdommene som har bostedsadresse i nabolag med høy andel lavinntektsfamilier. Kiosken på skolen selger mye av brus, godteri og søt bakst. Hvilket tiltak kan antas å være mest effektivt for å redusere de sosiale ulikhetene i helse blant elevene?
    options:
      - Endre tilbudet i kiosken slik at det selges frukt og grønnsaker i porsjonsstørrelser og begrense salg av søt bakst til en gang i uken.
      - Tilby et frivillig kurs til ungdommer som setter søkelys på sunn livsførsel og å opparbeide selvdisiplin.
      - Be elevene ta opp i elevrådet hvilke sunne varer de ønsker skal være i varesortimentet i kiosken.
      - Holde et informasjonsmøte til ungdommene og deres foresatte hvor kommunelegen gir grundig informasjon om fordelene ved å ha et sunt og variert kosthold bestående av grove kornprodukter, frukt og grønt.
    answer: [0]
    explanation: Strukturelle tiltak som endrer omgivelsene (her tilbudet i kiosken) virker likt for alle uten å kreve egen innsats. Frivillige kurs og informasjonstiltak når best de ressurssterke og kan øke ulikheten.
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: Hvilket tiltak er mest oppstrøms med hensyn til utjevning av sosiale ulikheter i helse?
    options:
      - Døgnåpen telefonlinje for studenter med psykiske plager
      - Gratis tannhelsetjeneste for voksne
      - Bedring av læringsmiljø på skoler
      - Frysing av nivået på egenandeler i helsetjenesten (Frikort egenandelstak)
    answer: [2]
    explanation: Oppstrøms tiltak virker på de bakenforliggende årsakene (utdanning, oppvekstvilkår) før sykdom oppstår. Bedre læringsmiljø påvirker skoleresultater og utdanning – en grunnleggende sosial determinant. De andre tiltakene gjelder tilgang til helsetjenester for dem som allerede har plager (nedstrøms).
  - n: 5
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-tuberkulosen]
    type: single
    points: 1
    stem: Hvilken sykdom tok i perioden 1895-1955 livet av 250.000 personer i Norge?
    options:
      - Kolera
      - Tyfoidfeber
      - Tuberkulose
      - Lepra (spedalskhet)
    answer: [2]
    explanation: Tuberkulose var den infeksjonssykdommen som tok flest liv i Norge rundt 1900 (dødeligheten toppet seg ca. 1900) og var omtrent under kontroll etter andre verdenskrig.
  - n: 6
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilken enkeltfaktor har hatt størst betydning for sosial ulikhet i helse i Norge?
    options:
      - Luftforurensing
      - Røykevaner
      - Sykkelveier
      - Kvaliteten på barnehagene
    answer: [1]
    explanation: Røyking har vært spesielt skjevt fordelt i Norge (ble en lavstatusvane), og røykerelaterte sykdommer (hjerte-kar, lungekreft, kols) forklarer mye av økningen i dødelighetsulikhet.
  - n: 7
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: I en kommune kommer det frem at mange elever kjenner på ensomhet. Det ser ut til at dette forekommer spesielt blant barn i lavinntektsfamilier. Hvilket tiltak kan antas å ha størst effekt på utjevning av sosial ulikhet i helse?
    options:
      - Innføre gratis fritidstilbud til barn og ungdom
      - Informere om og øke bemanningen på en støttetelefon for ungdom
      - Starte et screening-tilbud for psykiske plager
      - Oversette informasjonsbrosjyrer til foresatte til flere språk om hvordan en kan oppdage tidlige symptomer på psykisk sykdom hos barn
    answer: [0]
    explanation: Gratis fritidstilbud fjerner en økonomisk barriere for deltakelse og virker oppstrøms på årsaken (sosial ekskludering pga. dårlig råd). De andre tiltakene er nedstrøms (behandling/oppdagelse av plager som allerede finnes).
  - n: 8
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: I Norge var Gini-koeffisienten ifølge Statistisk sentral byrå 0,251 i 2018. I 2009 var koeffisienten 0,231. Hva betyr dette?
    options:
      - At inntektsulikheten i befolkningen var noe større i 2009 enn 2018.
      - At sosial ulikhet i levealder var noe større i 2018 enn 2009.
      - At sosial ulikhet i levealder var noe større i 2009 enn 2018.
      - At inntektsulikheten i befolkningen var noe større i 2018 enn 2009.
    answer: [3]
    explanation: Gini-koeffisienten måler inntektsulikhet (0 = alle har lik inntekt, 1 = én har alt). Høyere verdi i 2018 betyr større inntektsulikhet – den sier ingenting direkte om helse eller levealder.
  - n: 9
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: I et samfunn med en godt utbygd velferdsstat
    options:
      - Vil det sjelden oppstå sosial ulikhet i helse
      - Vil sosial ulikhet øke mer enn i land uten velferdsstatens ytelser
      - Vil sosial ulikhet i helse etter hvert avta
      - Kan det fortsatt oppstå sosial ulikhet i helse
    answer: [3]
    explanation: Norge har en universell velferdsstat og lav inntektsulikhet, men sosial ulikhet i helse er likevel ikke mindre enn i andre vesteuropeiske land.
  - n: 10
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvilken gruppe dødsårsaker bidro mest til forskjellene i forventet levealder etter husholdningsinntekt i Norge i perioden 2005-2015?
    options:
      - Ulykker
      - Diabetes
      - Nevrologiske sykdommer
      - Hjerte-kar sykdommer
    answer: [3]
    explanation: Hjerte- og karsykdom bidro mest til inntektsgapet i levealder (Kinge mfl. 2019).
  - n: 11
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: "I perioden 2005 til 2015 endret forventet levealder etter husholdningsinntekt i Norge seg på følgende måte:"
    options:
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt ble redusert, men kun for kvinner
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt ble redusert, men kun for menn
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt økte
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt ble redusert
    answer: [2]
    explanation: Øverste inntektskvartil økte levealderen med drøyt 3 år, nederste kvartil med 0,9 år (menn) og −0,4 år (kvinner). Gapet økte for begge kjønn.
  - n: 12
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Sosiale helseforskjeller gjenspeiler
    options:
      - en tilfeldig variasjon i helseutfall mellom ulike sosioøkonomiske grupper
      - at noen helseutfall ikke har blitt påvirket av den generelle bedringen i levekår siste 150 år
      - at vi har et uoppnådd helsepotensial for deler av befolkningen
      - at sammenhengen mellom helseutfall og enkelte bakgrunnsfaktorer er vanskelig å påvirke
    answer: [2]
    explanation: Sosiale helseforskjeller er systematiske (ikke tilfeldige) og viser at grupper med lavere status kunne hatt bedre helse – et uoppnådd helsepotensial som i prinsippet kan påvirkes.
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: Hvilket tiltak er mest *nedstrøms* med hensyn til utjevning av sosial ulikhet i helse?
    options:
      - Gratis leksehjelp i barneskolen
      - Åpen helsestasjon på ettermiddagstid for ungdom med psykiske plager
      - Gratis varmt måltid for hjemmeboende eldre
      - Sunn skatteveksling med mer skatt på usunne varer enn sunne varer
    answer: [1]
    explanation: Nedstrøms tiltak retter seg mot dem som allerede har fått helseplager (her ungdom med psykiske plager). Leksehjelp, skatteveksling og gratis måltid virker på levekår og risikofaktorer før sykdom oppstår.
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Sosiale ulikheter i helse kan observeres
    options:
      - På mål som levealder og selvrapporterte helsemål, men kun blant eldre
      - På mål som levealder, men kun i storbyene
      - På mål som levealder og selvrapporterte helsemål
      - På mål som levealder, men ikke på selvrapporterte helsemål
    answer: [2]
    explanation: Sosial ulikhet i helse ses både i levealder/dødelighet og i selvrapportert helse, i alle aldre og i hele landet.

