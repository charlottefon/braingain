    stem: Hvilket av følgende utsagn om irreversible inhibitorer er sant? Velg kun ett svaralternativ.
    options:
      - Irreversible inhibitorer kan frigjøres fra enzymet ved å øke konsentrasjonen av substrat
      - Gruppespesifikke irreversible inhibitorer kan hemme enzymer som har forskjellig spesifisitet
      - Suicidale inhibitorer binder kovalent til enzymet før reaksjonen kan begynne
      - Penicillin er en irreversibel inhibitor fordi penicillin katalyserer en proteolytisk degradering av peptidoglycan
    answer: [1]
    explanation: Gruppespesifikke reagenser (f.eks. DIFP mot reaktive Ser) modifiserer en bestemt sidekjede og hemmer derfor mange ulike enzymer som har den gruppen i aktivt sete. Suicidinhibitorer må først omsettes katalytisk før de binder kovalent. Penicillin hemmer (ikke katalyserer) transpeptidasen.
