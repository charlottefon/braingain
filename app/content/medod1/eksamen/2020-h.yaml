  - n: 125
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/loselighetsprodukt]
    type: single
    points: 1
    stem: |
      Kromater er salter av kromsyre $\ce{H2CrO4}$. De danner eit kromation $\ce{CrO4^2-}$ når de oppløses i vann.
      Vurder følgende løselighetsdata for forskjellige kromater ved +25°C:

      | | $K_{sp}$ |
      |---|---|
      | $\ce{Ag2CrO4}$ | $9{,}0 \times 10^{-12}$ |
      | $\ce{BaCrO4}$ | $2{,}0 \times 10^{-10}$ |
      | $\ce{PbCrO4}$ | $1{,}8 \times 10^{-14}$ |

      Kromatet som er mest løselig i vann ved +25°C er:
    options: ['$\ce{BaCrO4}$', '$\ce{PbCrO4}$', umulig å si, '$\ce{Ag2CrO4}$']
    answer: [3]
    explanation: |
      Salter med ulik støkiometri kan ikke sammenlignes direkte via $K_{sp}$, så regn ut løseligheten s:
      $\ce{Ag2CrO4}$: $4s^3 = 9{,}0 \times 10^{-12}$ gir $s = 1{,}3 \times 10^{-4}$ M.
      $\ce{BaCrO4}$: $s = \sqrt{2{,}0 \times 10^{-10}} = 1{,}4 \times 10^{-5}$ M.
      $\ce{PbCrO4}$: $s = 1{,}3 \times 10^{-7}$ M.
      $\ce{Ag2CrO4}$ er mest løselig selv om $K_{sp}$ er lavere enn for $\ce{BaCrO4}$.
  - n: 126
    subject: organisk-kjemi
    topics: [organisk-kjemi/navnsetting/stereodeskriptorer]
    type: single
    points: 1
    stem: |
      Hva er konfigurasjonen på forbindelsene på figuren?

      - **a)** C=C der venstre karbon har CH≡C– (opp) og CH2=CH=CH– (ned), og høyre karbon har –CH=CH=CH2 (opp) og –CH=CH2 (ned).
      - **b)** C=C der venstre karbon har CH≡C– (opp) og Cl (ned), og høyre karbon har Cl (opp) og –CH=CH2 (ned).
    figure: To alkener (a og b) tegnet med substituentene som beskrevet i oppgaveteksten (gruppene er skrevet som i originalen)
    options:
      - a) Z b) E
      - a) E b) Trans
      - a) Z b) Cis
      - Ingen av alternativene er riktige.
    answer: [1]
    explanation: |
      b) På venstre karbon har Cl > etynyl, på høyre Cl > vinyl. De to Cl står på hver sin side → E, og samtidig trans.
      Merk: Etter CIP-reglene ser a) ut til å være **Z**, ikke E. På venstre karbon har etynyl (C med (C,C,C)) høyere prioritet enn CH=…-gruppen (C med (C,C,H)). På høyre karbon har den lengre umettede gruppen høyere prioritet enn vinyl. Begge høyprioritetsgruppene står da oppe → Z. Det gjør «a) Z b) E» til det faglig riktige svaret, mens fasiten har «a) E b) Trans».
