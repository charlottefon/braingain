    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/fellesioneffekt, generell-kjemi/regnetyper/loselighetsprodukt]
    type: single
    points: 1
    stem: |
      I en mettet løsning av magnesiumfluorid ved +18 °C, har vi målt $[\ce{Mg^2+}] = 1{,}21 \times 10^{-3}$ M.
      Likevekten representeres av den følgende reaksjonen:

      $$\ce{MgF2(s) <=> Mg^2+(aq) + 2F-(aq)}$$

      Beregn likevektskonsentrasjonen av $\ce{Mg^2+}$ i 1,000 L mettet $\ce{MgF2}$-løsning ved +18 °C, etter at 0,100 mol fast kaliumfluorid ble tilsatt.

      KF er en sterk elektrolytt og oppløses fullstendig. Anta at volumendringen er ubetydelig.

      **Velg ett alternativ**
    options: ['$7{,}09 \times 10^{-9}$ M', '$2{,}93 \times 10^{-4}$ M', '$1{,}78 \times 10^{-8}$ M', '$7{,}09 \times 10^{-7}$ M']
    answer: [3]
    explanation: |
      $K_{sp} = s(2s)^2 = 4s^3 = 4(1{,}21 \times 10^{-3})^3 = 7{,}09 \times 10^{-9}$.
      Med $[\ce{F-}] \approx 0{,}100$ M: $[\ce{Mg^2+}] = K_{sp}/[\ce{F-}]^2 = 7{,}09 \times 10^{-9}/0{,}0100 = 7{,}09 \times 10^{-7}$ M.
      Feilsvaret $7{,}09 \times 10^{-9}$ er selve $K_{sp}$.
