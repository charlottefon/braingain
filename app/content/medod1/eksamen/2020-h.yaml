      Figuren viser to kiler-og-streker-tegninger av 3-metylheksan (sentralt C med $\ce{CH2CH3}$, $\ce{CH3CH2CH2}$, $\ce{CH3}$ og H):
      - **a)** $\ce{CH2CH3}$ rett opp (i planet), $\ce{CH3CH2CH2}$ ned til venstre (i planet), $\ce{CH3}$ til høyre på stiplet kile (bak planet), H ned til høyre på fylt kile (mot betrakteren).
      - **b)** $\ce{CH2CH3}$ rett opp (i planet), $\ce{CH3CH2CH2}$ ned til venstre (i planet), H til høyre på stiplet kile (bak planet), $\ce{CH3}$ ned til høyre på fylt kile (mot betrakteren).
