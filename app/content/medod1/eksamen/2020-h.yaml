    stem: |
      Myelin i både det sentrale og perifere nervesystemet inneholder flere spesifikke proteiner. Ett av disse er enzymet CNPase, som er viktig for dannelse av normalt myelin. Den elektriske ladningen i myelinproteiner er svært viktig for å binde sammen lipidmembranene i myelin, og for å regulere cytoskjelettet.
      CNPase-proteinet har 401 aminosyrer, og mange av disse har sidekjeder som kan fungere som syrer eller baser:
      - 25 stykker arginin ($pK_a \approx 12$)
      - 25 stykker asparaginsyre ($pK_a \approx 4$)
      - 30 stykker glutaminsyre ($pK_a \approx 4$)
      - 36 stykker lysin ($pK_a \approx 10$)
      - 4 stykker histidin ($pK_a \approx 6$)

      Forutsi, hva blir elektrisk nettoladning til CNPase ved nøytral pH (pH=7)!
    options: ['+10', '+6', '-6', '+2']
    answer: [1]
    explanation: |
      Ved pH 7 er Arg og Lys (pKa > 7) protonert (+1), Asp og Glu (pKa < 7) deprotonert (−1), og His (pKa 6 < 7) stort sett uladd.
      Netto: $(+25 + 36) - (25 + 30) = 61 - 55 = +6$. N- og C-terminalen opphever hverandre.
