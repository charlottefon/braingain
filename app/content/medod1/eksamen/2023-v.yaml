questions:
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-forklaringsmodeller]
    type: text
    points: 6
    stem: |
      Du skal skrive et innlegg i studentavisen om temaet «sosial ulikhet i helse».

      a. Gi en kort beskrivelse av begrepet «sosial ulikhet i helse» og hvordan det måles. (1 poeng)
      b. Hva er gradientutfordringen? (1 poeng)
      c. Hvilke ulike forklaringsmodeller kjenner du til for sosiale ulikheter i helse? (max 2 poeng, 0,5 poeng for hver modell som nevnes)
      d. Ta for deg to av forklaringsmodellene du har nevnt over og beskriv kort hva de går ut på (2 poeng).
    model: |
      **a)** Helsetilstanden er ikke likt fordelt i befolkningen. «Sosiale ulikheter i helse er den systematiske sammenhengen mellom sosial status på ene siden og sykelighet og levealder på den annen side.» (0,5 p) Sosial ulikhet måles ved å studere sammenhengen mellom helse og sosioøkonomiske faktorer, som utdanning, yrke og inntekt. (0,5 p)

      **b)** Helsen varierer gradientvis gjennom hele befolkningen – det er ikke et klart skille mellom de som er fattige og har dårligere helse og de som ikke er fattige. Det er forskjeller langs hele gradienten.

      **c)**
      1. Årsaksforklaringer (SHD-perspektivet): a) materielle forklaringer, b) helserelatert atferd, c) psykososiale forklaringer, d) fundamentale årsaker (selve ulikhetsstrukturen og den systematiske skjevfordelingen av ressurser betraktes som en grunnleggende årsak)
      2. Alternative årsaksforklaringer (omvendt kausalitet og seleksjon)
      3. Integrerende perspektiver (livsløpsperspektivet)

      **d)** (to av disse)
      - **Materielle forklaringer:** Høyere sosial posisjon gir bedre materielle livsbetingelser (bolig, bosted, arbeid, fritid). Biologiske, kjemiske og fysiske belastninger på jobb, i nærmiljøet og hjemme; ernæring; luftkvalitet, fukt, sanitærforhold, rekreasjonsmuligheter; vibrasjoner, tunge løft, arbeidsstilling. Husholdninger med lav inntekt er oftere trangbodde, har fukt og råte, lite dagslys osv.
      - **Helseatferd:** Helserelatert atferd varierer mellom sosioøkonomiske grupper. Særlig røyking er sosialt lagdelt i Norge og en enkeltfaktor av stor betydning; også matvaner, overvekt/fedme, høyt blodtrykk og fysisk aktivitet. Mindre entydig for alkohol.
      - **Psykososiale forklaringer:** Stress – individers psykologiske og kroppslige reaksjoner på ytre hendelser. Stressende livshendelser og ressurser til å håndtere dem er sosialt skjevfordelt; opplevelse av egen posisjon i hierarkiet og kontroll over eget liv spiller inn.
      - **Fundamentale årsaker:** Det er selve den sosiale lagdelingen som fører til ulikheter i helse, ikke de proksimale risikofaktorene (røyking, stress, arbeidsforhold osv.).
      - **Seleksjon / omvendt kausalitet:** Helserelatert seleksjon til sosial posisjon – de med dårlig helse får nedsatt inntektsevne.
      - **Livsløpsperspektivet:** Forener perspektivene; sosiale forhold i oppveksten påvirker helsen i voksen alder med akkumulering av risiko. Kritiske perioder (in utero – programmeringshypotesen Forsdahl–Barker, tidlige leveår, overgang fra utdanning til arbeid, første barn, overgangsalder).
    modelSource: Sensorveiledning
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 2
    stem: Da Sunnhetsloven ble til, var det i en tid da sykdommers etiologi var høyst uklare. Særlig stor var uenigheten mellom kontagionistene og miasmatikerne. Hva var det store paradokset når det gjaldt folkehelsetiltak?
    options:
      - Selv om miasmatikerne mente sykdom spredte seg i luften, var de motstandere av munnbind - de fikk faktisk innført et forbud.
      - Selv om både kontagionister og miasmatikere hadde en klar tanke om etiologi, hadde ingen av dem egentlig noen folkehelsetiltak å komme med.
      - Selv om miasmatikerne hadde feil når det gjaldt sykdomsforståelse, hadde tiltakene de sto for nok en større effekt på folkehelsen enn tiltakspakken kontagionistene sto bak
      - Selv om kontagionistene hadde rett når det kom til etiologi, ville tiltaket de foreslo - å lukke grensene - ført til at befolkningen sultet.
    answer: [2]
    explanation: Miasmatikerne tok feil om smittemåten («dårlig luft»), men deres sanitærtiltak – renovasjon, kloakk, rent vann, bedre boliger – bedret folkehelsen mer enn kontagionistenes karantene og isolasjon.
  - n: 15
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon, samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 2
    stem: Med det du har lært om den demografiske transisjonen til grunn - hvilken av påstandene nedenfor er mest riktig når det gjelder Norge?
    options:
      - Først falt dødeligheten - så falt fødselstallene noe tid senere.
      - Modellen beskriver utvikling over tid, og derfor vil forventet levealder alltid øke. Demografene og epidemiologene er uenige om hvor lenge dette kan fortsette.
      - Først falt fødselstallene - så falt dødeligheten noe tid senere.
      - Forventet levealder begynte først å øke etter antibiotikaens inntog.
    answer: [0]
    explanation: I den demografiske transisjonen faller dødeligheten først (fra slutten av 1700-tallet), mens fødselstallene holder seg høye en periode – derfor befolkningsveksten – før de også faller. Levealderen økte lenge før antibiotika kom (1940-tallet).
  - n: 16
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
