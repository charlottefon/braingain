    stem: Fedme og overvekt er en økende global utfordring, og sosial ulikhet i barns BMI er tydelig allerede fra spedbarnsalder. Hvilket av de følgende tiltakene for å motkjempe denne utviklingen er mer oppstrøms?
    options:
      - Innføre ingen egenandel på fastlegekonsultasjoner som handler om vektnedgang
      - Kurs i matlaging med fokus på et sunt kosthold på frisklivssentraler hos personer med overvekt
      - Innføre hyppigere veiing av barn og unge på helsestasjoner
      - Økt skattelegging av usunne matvarer
    answer: [3]
    explanation: Oppstrøms tiltak virker på strukturelle årsaker for hele befolkningen (pris, tilgjengelighet) før sykdom/risiko oppstår. De andre er nedstrøms tiltak rettet mot individer som allerede har overvekt eller identifiseres i helsetjenesten.
