      Beregn likevektskonsentrasjonen av $\ce{Mg^2+}$ i 1,000 L mettet $\ce{MgF2}$-løsning ved +18 °C, etter at 0,100 mol fast kaliumfluorid ble tilsatt. KF er en sterk elektrolytt og oppløses fullstendig. Anta at volumendringen er ubetydelig.
    options: ['$1{,}78 \times 10^{-8}$ M', '$7{,}09 \times 10^{-9}$ M', '$2{,}93 \times 10^{-4}$ M', '$7{,}09 \times 10^{-7}$ M']
