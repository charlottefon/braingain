    stem: |
      Likevektsuttrykket for en gasslikevekt er som følger:

      $$K = \frac{[\ce{O2}]^5\,[\ce{NH3}]^4}{[\ce{NO}]^4\,[\ce{H2O}]^6}$$

      Hva er reaksjonslikningen for denne likevekten?
    figure: Likevektsuttrykket var et bilde som ikke er gjengitt i PDF-en; uttrykket over er rekonstruert ut fra fasiten.
    options:
      - '$\ce{4NH3(g) + 5O2(g) <=> 4NO(g) + 6H2O(g)}$'
      - '$\ce{8NH3(g) + 10O2(g) <=> 8NO(g) + 12H2O(g)}$'
      - '$\ce{2NO(g) + 3H2O(g) <=> 2NH3(g) + O2(g)}$'
      - '$\ce{4NO(g) + 6H2O(g) <=> 5O2(g) + 4NH3(g)}$'
    answer: [3]
    explanation: Produktene står i telleren og reaktantene i nevneren, opphøyd i sine støkiometriske koeffisienter. NH₃ og O₂ i telleren betyr altså at de er produkter. Det første alternativet er den omvendte reaksjonen (K' = 1/K), og det andre gir kvadratet av den.
  - n: 30
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-svak-syre, generell-kjemi/regnetyper/ph-svak-syre, generell-kjemi/regnetyper/ph-svak-base-og-salt]
    type: fill
    points: 3
    stem: |
      En svak syre HA har $K_a = 6 \times 10^{-5}$.

      Vi har 100 ml av en oppløsning, der $[\ce{HA}] = 0{,}1$ M.

      Vi vil titrere syren med 1 M NaOH.

      Beregn pH:
    parts:
      - {prompt: "Før du tilsetter NaOH (pH=5,7, pH=3,35, pH=2,6, pH=3,1)", answer: "pH=2,6"}
      - {prompt: "Etter å ha tilsatt 5 ml NaOH (pH=5,7, pH=5,2, pH=6,1, pH=4,2)", answer: "pH=4,2"}
      - {prompt: "Etter å ha tilsatt 10 ml NaOH (pH=8,6, pH=10,0, pH=5,7, pH=9,1)", answer: "pH=8,6"}
    explanation: |
      $n(\ce{HA}) = 0{,}100 \cdot 0{,}1 = 10$ mmol, og $pK_a = -\log(6 \times 10^{-5}) = 4{,}22$.

      - **Før NaOH:** $[\ce{H3O+}] = \sqrt{K_a C} = \sqrt{6 \times 10^{-5} \cdot 0{,}1} = 2{,}45 \times 10^{-3}$ M, så pH = 2,61 ≈ 2,6.
      - **5 ml NaOH (5 mmol):** halvparten er nøytralisert, $[\ce{HA}] = [\ce{A-}]$, så $pH = pK_a = 4{,}22 \approx 4{,}2$.
      - **10 ml NaOH (10 mmol):** ekvivalenspunktet; bare $\ce{A-}$, $10/110 = 0{,}0909$ M. $K_b = K_w/K_a = 1{,}67 \times 10^{-10}$ og $[\ce{OH-}] = \sqrt{1{,}67 \times 10^{-10} \cdot 0{,}0909} = 3{,}9 \times 10^{-6}$ M, så pOH = 5,41 og pH = 8,59 ≈ 8,6.
