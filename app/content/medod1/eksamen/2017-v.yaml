note: Spørsmål 7–18 (Den akutt syke pasient) er utelatt, og det samme er spørsmål 41 (merking av sekundærstruktur i et proteinbilde, uten synlig fasit). Spørsmål 1–5 er fra det daværende introduksjonskurset, og tallene gjelder 2017.
questions:
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: multi
    points: 3
    stem: |
      *Introduksjonskurs.* Hvorfor blir noen syke og andre ikke? Under finner du noen påstander.

      Marker alle utsagn som er sanne.

      (0,5 poeng for hvert riktige svar, −0,5 poeng for hvert feil svar, minste mulige poengsum er 0)
    options:
      - Mange kroniske sykdommer skyldes at mennesket er genetisk tilpasset et steinalderliv
      - Kreftsykdom er et utslag av organenes evne til å reparere seg selv gjennom ny celledeling
      - Når en ektefelle dør viser statistikk at dødeligheten hos gjenlevende ektefelle er mangedoblet det første året
      - Røyking og høyt kolesterol er farligere hvis man står lavt i den sosiale rangstigen
      - Følelser, immunsystem og hormoner (det endokrine systemet) har ingen innvirkning på hverandre
      - Bakterier er generelt farlige for mennesker
      - «Stress» og andre følelsestilstander er fysiologiske endringer som påvirker organ- og cellefunksjon
      - I moderne velferdssamfunn lever folk omtrent like lenge uansett hvilken sosioøkonomisk klasse de tilhører
      - Når leger møter syke mennesker med omsorg kan det skape styrkende endringer i kroppens fysiologi
      - Det er som oftest lett å avgjøre om en sykdom er genetisk eller miljøbetinget
      - Man kan skille klart mellom fysisk sykdom og sykdom som skyldes psykiske og sosiale faktorer
      - Negative barndomsopplevelser (vold, kriminalitet, trusler, overgrep) gir ikke målbare utslag i helsetilstanden resten av livet
    answer: [0, 1, 2, 3, 6, 8]
    explanation: Oppgaven bygger på et biopsykososialt syn på sykdom – kropp, følelser, sosial posisjon og livshistorie virker sammen. Det er store sosiale forskjeller i levealder også i velferdsstater, og negative barndomsopplevelser gir målbare helseutslag gjennom hele livet (livsløpsperspektivet). Påstanden om kreft som utslag av reparasjon ved celledeling er kursets formulering (kreft oppstår ved feil i celledelingen).
