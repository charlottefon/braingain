  - n: 24
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-proporsjonal-universalisme, samfunnsmedisin/kortsvar/eksempeloppgave-3]
    type: text
    points: 16
    stem: |
      Ulikhet i helse – langsvarsoppgave:

      1) Hva menes med en høyrisikostrategi i forhold til å bekjempe sosial ulikhet i helse? Gi noen eksempler.

      2) Hva menes med en populasjonsstrategi i forhold til å bekjempe sosial ulikhet i helse? Gi noen eksempler.

      3) Hvilken strategi bør en velge hvis en skal kombinere det forebyggende arbeidet mot narkotikabruk blant ungdom med arbeidet for å redusere sosiale ulikheter i helse?

      4) Hvorfor bør en velge en slik strategi? Diskuter fordeler og mulige ulemper med strategien du foreslår.
    model: |
      **1) Høyrisikostrategi** (målrettet strategi): tiltak rettes mot de gruppene eller individene som har høyest risiko, eller som er dårligst stilt sosialt. Målet er å løfte de nederste. Eksempler er oppsøkende tjenester og oppfølging av barn i lavinntektsfamilier, røykesluttilbud til arbeidsledige, screening og behandling av personer med høyt blodtrykk/kolesterol, og tiltak mot frafall for elever i risikosonen.

      **2) Populasjonsstrategi** (universell strategi, Geoffrey Rose): tiltak rettes mot hele befolkningen for å flytte hele risikofordelingen i gunstig retning, uavhengig av individuell risiko. Mange får en liten gevinst, men den samlede gevinsten blir stor (forebyggingsparadokset). Eksempler er tobakks- og alkoholavgifter, aldersgrenser og begrenset tilgjengelighet, saltreduksjon i ferdigmat, gratis skolemat/skolefrukt, gratis barnehage, universelle velferdsordninger og utjevnende skatte- og inntektspolitikk.

      **3) Valg:** En kombinasjon i form av **proporsjonal universalisme** (Marmot): universelle tiltak for all ungdom – for eksempel tilgjengelighetsbegrensning, skolebaserte programmer, gode og gratis fritidstilbud, tiltak mot skolefrafall og mot barnefattigdom (oppstrøms) – der innsatsen trappes opp i takt med behovet. Det betyr ekstra ressurser til skoler og bydeler med lav sosioøkonomisk status og til ungdom med kjente risikofaktorer.

      **4) Begrunnelse og diskusjon.**

      *Fordeler:*
      - De fleste som begynner med narkotika tilhører den store gruppen med moderat risiko, så en ren høyrisikostrategi når få av tilfellene (forebyggingsparadokset).
      - Universelle tiltak stigmatiserer ikke og har bred legitimitet.
      - Strukturelle tiltak virker uten at den enkelte må ta et aktivt valg, og forsterker derfor ikke ulikhet slik informasjonskampanjer ofte gjør («inverse prevention law»: de ressurssterke tar raskest til seg helseråd).
      - Den proporsjonale komponenten sikrer at gradienten utjevnes, ikke bare at gjennomsnittet bedres.

      *Ulemper og utfordringer:*
      - Universelle tiltak er dyre, og gevinsten per individ er liten, slik at motivasjonen kan bli lav.
      - Hvis bare de universelle delene gjennomføres, kan ulikheten øke, fordi høy-SES-grupper drar mest nytte.
      - Det kan være vanskelig å definere og måle «behov» uten å stigmatisere.
      - Målrettede tiltak kan merke grupper, og risikoidentifikasjon er upresis.
      - Effekten på narkotikabruk og ulikhet kommer sent og er vanskelig å evaluere.
    modelSource: Egenlaget løsningsforslag
