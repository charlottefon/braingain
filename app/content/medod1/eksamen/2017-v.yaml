      *Introduksjonskurs.* Om helse og legerollen: marker de utsagnene som ***ikke*** er riktige.

      (1 poeng for hvert riktige svar, −1 poeng for hvert feil svar, minste mulige poengsum er 0)
    options:
      - Man kan ikke ha god helse hvis man har en alvorlig kronisk sykdom
      - Leger har stor makt når de møter sine pasienter
      - Legens makt innebærer at pasienter ikke kan bestemme hva slags behandling de skal ha
