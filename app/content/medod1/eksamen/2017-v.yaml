  - n: 76
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: fill
    points: 4
    stem: |
      En 55 år gammel overvektig kvinne kommer til tannbehandling som følge av intens tannpine. I tannlegestolen er hun synlig nervøs, svetter, og begynner etter hvert å puste tungt. Hun begynner å snakke rart, klager over «prikking» i fingrene, får så rykninger i armer og ben og holder på å besvime. Tannlegen ringer medisinsk nødnummer og pasienten blir hentet til sykehuset.

      pH = 7,58, pCO₂ = 2,95 kPa.

      (OBS! Denne oppgaven har 4 spørsmål, som alle er relatert til det samme case-eksempelet.)
    parts:
      - {prompt: "1) Anslå hva BE («Base Excess») vil være (Ca. −15 / Ca. −8 / Ca. 0 / Ca. +8 mmol/L)", answer: "Ca. 0 mmol/L"}
      - {prompt: "2) Hva slags syre/base-forstyrrelse foreligger? (Respiratorisk acidose / Respiratorisk alkalose / Metabolsk acidose / Metabolsk alkalose)", answer: "Respiratorisk alkalose"}
      - {prompt: "3) Foreligger noen form for kompensasjon? (Ja, respiratorisk / Ja, metabolsk / Nei / Ikke mulig å vurdere)", answer: "Nei"}
      - {prompt: "4) Pasientens tilstand passer med at reaksjonsligningen CO₂ + H₂O = H₂CO₃ = H⁺ + HCO₃⁻ … (har gått mot venstre / har gått mot høyre / er uforandret / er blitt overbelastet)", answer: "har gått mot venstre"}
    explanation: |
      Angst gir hyperventilering. pCO₂ blir lav (normalt 4,7–6,0 kPa) og pH høy, altså respiratorisk alkalose.
      $[\ce{HCO3-}] \approx 0{,}23 \cdot 2{,}95 \cdot 10^{7{,}58-6{,}1} \approx 0{,}68 \cdot 30 \approx 20$ mM, et lite fall som bare skyldes kjemisk buffering. BE er derfor ≈ 0, og det har ikke rukket å skje noen metabolsk (renal) kompensasjon (akutt tilstand).
      Når CO₂ blåses ut, forskyves likevekten mot venstre og H⁺ forbrukes. Alkalosen senker fritt Ca²⁺, som gir prikking og kramper.
