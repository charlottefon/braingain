      - ...bestemmelse av cellens form
      - ...vesikkeltransport i prokaryote celler
      - ...transport av mitokondria
    answer: [2]
    explanation: Prokaryoter har ikke vesikkeltransport (ingen indre membransystemer). I eukaryote celler er cytoskjelettet sentralt for bevegelse, form og transport av vesikler og organeller langs mikrotubuli.
