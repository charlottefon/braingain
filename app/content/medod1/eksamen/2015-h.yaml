    explanation: Lengste kjede er 5 C (pentan) med Cl på C1 og metyl på C3 («etylbutan» er aldri riktig, da er kjeden ikke den lengste). Prioritet $\ce{CH2CH2Cl}$ > etyl > metyl > H. $\ce{CH2CH2Cl}$ (høyre) → etyl (nede til venstre) → metyl (opp) går med klokken, men H peker mot oss, så svaret snus → **S**.
