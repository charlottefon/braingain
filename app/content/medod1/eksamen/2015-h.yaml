  - n: 49
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-svak-syre, generell-kjemi/regnetyper/ph-svak-syre, generell-kjemi/regnetyper/ph-svak-base-og-salt]
    type: fill
    points: 6
    stem: |
      En svak syre HA har $K_a = 2 \times 10^{-6}$.

      Vi har 100 ml av en oppløsning, der [HA] = 0,1 M.

      Vi vil titrere syren med 1 M NaOH.

      Beregn pH:
    parts:
      - {prompt: Før du tilsetter NaOH, answer: "3,35"}
      - {prompt: Etter å ha tilsatt 5 ml NaOH, answer: "5,7"}
      - {prompt: Etter å ha tilsatt 10 ml NaOH, answer: "9,3"}
    explanation: |
      $n(\ce{HA}) = 0{,}100 \text{ L} \cdot 0{,}1 \text{ M} = 10$ mmol; $\mathrm{p}K_a = -\log(2 \times 10^{-6}) = 5{,}70$.

      **Før NaOH:** $[\ce{H3O+}] = \sqrt{K_a c} = \sqrt{2 \times 10^{-6} \cdot 0{,}1} = \sqrt{2 \times 10^{-7}} = 4{,}47 \times 10^{-4}$ M → pH = 3,35.

      **5 ml NaOH** = 5 mmol $\ce{OH-}$ → 5 mmol HA og 5 mmol $\ce{A-}$ (halvtitrert): $\mathrm{pH} = \mathrm{p}K_a + \log\frac{5}{5} = 5{,}70$.

      **10 ml NaOH** = 10 mmol → ekvivalenspunktet: 10 mmol $\ce{A-}$ i 110 ml, $[\ce{A-}] = 0{,}0909$ M. $K_b = K_w/K_a = 10^{-14}/(2 \times 10^{-6}) = 5 \times 10^{-9}$. $[\ce{OH-}] = \sqrt{5 \times 10^{-9} \cdot 0{,}0909} = 2{,}13 \times 10^{-5}$ M → pOH = 4,67 → pH = 9,33.
