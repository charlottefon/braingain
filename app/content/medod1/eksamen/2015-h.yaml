  - n: 79
    subject: proteiner
    topics: [proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: Hva er sant om penicillin?
    options:
      - Er en kompetitiv inhibitor av serinproteaser
      - Er en aktivator i glycopeptid transpeptidase reaksjonen
      - Ligner ikke på transisjonstilstand i transpeptidase reaksjonen
      - Er en reversibel inhibitor av glycopeptid transpeptidase som ligner på substratet
      - Er en irreversibel suicidal inhibitor av glycopeptid transpeptidase
    answer: [4]
    explanation: Penicillin ligner D-Ala-D-Ala og binder i det aktive setet, der serinet åpner β-laktamringen og danner et stabilt kovalent penicilloyl-enzym. Enzymet blir permanent inaktivert (suicidal/irreversibel hemming).
  - n: 80
    subject: proteiner
    topics: [proteiner/teori/homologi-og-evolusjon]
    type: single
    points: 1
    stem: |
      To humane enzym har 35 % sekvensidentitet.
      Med utgangspunkt i dette: hvilket av alternativene er mest riktig?
    options:
      - Da er vi 100 % sikre på at de er ortologe
      - De er mest sannsynlig ikke homologe
      - De har lik $K_M$ og $V_{max}$ for sine substrater
      - Ingen av de nevnte alternativene er riktige
      - Deres 3D-struktur er sannsynligvis ganske lik
    answer: [4]
    explanation: Over ca. 25–30 % sekvensidentitet er proteiner sannsynligvis homologe, og 3D-strukturen er bedre bevart enn sekvensen. To *humane* enzymer fra samme art er paraloger, ikke ortologer.
  - n: 81
    subject: proteiner
    topics: [proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: "Enzymregulering: velg mekanismen som *ikke* fører til fysiologisk regulering av enzymaktivitet."
    options:
      - Regulering av gentranskripsjon
      - Proteindenaturering
      - Posttranslasjonell modifisering av enzym (fosforylering/defosforylering)
      - Proteolytisk aktivering
      - Allosteri
    answer: [1]
    explanation: Denaturering ødelegger enzymet og er ikke en kontrollert, reversibel reguleringsmekanisme. Genuttrykk, fosforylering, proteolytisk aktivering (zymogener) og allosteri brukes alle til fysiologisk regulering.
