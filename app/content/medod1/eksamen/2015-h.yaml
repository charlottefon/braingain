    stem: Velg det/de sukkermolekylene som gir positivt utslag på både Benedikts test og Barfoeds test.
    options: [Sukrose, Maltose, D-Galaktose, D-Mannose]
    answer: [2, 3]
    explanation: Benedikt er positiv for alle reduserende sukkere. Barfoed (Cu²⁺ i svakt sur løsning) er positiv bare for reduserende *monosakkarider* innen kort tid. Maltose er reduserende disakkarid (bare Benedikt), og sukrose er ikke-reduserende (negativ på begge).
  - n: 32
    subject: organisk-kjemi
    topics: [organisk-kjemi/grunnlag/isomeri-og-konformasjon, organisk-kjemi/navnsetting/stereodeskriptorer]
    type: single
