  - n: 78
    subject: proteiner
    topics: [proteiner/teori/proteinstruktur, proteiner/aminosyrer/lysin, proteiner/aminosyrer/aspartat]
    type: single
    points: 1
    stem: Interaksjonar mellom Asp og Lys som påverkar den tertiære strukturen til eit protein, er fortrinnsvis ...
    options: [kovalente bindinger, elektrostatisk tiltrekning, elektrostatisk frastøtning, ingen av de nevnte alternativene, hydrofobe]
