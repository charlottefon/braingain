    stem: |
      Hva er E/Z konfigurasjonen på de to strukturene vist på figuren?

      a) F og Cl på det ene karbonet (F opp, Cl ned), I og Br på det andre (I opp, Br ned):

      ```smiles a)
      Cl/C(F)=C(Br)/I
      ```

      b) $\ce{CH3}$ (opp) og $\ce{CH2CH3}$ (ned) på det ene karbonet, $\ce{CH2OH}$ (opp) og CHO (ned) på det andre:

      ```smiles b)
      CC/C(C)=C(CO)\C=O
      ```
    options: ["a) E, b) Z", "a) Z, b) E", "a) Z, b) Z", "a) E, b) E"]
    answer: [0]
    explanation: a) Høyest prioritet er Cl (over F) og I (over Br); de står på motsatt side → E. b) Etyl > metyl; CHO (O,O,H) > $\ce{CH2OH}$ (O,H,H); etyl og CHO står på samme side → Z.
