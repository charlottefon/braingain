    stem: Velg det mest korrekte alternativet i hvert delspørsmål.
    parts:
      - prompt: "Hva er sant om peptidet Ala-Lys-Phe-Gly-Asp? (Når vi behandler det med chymotrypsin observerer vi ingen forandring i peptidet / Når vi behandler det med trypsin får fem isolerte aminosyrer / Når vi behandler det med trypsin får vi frigjort den C-terminale aminosyren / Når vi behandler det med trypsin får vi 2 fragmenter, et dipeptid og et tripeptid / Når vi behandler det med chymotrypsin får vi fem isolerte aminosyrer)"
        answer: Når vi behandler det med trypsin får vi 2 fragmenter, et dipeptid og et tripeptid
      - prompt: "Når det gjelder peptidbindingen, er det sant at: (Det er en enkel kovalent binding mellom R-grupper i aminosyrene / Den har delvis dobbeltbindingkarakter / Peptidbindinger roterer / R-substituenter er nesten alltid i cis-konfigurasjon / Alle de ovennevnte utsagnene er sanne)"
        answer: Den har delvis dobbeltbindingkarakter
    explanation: Trypsin kutter på C-siden av Lys/Arg → Ala-Lys + Phe-Gly-Asp. (Chymotrypsin kutter etter aromatiske rester → Ala-Lys-Phe + Gly-Asp.) Peptidbindingen er plan og rigid pga. resonans (delvis dobbeltbinding), forbinder ryggraden (ikke R-gruppene), og står nesten alltid i trans.
  - n: 67
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 2
    stem: |
      To varianter av enzymet ribonuklease A skiller seg fra hverandre i en aminosyre.

      Følgende kinetiske parametere ble målt i aktivitetsmålinger:
      Enzympreparat med ribonuklease A; $V_{max}$: 100 mikromol/min; $K_M$ = 10 mM
      Enzympreparat med ribonuklease B; $V_{max}$: 1 mikromol/min; $K_M$ = 0,1 mM.

      Basert på denne informasjonen kan vi si at følgende er sant:
    options:
      - a) Ribonuklease B har høyere affinitet til substratet enn ribonuclease A
      - b) Den initiale hastigheten til reaksjonen katalysert av enzym A ved en konsentrasjon av substrat 10 mM er 50 mikromol/min.
      - c) Enzym A forskyver likevekten til produktdannelse i større grad enn enzym B.
      - d) Både svar a og b er korrekte
      - e) Svarene a, b og c er alle korrekte
    answer: [3]
    explanation: |
      a) Lavere $K_M$ (0,1 mM) betyr høyere (tilsynelatende) affinitet → B. b) Ved [S] = $K_M$ = 10 mM er $v_0 = V_{max}/2 = 50$ µmol/min. c) er feil: enzymer endrer aldri likevekten.
  - n: 68
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: |
      Med utgangspunkt i Michaelis-Menten-kinetikk, kan vi si at et av disse utsagnene *ikke* er riktig.
      Hvilket?
    options:
      - Enzymkonsentrasjonen er mye lavere enn substratets konsentrasjon
      - Konsentrasjonen av enzym-substrat-kompleks forblir konstant gjennom hele reaksjonen
      - Ved meget høye substratkonsentrasjoner er reaksjonshastigheten uavhengig av substratkonsentrasjonen
      - '$V_0 = k_2 \times$ [ES].'
      - '$K_M$ er lik substratkonsentrasjon ved maksimal hastighet ($V_{max}$)'
    answer: [4]
    explanation: $K_M$ er substratkonsentrasjonen der $v_0 = V_{max}/2$, ikke ved $V_{max}$. De andre utsagnene er antakelser/følger av Michaelis–Menten (bl.a. steady state for [ES]).
  - n: 69
    subject: proteiner
    topics: [proteiner/teori/enzymregulering, proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: Med hvilken av følgende typer reversibel hemming kan du endre et enzyms $K_M$, men ikke $V_{max}$?
    options: [Allosterisk, Irreversibel, Kompetitiv, Nonkompetitiv, Unkompetitiv]
    answer: [2]
    explanation: En kompetitiv hemmer konkurrerer om det aktive setet og kan utkonkurreres med høy [S], så $V_{max}$ er uendret mens tilsynelatende $K_M$ øker. Nonkompetitiv senker $V_{max}$; unkompetitiv senker begge.
  - n: 70
    subject: proteiner
    topics: [proteiner/teori/folding-og-modifisering]
    type: single
    points: 1
    stem: Med hvilken av disse behandlingene er det *minst* sannsynlig at vi forårsaker denaturering av et enzym i løsningen?
    options:
      - Å blande løsningen med et organisk løsningsmiddel, slik som aceton
      - Å koke løsningen
      - Å tilsette en moderat konsentrasjon av salt
      - Å eksponere enzymet for natriumdodecylsulfat (SDS)
      - Å tilsette sterk syre eller base, med sluttkonsentrasjon i løsning på 0,1 M
    answer: [2]
    explanation: Moderat saltkonsentrasjon stabiliserer ofte proteiner («salting in»). Organiske løsningsmidler, varme, detergenter (SDS) og ekstrem pH bryter de ikke-kovalente interaksjonene som holder den native strukturen.
  - n: 71
    subject: proteiner
    topics: [proteiner/teori/folding-og-modifisering]
    type: single
    points: 1
    stem: Hva er sant om denaturering og aggregering av proteiner?
    options:
      - Øker aktivitet hvis proteinet er et enzym
      - Kan ikke forårsakes av mutasjoner
      - Forandrer proteinets primære struktur
      - Er involvert i utvikling av neurodegenerative sykdommer
      - Ingen av de andre alternativene er korrekte
    answer: [3]
    explanation: Feilfolding og aggregering til amyloider er sentralt i Alzheimers, Parkinsons, Huntingtons og prionsykdommer. Denaturering endrer ikke primærstrukturen (peptidbindingene er intakte), og mutasjoner kan gi feilfolding.
  - n: 72
    subject: proteiner
    topics: [proteiner/teori/myoglobin-og-hemoglobin]
    type: single
    points: 1
    stem: Hva er sant om hemoglobin/myoglobin?
    options:
      - Hemoglobin er en god bærer av O₂ på grunn av sin variable affinitet for O₂ (er lav når O₂-konsentrasjonen er høy og høy når O₂-konsentrasjonen er lav)
      - Hemoglobin er en god bærer av O₂ på grunn av sin variabel affinitet for O₂ (er høy når O₂-konsentrasjonen er høy og lav når O₂-konsentrasjonen er lav)
      - Hemoglobin er en god bærer av O₂ fordi det har lav affinitet for O₂
      - Myoglobin er en bedre bærer av O₂ enn hemoglobin
      - Hemoglobin er en god bærer av O₂, fordi det har en høy affinitet for O₂
    answer: [1]
    explanation: Kooperativ binding (sigmoid kurve) gjør at hemoglobin binder O₂ sterkt i lungene (høy pO₂, R-tilstand) og slipper det i vevet (lav pO₂, T-tilstand). Myoglobin har konstant høy affinitet og er egnet til lagring, ikke transport.
  - n: 73
    subject: proteiner
    topics: [proteiner/teori/enzymkatalyse]
    type: single
    points: 1
    stem: Følgende er ***alltid*** sant om det aktive setet i alle enzymer?
    options:
      - Inneholder sidekjeder av aminosyrerester som er involvert i katalyse og/eller binding av substratet
      - Inneholder ikke substratbindingssetet
      - Substratet bindes av flere sterke interaksjoner
      - Inneholder et metallion som prostetisk gruppe
      - Er langt fra substratbindingssetet i primærstrukturen
    answer: [0]
    explanation: Det aktive setet er en lomme der aminosyresidekjeder binder substratet og deltar i katalysen. Substratet bindes av mange *svake* (ikke-kovalente) interaksjoner, og bare noen enzymer har metallioner. Restene kan ligge langt fra hverandre i sekvensen, men det er ikke alltid tilfelle.
  - n: 74
    subject: proteiner
    topics: [proteiner/teori/enzymkatalyse, proteiner/teori/enzymer-egenskaper]
    type: single
    points: 1
    stem: Hvilket av følgende er sant med hensyn til enzymatisk katalyse?
    options:
      - Enzymer reduserer aktiveringsenergien for omdanning av substrat til produkt
      - Den katalytiske aktiviteten er uavhengig av pH
      - Enzymene er virksomme med både R- og S-isomerer av det samme substratet
      - For å være effektivt må enzymet være til stede i samme konsentrasjon som substratet
      - Enzymer øker likevektskonstanten hundre ganger eller mer, for en gitt reaksjon
    answer: [0]
    explanation: Enzymer senker aktiveringsenergien ved å stabilisere transisjonstilstanden. Aktiviteten avhenger av pH, enzymer er stereospesifikke, de virker i katalytiske mengder og endrer aldri K.
  - n: 75
    subject: proteiner
    topics: [proteiner/teori/proteinstruktur]
    type: single
    points: 1
    stem: Hva er riktig svaralternativ når det gjelder proteinets primærstruktur?
    options:
      - Som navnet antyder, er den kun tilstede i de viktigste proteinene i kroppen
      - Den er den samme i alle kjente fiberproteiner
      - Finnes ikke i proteiner med kvaternær struktur
      - Det refererer til sekvensen av aminosyrer i polypeptidkjeden
      - Ingen av alternativene er riktige
    answer: [3]
    explanation: Primærstrukturen er rekkefølgen av aminosyrer (pluss eventuelle disulfidbroer) og finnes i alle proteiner.
  - n: 76
    subject: proteiner
    topics: [proteiner/aminosyrer/prolin, proteiner/teori/proteinstruktur]
    type: single
    points: 1
    stem: Hvilken aminosyre gir ofte kraftig krumming i α-heliks og andre typer helikser?
    options: [Asp, Lys, Pro, Val, Ala]
    answer: [2]
    explanation: Prolin har en ring som binder sidekjeden tilbake til N i ryggraden. Den mangler da N–H til hydrogenbinding og låser φ-vinkelen, og gir knekk i helikser («heliksbryter»).
  - n: 77
