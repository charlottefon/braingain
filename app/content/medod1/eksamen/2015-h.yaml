    figure: "Kileformel (beskrevet i teksten); tilsvarer `ClCC[C@@H](C)CC`"
    options:
      - R-1-kloro-3-metylpentan
      - S-1-kloro-3-metylpentan
      - S-1-kloro-3-etylbutan
