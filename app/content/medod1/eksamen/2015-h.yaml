  - n: 27
    subject: organisk-kjemi
    topics: [organisk-kjemi/grunnlag/kiralitet-og-r-s]
    type: single
    points: 1
    stem: |
      Har stoffet på figuren R eller S konfigurasjon?

      Figuren viser 2-pentanol tegnet med kiler: stereosenteret har $\ce{CH3}$ opp (i planet), OH ned til venstre (i planet), H til høyre på stiplet kile (bak planet) og $\ce{CH2CH2CH3}$ ned til høyre på fylt kile (mot betrakteren).
    figure: "Kileformel av 2-pentanol (beskrevet i teksten); tilsvarer `C[C@H](O)CCC`"
    options: [R, S]
    answer: [1]
    explanation: Prioritet OH > propyl > $\ce{CH3}$ > H. H peker bakover, så vi kan lese direkte. OH (nede til venstre) → propyl (nede til høyre) → $\ce{CH3}$ (opp) går mot klokken → **S**.
  - n: 28
    subject: organisk-kjemi
    topics: [organisk-kjemi/reaksjoner/sn1-reaksjon, organisk-kjemi/grunnlag/kiralitet-og-r-s]
    type: multi
    points: 3
    stem: |
      Figuren viser at 3-bromo-3-metylheksan (tegnet med kiler: Br opp, etyl på stiplet kile, propyl på fylt kile, $\ce{CH3}$ til høyre) i vandig aceton spaltes til et plant karbokation. Vann angriper karbokationet fra begge sider ($\ce{H2O}$, $-\ce{H+}$), og det dannes to speilbildeformer av 3-metyl-3-heksanol.

      ```smiles Utgangsstoffet slik det er tegnet
      CCC[C@](C)(Br)CC
      ```

      Kryss av for alt som er betegnende for reaksjonen på figuren.
    figure: Reaksjonsskjema SN1 – tertiært alkylbromid → plant karbokation med tom p-orbital → to enantiomere alkoholer
    options:
      - Produktet vil samlet sett være optisk inaktivt (rasemisk)
      - Dette er en SN1 reaksjon.
      - IUPAC-navnet til utgangsstoffet (reaktanten) er (S)-3-bromo-3-metylhexan
      - Produktene av reaksjonen foreligger som både R og S konfigurasjon.
      - Dette er en SN2 reaksjon.
    answer: [0, 1, 3]
    explanation: |
      Tertiært substrat, polart protisk løsningsmiddel og et plant karbokation-intermediat er typisk SN1. Nukleofilen angriper fra begge sider, så det dannes like mengder R og S (rasemat, optisk inaktivt). Utgangsstoffet slik det er tegnet er (R), ikke (S): med $\ce{CH3}$ (lavest prioritet) pekende bort går Br → propyl → etyl med klokken.
