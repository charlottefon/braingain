    subject: generell-kjemi
    topics: [generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/regnetyper/henderson-hasselbalch, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: text
    points: 10
    stem: |
      **Denne oppgaven skal besvares med egne ord. Vær kort og presis. Estimert tid på oppgaven er ca. 15 minutter.**

      En 60 år gammel mann har hatt langvarig «røykhoste» og tendens til å bli andpusten når han anstrenger seg. Etter vinterens influensa ble han tiltagende slapp og kortpustet, og ble til sist innlagt på sykehus.

      Ved ankomst i akuttmottak hadde han følgende syre/base-status:

      pH = 7,34, pCO2 = 9,3 kPa.

      Anslå verdien for BE («Base Excess»).

      Hva slags syre/base-forstyrrelse forelå? (Bruk «Siggaard-Andersen acid-base chart», se vedlagt pdf.)

      Hva kan årsaken være til syre/base-forstyrrelsen?

      Hvorfor er pH nedsatt? Bruk gjerne kjemiske formler for å forklare.

      Hyperventilerer pasienten?
    figure: Siggaard-Andersen acid-base chart (vedlegg, ikke gjengitt)
    model: |
      **BE:** Klart positiv, ca. **+10 mmol/L** (avlest i Siggaard-Andersen-diagrammet). Kontroll med Henderson–Hasselbalch: $[\ce{HCO3-}] = 0{,}23 \cdot 9{,}3 \cdot 10^{7{,}34 - 6{,}1} \approx 2{,}14 \cdot 17{,}4 \approx 37$ mmol/L (normalt ca. 24), dvs. et baseoverskudd på ca. 10–12 mmol/L.

      **Forstyrrelse:** **Kronisk (metabolsk kompensert) respiratorisk acidose.** pCO2 er sterkt forhøyet (normalt ca. 5,3 kPa), og pH er bare lett nedsatt fordi nyrene over tid har holdt tilbake bikarbonat (positiv BE). En akutt økning til 9,3 kPa uten kompensasjon ville gitt pH ≈ 7,15–7,2.

      **Årsak:** Kronisk obstruktiv lungesykdom (KOLS) etter mange års røyking, med akutt forverring etter influensa (luftveisinfeksjon). Nedsatt alveolær ventilasjon gir $\ce{CO2}$-retensjon.

      **Hvorfor pH er nedsatt:** $\ce{CO2 + H2O <=> H2CO3 <=> H+ + HCO3-}$. Når pCO2 øker, forskyves likevekten mot høyre, $[\ce{H+}]$ øker og pH synker. Henderson–Hasselbalch: $\mathrm{pH} = 6{,}1 + \log\dfrac{[\ce{HCO3-}]}{0{,}23 \cdot p\ce{CO2}}$ – forholdet bikarbonat/$\ce{CO2}$ er lavere enn normalt (20:1).

      **Hyperventilerer han?** **Nei.** Han kan puste fort og anstrengt (takypné), men ventilasjonen er utilstrekkelig i forhold til $\ce{CO2}$-produksjonen – høy pCO2 betyr per definisjon **hypoventilering**. Hyperventilering ville gitt lav pCO2 og høy pH.
    modelSource: Egenlaget løsningsforslag
