      Hva er IUPAC-navnet til strukturen på bildet?

      ```smiles
      CC1CCCC(C1)C(C)C
      ```
    options:
      - 1-methyl-3-propylhexan
      - 1-propyl-3-methylsyklohexan
      - 1-isopropyl-3-methylsyklohexan
      - 3-methyl-1-isopropylhexan
    answer: [2]
    explanation: |
      Ringen (6 C) er hovedkjeden → sykloheksan. Substituentene er metyl og isopropyl (forgrenet, $\ce{CH(CH3)2}$) på C1 og C3. Ved likt nummerering avgjør alfabetet: isopropyl (i) før metyl (m) får nummer 1.
  - n: 31
    subject: organisk-kjemi
    topics: [lab/ovelser/karbohydrater, organisk-kjemi/biomolekyler/glykosidbindinger-og-disakkarider]
    type: multi
