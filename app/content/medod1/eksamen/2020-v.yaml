      3-Bromo-3-metylheksan (kiler-og-streker-tegning av ett bestemt enantiomer) reagerer i vandig aceton («aqueous acetone») og gir et plant karbokation (tom p-orbital). Kationet angripes av $\ce{H2O}$ (−$\ce{H+}$), og vi får to produkter: 3-metyl-3-heksanol med OH på hver sin side.
    figure: Reaksjonsskjema der det kirale alkylbromidet går via et plant karbokation til to enantiomere alkoholer
    options:
