    stem: "Prokaryote celler inneholder ikke:"
    options: [plasmid., kromosomer., kromatin., DNA.]
    answer: [1]
    explanation: |
      Prokaryoter har DNA og ofte plasmider, men ingen kjerne og ikke flere lineære kromosomer pakket med histoner.
      Merk: Fasiten sier «kromosomer», men bakterier omtales vanligvis (også i Alberts) som å ha ett sirkulært kromosom. Det som egentlig mangler, er eukaryot *kromatin* (DNA pakket på histon-nukleosomer). «Kromatin» virker derfor som et minst like godt svar.
