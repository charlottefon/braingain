    stem: "Biologiske interaksjoner: Hvilken av disse påstandene er riktig?"
    options:
      - Ioniske bindinger er ikke-kovalente.
      - Makromolekyler dannes bare av ikke-kovalente interaksjoner.
      - Proteiner binder seg til hverandre hovedsakelig via kovalente interaksjoner fordi de typisk er titalls ganger sterkere enn ikke-kovalente interaksjoner i et vandig miljø.
