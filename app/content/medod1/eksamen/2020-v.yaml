    type: single
    points: 1
    stem: I løpet av en kjemisk reaksjon frigjøres varme, og uorden synker. Ut i fra dette, hva kan du si om reaksjonens spontanitet?
    options:
      - Reaksjonen er aldri spontan.
      - Reaksjonen er alltid spontan.
      - Reaksjonen er spontan ved høye temperaturer og uspontan ved lave temperaturer.
      - Reaksjonen er spontan ved lave temperaturer og uspontan ved høye temperaturer.
    answer: [3]
    explanation: Reaksjonen har ΔH < 0 og ΔS < 0. I $\Delta G = \Delta H - T\Delta S$ er leddet $-T\Delta S$ positivt og vokser med T, så ΔG < 0 bare ved lav temperatur ($T < \Delta H/\Delta S$).

