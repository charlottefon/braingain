    options:
      - Hastigheten av Sn2-reaksjonen er bare avhengig av konsentrasjonen til alkylhalidet.
      - Graden av Sn1/E1 reaksjon vil ikke påvirkes av styrken på basen eller om man har en god eller dårlig nukleofil.
      - Sn2/E2 favoriseres av høy konsentrasjon av en god nukleofil/sterk base.
