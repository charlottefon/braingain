    stem: I grafen vises hvordan en variabel (langs x-aksen) påvirker den katalytiske aktiviteten (langs y-aksen) til 2 enzymer. Hva er enzymet som genererer data representert i grønt?
    figure: "Samme graf som i forrige oppgave: grønn kurve med pH-optimum ca. 2, blå kurve med pH-optimum ca. 7."
    options: [Trypsin, Chymotrypsin, Salivary amylase, Pepsin]
    answer: [3]
    explanation: Pepsin virker i den sure magesekken og har pH-optimum ~1,5–2. Trypsin og chymotrypsin (tynntarm) har optimum ~8, og spyttamylase ~7.
  - n: 113
    subject: proteiner
    topics: [proteiner/teori/enzymer-egenskaper]
    type: single
    points: 1
    stem: Hva er et apoenzym?
    options:
      - Det er proteinkomponenten av et enzym son krever kofaktor for å være fullt funksjonelt
      - Det er en prostetisk gruppe
      - Det er en ikke-proteisk komponent som trenges for at enzymet skal være fullt funksjonell
      - Det er et komplett, biologisk aktivt enzym, inkludert kofaktoren
    answer: [0]
    explanation: Apoenzym (inaktiv proteindel) + kofaktor gir holoenzym (aktivt). Kofaktoren, eventuelt en tett bundet prostetisk gruppe, er den ikke-proteiske delen.
  - n: 114
    subject: proteiner
    topics: [proteiner/enzymkinetikk, proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: |
      Under vises et Lineweaver-Burk- plott for et enzym tilsatt forskjellig konsentrasjon av en hemmer.
      Basert på plottet under svar på følgende: i) Hvilken type hemming vil du si at dette er, og ii) hva skjer med $K_m$ til enzymet når hemmeren tilsettes?
      Velg svaralternativ hvor både i) og ii) er korrekte
    figure: "Lineweaver–Burk-plott (1/V₀ mot 1/[S]) med tre rette linjer («Ingen inhibitor» og to med inhibitor). Alle skjærer y-aksen i samme punkt, men linjene med inhibitor er brattere og krysser x-aksen nærmere origo."
    options:
      - i) Non-kompetititv, ii) $K_m$ minker
      - i) Kompetitiv, ii) $K_m$ minker
      - i) Non-kompetitiv, ii) $K_m$ øker
      - i) Kompetitiv, ii) $K_m$ øker
    answer: [3]
    explanation: Felles skjæringspunkt på y-aksen betyr uendret $1/V_{max}$, altså kompetitiv hemming. Skjæringen med x-aksen ($-1/K_m$) flyttes mot origo, så tilsynelatende $K_m$ øker.
  - n: 115
    subject: proteiner
    topics: [proteiner/teori/enzymregulering, proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: Hvilken av de følgende molekylene er en reversibel hemmer? Velg riktig svaralternativ.
    options:
      - Penicillin
      - Diisopropylphosphofluoridate (DIPF)
      - Methotrexate (MTX)
      - Alle andre svaralternativ er korrekte
    answer: [2]
    explanation: Metotreksat er en kompetitiv (reversibel) hemmer av dihydrofolatreduktase. Penicillin (transpeptidase) og DIPF (serinproteaser, acetylkolinesterase) binder kovalent og er irreversible.
  - n: 116
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: Når hastigheten på enzymaktivitet plottes mot substratkonsentrasjon, hvilken kurve oppnås da for ikke-allosteriske enzymer?
    options: [Rett linje med negativ helling, Rett linje med positiv helling, Hyperbolsk kurve, Parabolsk kurve]
    answer: [2]
    explanation: Michaelis–Menten-kinetikk gir $v_0 = V_{max}[S]/(K_M + [S])$, en hyperbel. Allosteriske enzymer med kooperativitet gir sigmoid kurve.
  - n: 117
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: Et mutant enzym har høyere $K_M$ enn villtype-enzym. Hva er konsekvensen for mutant enzymaktivitet sammenlignet med villtypen ved lik substratkonsentrasjon?
    options:
      - Ingen av de andre svaralternativ er korrekte
      - Mutanten har lavere aktivitet enn villtypen
      - Mutanten har høyere aktivitet enn villtypen
      - Mutanten og villtypen har lik aktivitet
    answer: [1]
    explanation: Høyere $K_M$ betyr lavere affinitet, så det trengs mer substrat for å nå ½ $V_{max}$. Ved samme [S] (og samme $V_{max}$) blir $v_0$ lavere.
  - n: 118
    subject: proteiner
    topics: [proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: Zymogener og proenzymer er enzymprekursorer (for eksempel for noen proteaser og hormoner). Velg riktig svaralternativ for den regulerende mekanismen som benyttes i aktivering av zymogener og proenzymer til aktive enzymer.
    options: [Defosforylering, Fosforylering, Proteolytisk aktivering, Allosteri]
    answer: [2]
    explanation: Zymogener aktiveres irreversibelt ved at en peptidbinding kløyves, f.eks. trypsinogen → trypsin (enteropeptidase) og proinsulin → insulin.
  - n: 119
    subject: proteiner
    topics: [proteiner/teori/peptidbindingen]
    type: single
    points: 1
    stem: Hvilken av følgende svaralternativ er riktig om peptidbindingen?
    options:
      - Den er en ikke-kovalent binding mellom aminosyrer i polypeptid-strukturen
      - Den roterer på samme måte som enkle bindinger generelt
      - Den har delvis dobbeltbinding-karakter
      - R-substituenter på hver side av peptidbindingen er nesten alltid i cis-konfigurasjon
    answer: [2]
    explanation: Resonans mellom C=O og N gir C–N-bindingen ca. 40 % dobbeltbindingskarakter. Den er derfor plan og stiv (roterer ikke), og nesten alltid i trans-konfigurasjon. Peptidbindingen er kovalent (amid).
  - n: 120
    subject: proteiner
    topics: [proteiner/teori/proteinstruktur, proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: Hva er riktig om oligomeriske proteiner med kvaternærstruktur?
    options: [De kan være enzymer, De har flere subenheter, Alle alternativene er riktige, De kan være allosterisk regulert]
    answer: [2]
    explanation: Kvaternærstruktur betyr flere polypeptidsubenheter. Mange oligomere proteiner er enzymer, og kommunikasjon mellom subenhetene gir grunnlag for allosteri og kooperativitet (f.eks. hemoglobin og aspartattranskarbamoylase).
