  # ───────────── Samfunnsmedisin ─────────────
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: "Hvilket utsagn er riktig i forbindelse med sosiale ulikheter når det gjelder helsetjenestebruk i Norge i dag? De med lavere sosioøkonomisk status:"
    options:
      - Blir henvist hyppigere til spesialist
      - Blir sjeldnere innlagt
      - Blir hyppigere innlagt
      - Blir henvist sjeldnere til spesialist
    answer: [3]
    explanation: Spesialisthelsetjenester (poliklinikk, privatpraktiserende spesialister) brukes mer av høyt utdannede og høytlønte, også justert for behov. Fastlege og akuttinnleggelser brukes like mye eller mer av grupper med lav sosioøkonomisk status.
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-urettferdighet-og-helsetjenesten]
    type: text
    points: 3
    stem: Hvilke forhold i *helsetjenesten* kan bidra til sosial ulikhet i helsehjelpen pasientene mottar? (3 poeng)
    model: |
      0,5 poeng per relevant punkt, for eksempel:
      - **Egenbetaling** for noen tjenester (f.eks. tannhelsetjenester).
      - **Privat helseforsikring** kan gi tilgang til helsetjenester uten kø.
      - **Dårlig kommunikasjon og manglende kulturell forståelse** hos helsepersonell kan føre til at symptombilder ikke oppfattes eller gjenkjennes, eller at helseplager avfeies.
      - Det er større sannsynlighet for at pasienter med **høy sosioøkonomisk status får anbefalt behandling**.
      - Pasienter med lav sosioøkonomisk status opplever oftere **negative holdninger** hos helsepersonell eller at de ikke blir forstått.
      - Informasjonen er for lite **tilrettelagt** for dem med lav utdanning og dårlige norskkunnskaper.
    modelSource: Sensorveiledning
  - n: 15
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-forklaringsmodeller]
    type: text
    points: 6
    stem: Hva kan forklare de sosiale forskjellene i helsevaner i Norge? Nevn ulike faktorer som kan virke inn og forklar hvordan disse kan bidra til at det blir forskjeller i helsevaner. (6 poeng)
    model: |
      0,5 poeng per relevant underpunkt som er nevnt og forklart:

      **Barndom/oppvekst, sosialt press, rollemodeller**
      - Press fra andre personer, f.eks. jevnaldrende og foreldre.
      - Rollemodeller.
      - Sosial tilhørighet og normer: hva som gir sosial status, varierer mellom sosiale grupper.
      - Lover og regler, f.eks. at lovverket sikrer at alle skolebarn er fysisk aktive på skolen og lærer om sunn mat og farene ved rusmidler, eller regler for salg av alkohol, tobakk og andre rusmidler.
      - Media: reklame, bilder og hva som får oppmerksomhet.
      - Endrede idealer i ulike sosiale klasser, f.eks. ble det ukult å røyke i høyere sosiale lag tidligere enn i lavere.

      **Geografiske og samfunnsmessige forhold**
      - Tilgjengelighet, markedsføring og pris.
      - Reiseavstander og reisetid, f.eks. til steder å trene, eller mulighet for å mosjonere på vei til jobb.
      - Arbeidsforhold og arbeidsledighet: har man tid og overskudd til gode helsevaner, og et sosialt miljø som støtter dem?
      - Boligforhold, f.eks. nærhet til grøntarealer.
      - Fritidstilbud: har man tilgang til aktiviteter man liker og har råd til?

      **Andre forhold**
      - Psykososiale forhold: stress, mestringserfaring, negative livshendelser og sosial støtte påvirker mestringsevnen.
      - Genetisk disposisjon, f.eks. for å utvikle avhengighet.
      - Kulturelle og religiøse regler, f.eks. knyttet til alkohol og kosthold.
    modelSource: Sensorveiledning

