    explanation: SN2 og E2 er bimolekylære (hastighet = k[RX][Nu⁻]), så høy konsentrasjon av sterk nukleofil/base favoriserer dem. SN2 er ett-stegs. Om SN1/E1 vinner, avhenger av at nukleofilen/basen er svak.
