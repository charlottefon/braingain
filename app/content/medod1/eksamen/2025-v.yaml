  # ---------------- Samfunnsmedisin (langsvar) ----------------
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: text
    points: 6
    stem: |
      De sosiale helsedeterminantene befinner seg på ulike nivåer. En mye brukt metafor for typer av tiltak i ulikhetslitteraturen er elven. Beskriv de ulike nivåene og gi eksempler på tiltak i hver kategori.
    model: |
      (1 poeng per kategori som nevnes og 1 poeng per eksempel i hver kategori.)

      **Oppstrømsintervensjoner** er politiske tiltak høyt oppe i elva, rettet mot den sosioøkonomiske fordelingen (inntekts-, utdannings- eller klassestrukturen), med et forebyggingsaspekt. *Eksempel:* en skattereform som gir jevnere inntektsfordeling. Slike tiltak antas å være særlig effektive fordi de reduserer eksponeringen for en lang rekke mer spesifikke risikofaktorer (overdødelighet i lavere sosiale lag sees for de fleste dødsårsaker), men lange årsakskjeder gjør at det kan ta tid før effekten på ulikhet i helse viser seg.

      **Midtstrømstiltak** ligger mellom disse nivåene og retter seg f.eks. mot det sosiale og fysiske miljøet på arbeidsplassen (Mackenbach m.fl. 2002).

      **Nedstrømsfaktorer/-tiltak** ligger lenger ned i elva, f.eks. helsetjenesten (behandling av dem som allerede er syke). De antas å være mindre effektive fordi de reparerer i stedet for å eliminere problemene, ofte til høy kostnad – men effekten kan observeres ganske umiddelbart, og helsetjenesten er under direkte politisk kontroll og styring.
    modelSource: Sensorveiledning
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-urettferdighet-og-helsetjenesten]
    type: text
    points: 3
    stem: |
      Hvorfor kan sosial ulikhet i helse være urettferdig? Nevn minst tre argument fra pensum og undervisning.
    model: |
      (1 poeng per argument.)

      - **Norman Daniels (lik mulighet):** Alle bør ha like muligheter til å realisere sine livsplaner, gitt sine naturlige talenter. God helse er avgjørende for normal funksjon og «a normal range of opportunities». Kontrollerbare sosiale forhold som indirekte påvirker helsen, er dermed sosialt urettferdige.
      - **«Luck egalitarianism»:** Fordelingsrettferdighet er knyttet til ansvarlige valg. Forskjeller kan bare rettferdiggjøres når de skyldes valg den enkelte er ansvarlig for, ikke omstendigheter de ikke har valgt. Sosiale helsedeterminanter ligger utenfor individets kontroll – ulikhet de forårsaker er urettferdig og bør elimineres.
      - **Amartya Sens «capability approach»:** Helse er en vesentlig byggestein i menneskers «capabilities» – livsforutsetningene vi trenger for å delta i sosialt og politisk liv og realisere verdier vi har grunn til å verdsette. Sosial ulikhet i helse representerer dermed «inequity».
      - **Helse har verdi i seg selv:** Helse er et uttrykk for velferd, ikke bare et middel. At kontrollerbare sosiale forhold gir ulik realisering av helse, er urettferdig.
      - **Menneskerettighetsargumentet:** Retten til helse er del av de universelle menneskerettighetene. Bidrar sosiale, kontrollerbare forhold til ulik realisering av denne retten, er det en rettighetskrenkelse.
    modelSource: Sensorveiledning
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/samisk-helse, samfunnsmedisin/kortsvar/ovelse-urfolk-og-samiske-rettigheter]
    type: text
    points: 2
    stem: |
      Hva er et urfolk, og har Norge en urbefolkning?
    model: |
      (1 poeng for definisjonen, 1 poeng for å nevne at samene er urfolk i Norge.)

      Det finnes ingen universell definisjon, men vanlige kjennetegn er at urfolk ikke er det dominerende folket i samfunnet de er en del av, at de har bodd i området fra langt tilbake – før statsgrensene ble fastlagt – og at de har en egenartet kultur (ofte basert på naturressursene i området) og skiller seg sosialt, kulturelt og/eller språklig fra majoritetsbefolkningen. ILO-konvensjon nr. 169 (ratifisert av Norge i 1990), art. 1 nr. 1 b: folk som nedstammer fra dem som bebodde landet eller regionen da erobring eller kolonisering fant sted eller da de nåværende statsgrensene ble fastlagt, og som har beholdt alle eller noen av sine egne sosiale, økonomiske, kulturelle og politiske institusjoner.

      **Ja** – samene er urfolk i Norge (fastslått bl.a. i Høyesteretts Selbu-dom 2001, også i det sørsamiske området). Det avgjørende er tilknytning til området fra før statsgrensene ble etablert, ikke om gruppen var «de første» der.
    modelSource: Sensorveiledning
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-demografisk-epidemiologisk-transisjon]
    type: text
    points: 3
    stem: |
      Modellene for demografisk og epidemiologisk transisjon tar begge utgangspunkt i følgende kurver:

      *(Figur: diagram delt i fasene 1–5. Kurve A (rosa) og kurve B (blå) ligger begge høyt og svinger i fase 1. Kurve B faller fra starten av fase 2, mens kurve A holder seg høy gjennom fase 2 og faller først i fase 3. I fase 4 ligger A og B begge lavt og svinger rundt hverandre; i fase 5 (stiplet) faller A under B. Kurve C (rød) ligger lavt og flatt i fase 1, stiger bratt i fase 2–3 og flater ut høyt i fase 4–5.)*

      Hva viser de tre kurvene (A = rosa kurve, B = blå kurve, C = rød kurve)?
    figure: Den demografiske transisjonsmodellen (fase 1–5) med kurvene A, B og C uten betegnelser.
    model: |
      (1 poeng per riktig kurve; norsk eller engelsk begrep teller. Riktig begrep på feil kurve gir 0.)

      - **A (rosa): Fødselsrate** (crude birth rate)
      - **B (blå): Dødsrate** (crude death rate)
      - **C (rød): Befolkningstall** (total population)

      Dødsraten faller først (fase 2), fødselsraten følger etter (fase 3); i gapet mellom dem vokser befolkningen kraftig.
    modelSource: Sensorveiledning

