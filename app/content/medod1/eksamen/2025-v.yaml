  # ---------------- Generell kjemi ----------------
  - n: 32
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/likevektskonstant-fra-konsentrasjoner]
    type: single
    points: 1
    stem: |
      For reaksjonen:
      $\ce{2A + B <=> 2C + D}$
      ved likevekt, kan vi måle konsentrasjonene av alle reaktanter:

      [A] = 0,02 M
      [B] = 0,01 M
      [C] = 0,1 M
      [D] = 0,05 M

      Hva er $K_c$ for denne reaksjonen?
    options: ["2,5", "125", "0,008", "25000"]
    answer: [1]
    explanation: |
      $K_c = \dfrac{[C]^2[D]}{[A]^2[B]} = \dfrac{(0{,}1)^2 \cdot 0{,}05}{(0{,}02)^2 \cdot 0{,}01} = \dfrac{5{,}0\times10^{-4}}{4{,}0\times10^{-6}} = 125$
