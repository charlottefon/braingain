    stem: |
      29 år gamle Kristin Moe kommer på legevakten i Bergen en kveld oppunder jul. Hun har vært forkjølt lenge, nå føler hun seg helt elendig, har høy feber, hoster og blir tungpusten av å gå opp en trapp. Legen får vite at hun nettopp har mistet jobben som sveiser, hun er alenemor til to barn på 2 og 6. Hun gruer seg til å være med foreldrene i julen fordi far pleier å drikke for mye på den tiden. Legen tar en blodprøve og lytter på Kristins lunger og finner at hun har lungebetennelse.

