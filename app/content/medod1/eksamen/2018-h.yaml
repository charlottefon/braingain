title: MEDOD1 høst 2018
year: 2018
term: høst
source: medod1/exams/2018-medod1-h2018-med-svar--2098434.pdf
note: Oppgave 1–12 (akuttmedisin) er utelatt. Oppgave 125–127 («Schei-oppgavene» om helse og sykdom) hører til et tema som ikke har egen side i appen.
questions:
  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Det er store sosiale ulikheter i helse i Norge til tross for at vi har en velutbygd velferdsstat. Hva er den beste forklaringen på dette?
    options:
      - Velferdsordningene har liten effekt på helse
      - Velferdsordningene har ikke klart å motvirke skolefrafall, og lav utdanning og kunnskap er de viktigste årsakene til ulikhetene i helse
      - Sosial mobilitet gjør at de friskeste får høyere sosioøkonomisk status og velferdsordningene kompenserer bare delvis for det
      - Det er store sosiale ulikheter i helsevaner, som velferdsordningene bare delvis kompenserer for
    answer: [3]
    explanation: Helseatferd (særlig røyking, kosthold, fysisk aktivitet) er sterkt sosialt lagdelt i Norge og forklarer en stor del av helseforskjellene; velferdsordninger utjevner materielle forhold, men bare delvis atferd.
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Det er sosiale ulikheter i forekomsten av de fleste helseproblemer, med unntak av
    options: [Akutte skader, Kreft, Hjerte-/karsykdom, Epilepsi]
    answer: [3]
    explanation: Epilepsi har i liten grad sosial gradient i forekomst. Skader, de fleste kreftformer og særlig hjerte-/karsykdom er sosialt skjevfordelt.
  - n: 15
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilket av følgende tiltak har størst potensial for å utjevne sosiale ulikheter i sukkerforbruk?
    options:
      - Nøkkelhullmerking av sunne matvarer med lite sukker
      - Individuell kostholdsveiledning av pasienter som er i faresonen for å utvikle diabetes
      - Informasjonskampanjer om at sukker er skadelig for helsen
      - Høyere moms på sukkerholdige matvarer
    answer: [3]
    explanation: Strukturelle (oppstrøms) tiltak som pris virker på alle uten at den enkelte må ta et aktivt valg, og påvirker særlig grupper med lav inntekt. Informasjon og merking brukes mest av de ressurssterke og kan øke ulikheten.
  - n: 16
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilken del av politikken har størst mulighet til å påvirke sosiale ulikheter i helse på en positiv måte?
    options: [Helsepolitikken, Skattepolitikken, Arbeidsmarkedspolitikken, Innvandringspolitikken]
    answer: [1]
    explanation: Sosiale helseforskjeller skapes i stor grad utenfor helsetjenesten. Skattepolitikken omfordeler inntekt og påvirker de grunnleggende sosioøkonomiske forholdene (fundamentale årsaker) for hele befolkningen.
  - n: 17
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hvordan defineres relativ fattigdom i Norge?
    options:
      - Inntekt 90% under medianinntekten i tre år på rad
      - Inntekt 10% under medianinntekten i tre år på rad
      - Inntekt lik eller under medianinntekten i tre år på rad
      - Inntekt under 60 prosent av medianinntekten i tre år på rad
    answer: [3]
    explanation: Vedvarende lavinntekt (EU-skala) defineres som husholdningsinntekt under 60 % av medianinntekten i en treårsperiode.
  - n: 18
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva er den beste beskrivelsen av sosiale forskjeller i helse i Norge i dag?
    options:
      - De 20% fattigste har dårligere helse og dør tidligere enn resten av befolkningen
      - Risikoen for dårlig helse og tidlig død øker med synkende sosioøkonomisk status, men forskjellene er størst i de nederste gruppene
      - De 10% fattigste har dårligere helse og dør tidligere enn resten av befolkningen
      - Risikoen for dårlig helse og tidlig død øker jevnt med synkende sosioøkonomisk status
    answer: [1]
    explanation: Det er en gradient gjennom hele befolkningen (ikke bare et skille mellom de fattigste og resten), men gradienten er brattest i de laveste sosioøkonomiske gruppene.
  - n: 19
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, cellebiologi/sammensatte-tema/saliva-og-salivas-kjemi]
    type: single
    points: 1
    stem: Hva er mest oppstrøms mtp. utjevning av sosiale ulikheter i karies av følgende tiltak?
    options:
      - Gratis tannlegetime hvert år for alle
      - Opplæring i tannpuss på skolen
      - Generelle informasjonskampanjer om at sukkerinntak er skadelig for tennene.
      - Fluor i drikkevannet
    answer: [3]
    explanation: Fluor i drikkevannet når hele befolkningen automatisk, uten at den enkelte må gjøre noe – et typisk strukturelt oppstrøms tiltak. De andre krever individuell innsats eller oppsøking.
  - n: 20
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Forventet levealder er
    options:
      - Et mål for hvor lenge en pasient med uhelbredelig sykdom vil leve
      - Et mål på hvor lenge en person kan forvente å leve gitt at vedkommende gjennom hele sitt liv levde under de dødelighetsforhold som gjelder i dag.
      - Et godt mål for hvordan en forventer at levealderen vil utvikle seg i framtiden
    answer: [1]
    explanation: Forventet levealder beregnes fra dagens aldersspesifikke dødsrater; den er ikke en prognose for framtiden.
  - n: 21
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvis sosial ulikhet i helse er urettferdig, har dette konsekvenser for hva vi etisk sett bør gjøre med det. Hvilke tiltak er det relevant å sette i gang i et høyinntektsland med et offentlig helsevesen?
    options:
      - Vi trenger hovedsakelig spesialtiltak overfor dem som har aller minst å rutte med økonomisk
      - I et høyinntektsland med et godt utbygget helsesystem som er åpent for alle, er det kun preventive folkehelsetiltak vi bør sette i gang.
      - Vi kan yte mindre medisinsk hjelp til de sosioøkonomisk best stilte pasientene når de blir syke og heller bruke tid og ressurser på de vanskeligst stilte.
      - Vi må ha preventive folkehelsetiltak, men også ta sosioøkonomiske hensyn i klinisk behandling av pasienter
    answer: [3]
    explanation: Ulikhetene oppstår både utenfor og innenfor helsetjenesten (f.eks. ulik bruk av spesialisthelsetjenester), så både forebyggende befolkningstiltak og sosialt bevisst klinisk praksis trengs.
