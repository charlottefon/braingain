  - n: 60
    subject: generell-kjemi
    topics: [proteiner/teori/aminosyrer, cellebiologi/sammensatte-tema/multippel-sklerose-og-myelin]
    type: single
    points: 1
    stem: |
      Myelin i både det sentrale og perifere nervesystemet inneholder flere spesifikke proteiner. Ett av disse er basisk myelinprotein (MBP), som er viktig for danning av myelin og som deltar i sykdomsprosesser i for eks. multippel sklerose.
      Den elektriske ladningen i myelinproteiner er svært viktig for å binde sammen lipidmembranene i myelin.
      MBP-proteinet har 169 aminosyrer, og mange av disse har sidekjeder som kan fungere som syrer eller baser:

      - 18 stykk arginin (pKa ≈ 12)
      - 9 stykk asparaginsyre (pKa ≈ 4)
      - 2 stykk glutaminsyre (pKa ≈ 4)
      - 13 stykk lysin (pKa ≈ 10)
      - 10 stykk histidin (pKa ≈ 6)

      Hva blir elektrisk nettoladning til MBP ved nøytral pH (pH=7)?
    options: ["+20", "-1", "+31", "+30"]
    answer: [0]
    explanation: Ved pH 7 er Arg og Lys protonert (+18 + 13 = +31), Asp og Glu deprotonert (−9 − 2 = −11), og His (pKa 6 < 7) i hovedsak uladet. Netto ≈ +20 (N- og C-terminalen opphever hverandre).
  - n: 61
