    type: single
    points: 1
    stem: En normal proteinkinase har $V_{max}$ = 150 µmol produkt (fosforylert protein)/min og $K_M$ = 25 µM. En sykdomsassosiert mutant av dette enzymet har $V_{max}$ = 50 µmol produkt/min og $K_M$ = 20 µM. Hva er riktig svar?
    options:
      - Mutanten forskyver likevekten til produktdannelse i større grad enn det normale enzymet
      - Den initiale hastigheten til reaksjonen katalysert av det muterte enzymet ved en konsentrasjon av substrat på 20 µM, er 25 µmol produkt/min.
      - Mutanten har lavere affinitet til substratet enn det normale enzymet
      - Ved en substratkonsentrasjon på 20 µM for det normale enzymet, vil hastigheten være 25 µmol produkt/min.
    answer: [1]
    explanation: |
      Mutant: $V_0 = \dfrac{50 \cdot 20}{20 + 20} = 25$ µmol/min ([S] = Kₘ). Normalt enzym ved 20 µM: $\dfrac{150 \cdot 20}{25+20} = 66{,}7$ µmol/min. Mutanten har lavere Kₘ (høyere affinitet), og enzymer endrer ikke likevekten.
