  - n: 13
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-urettferdighet-og-helsetjenesten]
    type: text
    points: 5
    stem: |
      Hvorfor er sosial helseulikhet urettferdig? Nevn minst tre ulike argumenter hentet fra pensum. Svar i kulepunkter; ett punkt per argument.

      (du kan maksimalt oppnå 5 poeng)
    model: |
      - **Norman Daniels:** God helse er avgjørende for at mennesker skal kunne fungere normalt og sikres normale muligheter i livet. Kontrollerbare, sosiale forhold som indirekte påvirker folks helse er derfor urettferdige.
      - **Luck-egalitarisme:** Sosiale helsedeterminanter er utenfor individets kontroll – hvis disse forårsaker sosial ulikhet i helse, er det urettferdig.
      - **Amartya Sen:** Helse er en forutsetning for å kunne delta i sosialt og politisk liv og realisere verdier vi har grunn til å verdsette. Sosial ulikhet i fordeling av helse er urettferdig fordi det fratar mennesker muligheter.
      - Helse har verdi i seg selv, ikke bare fordi helse setter oss i stand til å oppnå noe annet.
      - **Menneskerettighetserklæringen:** Helse er en universell menneskerettighet.

      *Poeng:* 5 for perfekte svar med 3 (eller flere) navngitte argumenter; 4 for presise og gode svar med 3 argumenter; 3 for forventet god forståelse og 3 argumenter; 2 for to argumenter; 1 for ett argument.
    modelSource: Sensorveiledning
  - n: 14
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/kortsvar/ovelse-forebyggingsparadokset, samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: text
    points: 5
    stem: |
      Hva er “forebyggingsparadokset” i folkehelsearbeid? Svaret skal være på 2-4 setninger.

      (du kan maksimalt oppnå 5 poeng her)
    model: |
      Forebyggingsparadokset innebærer at den totale folkehelseeffekten av et forebyggende tiltak er minst der problemene er størst. Dette betyr at mer målretting ikke nødvendigvis er mest effektivt. Forebyggingsparadokset viser at den største effekten på totaltallene oppnås ved universelle strategier – tiltak som treffer bredt.

      (Utdyping: I store befolkningsgrupper er riktignok risikoen per person lavere, men totalantallet personer er så mye større at effekten i sum også blir stor. Høyrisikogrupper har riktignok stor risiko, men er gjerne små i antall.)

      *Poeng:* 5 for perfekte svar; 4 for over gjennomsnittet presise og gode svar; 3 for forventet god forståelse; 2 hvis inne på temaet, men upresis; 1 hvis inne på temaet, men uklar forståelse.
    modelSource: Sensorveiledning
