questions:
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging, samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Hvordan definerer Verdens helseorganisasjon begrepet "helse"?
    options:
      - Helse er en tilstand av fullstendig fysisk velvære
      - Helse er en tilstand av fysisk, mentalt og sosialt velvære
      - Helse er å være i stand til å forsørge seg selv gjennom eget arbeid
      - Helse er fravær av sykdom og lyte
    answer: [1]
    explanation: WHO (1948) definerer helse som «en tilstand av fullstendig fysisk, mentalt og sosialt velvære, og ikke bare fravær av sykdom eller lyte». Første alternativ mangler den mentale og sosiale dimensjonen.
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Sosiale ulikheter i helse kan observeres…
    options:
      - På mål som levealder, men ikke på selvrapporterte helsemål
      - På mål som levealder og selvrapporterte helsemål, men kun blant eldre
      - På mål som levealder og selvrapporterte helsemål
      - På mål som levealder, men kun i storbyene
    answer: [2]
    explanation: Den sosiale gradienten ses både i objektive mål (levealder, dødelighet) og i selvrapportert helse, i alle aldersgrupper og i hele landet.
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Ifølge Statistisk sentralbyrå endret Gini-koeffisienten for Norge seg mellom 2022 og 2023 fra 0,253 til 0,248. Hva betyr dette?
    options:
      - At sosiale ulikhet i helse gikk ned
      - At inntektsulikheten i befolkningen gikk ned
      - At ulikhet i helsetjenestebruken gikk ned
      - At ulikhet i forventet levealder gikk ned
    answer: [1]
    explanation: Gini-koeffisienten er et mål på inntektsulikhet (0 = alle har lik inntekt, 1 = én person har all inntekt). En lavere verdi betyr mindre inntektsulikhet – den sier ingenting direkte om helse.
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Hva har vært den viktigste endringen når det gjelder dødsårsaker i Norge etter annen verdenskrig?
    options:
      - Markant vekst i antall voldsomme dødsfall (ulykker, skader, forgiftninger), til tross for økt oppmerksomhet og målrettede tiltak (voldsparadokset)
      - Stor nedgang i barnedødeligheten, særlig i perioden 1950-1970 (barnedødsmirakelet)
      - Stor nedgang i dødeligheten som følge av hjerte-/karsykdommer, særlig knyttet til medisiner og kosthold (den kardiovaskulære revolusjon)
      - Stor nedgang i dødsfall som følge av kreft/svulster, uten at vi fullt ut kan forklare årsakssammenhengene (kreftgåten)
    answer: [2]
    explanation: Etter en topp rundt 1970 falt dødeligheten av hjerte- og karsykdom kraftig (den kardiovaskulære revolusjon), takket være bedre behandling, medisiner, mindre røyking og endret kosthold. De andre alternativene er konstruerte «paradokser».
  - n: 5
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/samisk-helse]
    type: single
    points: 1
    stem: Du har fått sommerjobb i resepsjonen på et helsesenter i Karasjok. En dag kommer en eldre dame innom og henvender seg til deg på nordsamisk. Du forstår ikke hva hun sier. Hva gjør du?
    options:
      - Ber henne komme tilbake med tolk, en venn, eller et familiemedlem som kan oversette
      - Henter en kollega som kan språket; sameloven slår fast at urfolk har rett til å bli betjent på samisk
      - Krever at hun snakker norsk; vi er tross alt i Norge
      - Henviser henne til samelegevakten; sameloven slår fast at urfolk har rett på eget helsevesen
    answer: [1]
    explanation: Karasjok ligger i forvaltningsområdet for samisk språk, der sameloven gir rett til å bli betjent på samisk i lokale offentlige helse- og sosialinstitusjoner. Det finnes ingen egen «samelegevakt», og ansvaret for tolking ligger hos tjenesten, ikke pasienten.
  - n: 6
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: I en undersøkelse av barn og ungdom, «ungdata», kom det frem at 15% av elever i Bergen i 2021 rapporterte at de aldri har vært med i en organisasjon, klubb eller lag. Hvilken offentlig aktør har i følge Lov om folkehelsearbeid (folkehelseloven) hovedansvar for å holde oversikt over helsetilstanden i befolkningen i Bergen og faktorer som virker inn på helsen der?
    options:
      - Folkehelseinstituttet
      - Helse- og omsorgsdepartementet
      - Bergen kommune
      - Helsedirektoratet
    answer: [2]
    explanation: Folkehelseloven § 5 pålegger kommunen å ha nødvendig oversikt over helsetilstanden i befolkningen og faktorene som påvirker den. Statlige etater (FHI, Hdir) støtter med data og råd.
  - n: 7
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilket av følgende tiltak er mest oppstrøms med hensyn til utjevning av sosiale ulikheter i helse?
    options:
      - Frysing av nivået på egenandeler i helsetjenesten (Frikort egenandelstak)
      - Skattelette for lavinntektsfamilier
      - Døgnåpen telefonlinje for studenter med psykiske plager
      - Gratis tannhelsetjeneste for voksne i utkantkommuner
    answer: [1]
    explanation: Oppstrømstiltak endrer de grunnleggende sosiale og økonomiske vilkårene (her inntektsfordelingen). Egenandeler, tannhelse og hjelpetelefon er tiltak i helsetjenesten og dermed nedstrøms.
  - n: 8
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: Hvilket av disse tiltakene er mest nedstrøms med hensyn til utjevning av sosial ulikhet i helse?
    options:
      - Gratis varmt måltid for hjemmeboende eldre
      - Mer skatt på usunne varer enn sunne varer (jf. “sukkeravgiften”)
      - Sletting av studielån
      - Åpen helsestasjon på ettermiddagstid for ungdom med psykiske plager
    answer: [2]
    explanation: |
      Merk: Den offisielle fasiten markerer «Sletting av studielån», men det er et økonomisk omfordelingstiltak og dermed **oppstrøms** (slik spørsmål 7 også legger til grunn for skattelette). Det mest nedstrøms tiltaket er etter vanlig definisjon **åpen helsestasjon for ungdom med psykiske plager** – et tiltak i helsetjenesten som behandler problemer som allerede har oppstått. Fasiten er trolig feil.
  - n: 9
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Med “sosiale helseforskjeller” mener vi…
    options:
      - at vi kan forvente tilfeldig variasjon i helseutfall mellom ulike sosioøkonomiske grupper
      - at noen helseutfall ikke har blitt påvirket av den generelle bedringen i levekår siste 150 år
      - at vi har et uoppnådd helsepotensial for deler av befolkningen
      - at sammenhengen mellom helseutfall og bakgrunnsfaktorer er vanskelig å påvirke
    answer: [0]
    explanation: |
      Merk: Den offisielle fasiten markerer «tilfeldig variasjon», men sosiale helseforskjeller er nettopp *systematiske* (ikke tilfeldige) forskjeller langs en sosial gradient. Riktig svar er etter pensum «at vi har et **uoppnådd helsepotensial** for deler av befolkningen». Fasiten er trolig feil.
  - n: 10
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/temaer/velferdsstat-og-helsetjeneste]
    type: single
    points: 1
    stem: I et samfunn med en godt utbygd velferdsstat, vil sosial ulikhet i helse...
    options:
      - …etter hvert avta
      - …sjeldent oppstå
      - …øke mer enn i land uten velferdsstatens ytelser
      - …fortsatt kunne oppstå
    answer: [3]
    explanation: De nordiske velferdsstatene har ikke mindre relative helseforskjeller enn andre europeiske land («velferdsstatsparadokset»). Velferdsstaten hindrer altså ikke at sosial ulikhet i helse oppstår.
  - n: 11
