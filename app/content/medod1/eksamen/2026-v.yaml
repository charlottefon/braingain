    type: text
    points: 2
    stem: |
      Foreligger strukturene nedenfor som R eller S?

      **a)** Stereosenter med $\ce{CH2CH2CH3}$ opp (i planet), $\ce{CH3CH2}$ ned til venstre (i planet), $\ce{CH3}$ til høyre på stiplet kile (bak planet) og H ned til høyre på fylt kile (mot betrakteren).

      **b)** Stereosenter med $\ce{CH2CH3}$ opp (i planet), $\ce{CH3CH2CH2}$ ned til venstre (i planet), H til høyre på stiplet kile (bak planet) og $\ce{CH3}$ ned til høyre på fylt kile (mot betrakteren).

      (1 poeng for hver riktig identifisert struktur, totalt kan du oppnå 2 poeng her)
    figure: "To kile-/strekformler av 3-metylheksan (beskrevet i teksten); begge er (R)-3-metylheksan: `CCC[C@H](C)CC`"
    model: |
      **a) R. b) R.**

      Prioritet: propyl > etyl > metyl > H.

      a) Teller man fra høyest prioritert gruppe (propyl → etyl → metyl), går man mot klokken. Men H (lavest prioritet) peker mot betrakteren (fylt kile), så svaret må snus: ikke S, men **R**.

      b) Her peker H bakover (stiplet kile), så man teller på vanlig måte: propyl (nede til venstre) → etyl (opp) → metyl (nede til høyre) går med klokken → **R**.
