    type: single
    points: 1
    stem: Et protein eluerer sent fra en gelfiltreringskolonne, men migrerer raskt i SDS-PAGE. Hva indikerer dette om proteinets egenskaper?
    options:
      - Det er et protein med ustabil tertiærstruktur
      - Det er et svært kompakt protein med uvanlig høy tetthet
      - Det er et oligomert protein som dissosierer til subenheter under SDS betingelser
      - Det er et monomerisk protein som assosierer til en tetramer under SDS betingelser
    answer: [2]
    explanation: |
      Merk: Fasiten markerer «oligomert protein som dissosierer», men logikken går ikke helt opp. Sen eluering i gelfiltrering betyr at det native proteinet er *lite*, og rask migrering i SDS-PAGE betyr at polypeptidet er *lite* – det stemmer med et lite protein. Et oligomer som dissosierer under SDS ville tvert imot eluere *tidlig* (stort i nativ form) og vandre raskt i SDS-PAGE. Oppgaveteksten mente trolig «eluerer *tidlig*». Lær poenget: gelfiltrering måler nativ størrelse, SDS-PAGE måler størrelsen på de denaturerte polypeptidkjedene.
