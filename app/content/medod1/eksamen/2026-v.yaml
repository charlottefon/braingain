    stem: Hvordan har forventet levealder etter husholdningsinntekt i Norge endret seg de siste tiårene?
    options:
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt økte
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt ble redusert, men kun for kvinner
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt ble redusert, men kun for menn
      - Gapet mellom de 25% med høyest og de 25% med lavest inntekt ble redusert
    answer: [0]
    explanation: Fra 2005 til 2015 økte levealderen med over 3 år i høyeste inntektskvartil, men nesten ikke (menn) eller gikk ned (kvinner) i laveste kvartil – gapet økte for begge kjønn.
  - n: 12
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-elvemetaforen]
    type: single
    points: 1
    stem: Du har fått jobb som kommuneoverlege i en vestlandskommune. En fersk rapport viser at mange elever kjenner på ensomhet. Barn i lavinntektsfamilier har spesielt store problemer. Hvilket av disse tiltakene kan antas å ha størst effekt på utjevning av sosial ulikhet i helse?
    options:
      - Oversette informasjonsbrosjyrer til foresatte til flere språk om hvordan en tidlig kan oppdage symptomer på psykisk sykdom hos barn
