    subject: proteiner
    topics: [proteiner/teori/enzymkatalyse]
    type: text
    points: 3
    stem: |
      Hva er transisjonstilstandsanaloger, og hva kan de brukes til? Forklar kort.

      Full uttelling (3 poeng) gis for en korrekt definisjon og minst én relevant anvendelse.
    model: |
      **Definisjon (opptil 1,5 p):** Transisjonstilstandsanaloger er stabile molekyler som etterligner reaksjonens transisjonstilstand, og som derfor bindes spesielt sterkt i enzymets aktive sete.

      **Anvendelser (1,5 p for minst én riktig):**
      1. **Som potente enzymhemmere/inhibitorer.** Stabile transisjonstilstandsanaloger binder svært sterkt i det aktive setet og hemmer enzymaktiviteten kompetitivt (jf. Paulings forslag; grunnlag for legemiddeldesign).
      2. **Til å lage katalytiske antistoffer («abzymer»).** En transisjonstilstandsanalog brukes som antigen; immunisering gir antistoffer som stabiliserer den tilsvarende transisjonstilstanden og dermed kan være katalytisk aktive.

      To korrekte anvendelser kan kompensere for en svak definisjon.
    modelSource: Sensorveiledning
