  - n: 87
    subject: proteiner
    topics: [proteiner/enzymkinetikk, proteiner/teori/enzymregulering]
    type: single
    points: 2
    stem: |
      Et enzym har $K_M$ = 4 mM og $V_{max}$ = 120 µmol/min.

      A) Hva er reaksjonshastigheten når substratkonsentrasjonen [S] = 2 mM?

      B) Hva er reaksjonshastigheten ved samme substratkonsentrasjon, men i nærvær av en konkurrerende inhibitor som øker $K_M$ til 8 mM?

      (du kan maksimalt oppnå 2 poeng her)
    options:
      - "A) 80 µmol/min; B) 60 µmol/min"
      - "A) 60 µmol/min; B) 40 µmol/min"
      - "A) 40 µmol/min; B) 24 µmol/min"
      - "A) 20 µmol/min; B) 12 µmol/min"
    answer: [2]
    explanation: |
      Michaelis–Menten: $v_0 = \dfrac{V_{max}[S]}{K_M + [S]}$.
      A) $v_0 = \dfrac{120 \cdot 2}{4 + 2} = \dfrac{240}{6} = 40$ µmol/min.
      B) Konkurrerende hemmer øker tilsynelatende $K_M$, $V_{max}$ er uendret: $v_0 = \dfrac{120 \cdot 2}{8 + 2} = \dfrac{240}{10} = 24$ µmol/min.
