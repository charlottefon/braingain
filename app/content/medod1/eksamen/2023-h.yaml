    figure: |
      Søylediagram over GINI-indeksen (inntektsulikhet) for OECD-land, sortert stigande frå Slovakia (~0,22) til Costa Rica (~0,48). Danmark (~0,265) er lågast av dei nordiske landa, deretter Finland (~0,27), Noreg (~0,28) og Sverige (~0,285); Tyskland ~0,295; USA ~0,375.
    stem: |
      Se på grafen med oversikten over GINI indeksen. Hvilket utsagn er rett med tanke på det du ser på grafen?
    options:
      - Danmark er det landet av de nordiske landene med lavest inntektsulikhet
      - Sverige er det av de nordiske landene med høyest utdanningsulikhet
      - Tyskland har lavere levealder enn USA
      - Norge har lavere levealder enn Sverige
    answer: [0]
    explanation: |
      GINI-indeksen måler berre inntektsulikskap – grafen seier ingenting om utdanning eller levealder. Danmark har lågast GINI av dei nordiske landa på grafen.
