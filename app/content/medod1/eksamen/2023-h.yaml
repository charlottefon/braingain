    explanation: |
      Delen barn i hushald med vedvarande låginntekt i Noreg har auka jamt, frå rundt 3–4 % kring år 2000 til nærare 12 % i 2021 (SSB, EU-60-mål).
  - n: 4
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    figure: "Fire kurver for forventa levealder (y, 70–90 år) etter hushaldningsinntekt i prosentilar (x, 0–100). A: flat rundt 76 år, bratt auke berre i øvste tidel. B: fallande frå 81 til 74 år. C: flat rundt 80,5 år, fall heilt i toppen. D: stigande gjennom heile fordelinga, bratt i dei lågaste prosentilane (frå ca. 72 år) og deretter jamn auke til ca. 86 år."
    stem: |
      Se for deg en kurve hvor inntekt øker langs x-aksen og forventet levealder øker i år langs y-aksen. Hvilket av alternativene på bildet beskriver best hvordan kurven for inntekt og forventet levealder ser ut i Norge?
    options: ["C", "A", "B", "D"]
    answer: [3]
    explanation: |
      Helse følgjer ein sosial gradient – forventa levealder aukar gjennom heile inntektsfordelinga, ikkje berre for dei fattigaste eller rikaste, og forskjellen er størst i botnen av fordelinga.
  - n: 5
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: |
      Kva påstand er mest riktig når det gjeld inntektsfordelinga i Noreg?
    options:
      - Inntektsskilnaden i Noreg ligg godt under gjennomsnittet av dei andre OECD landa
      - Formuesskilnaden er mindre enn inntektsskilnaden
      - Formuesskilnaden og inntektsskilnaden er av same storleiksorden
      - Formuesskilnaden i Noreg ligg godt under gjennomsnittet av dei andre OECD landa
    answer: [0]
    explanation: |
      Noreg har låg inntektsulikskap samanlikna med OECD-snittet, men formuen er mykje skeivare fordelt enn inntekta – formuesskilnaden er altså større enn inntektsskilnaden og ikkje spesielt låg internasjonalt.
  - n: 6
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/samisk-helse, samfunnsmedisin/kortsvar/ovelse-urfolk-og-samiske-rettigheter]
    type: single
    points: 1
    stem: |
      I 2020 vart forskrift om nasjonal retningsline for kva medisin- og tannlegeutdanninga skulle innehalde gjeldande. Der står det «Utdanninga skal også sikre kompetanse og holdningar som dannar grunnlag for likeverdige helsetenester for alle grupper i samfunnet, deriblant kompetanse om samars status som urfolk og deira rettigheiter til språklege og kulturelt tilrettelagde tenester.»

      Du er ferdig med første halvår på medisin-tannlegestudiet og har nyleg vore gjennom ein bolk om samars rettigheiter. Du skal forklare kva eit urfolk er til familien din. Kva alternativ beskriv best forståinga av omgrepet "urfolk"?
    options:
      - folk og folkegrupper som må ha vore dei første menneska på staden, og at dette er avgjort med hjelp av arkeologiske eller kulturhistoriske funn
      - ei gruppe som innanfor eit større samfunn sjølv ser på seg som ei gruppe i forholdet til andre, og som også vert identifisert som ei eiga folkegruppe av andre.
      - folk og folkegrupper som har vore forsøkt undertrykt frå sentrale myndigheiter si side, som i dag stadig må kjempe mot undertrykking
      - folk og folkegrupper som er opphavelege med ei lang tilknyting til det området dei bur i og dei har budd i områda før statens grenser vart fastlagde
    answer: [3]
    explanation: |
      Etter ILO-konvensjon 169 er urfolk etterkomarar av dei som budde i området då dagens statsgrenser vart fastlagde, og som har behalde eigne sosiale, økonomiske og kulturelle institusjonar. Det krev ikkje at dei var «dei første menneska» der. Alternativ 2 beskriv ei etnisk gruppe generelt.
  - n: 7
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: |
      Kva for eit av følgjande tiltak er mest «oppstraums» med omsyn til å utjevne sosiale skilnadar i helse?
    options:
      - Tiltak som aukar andelen som gjennomfører vidaregåande skule
      - Ingen eigenandel for helsetenester for vaksne
      - Gratis treningstilbod til vaksne på kommunale frisklivssentralar
      - Oppslag på helsestasjonar om fordelar ved røykeslutt for gravide kvinner
    answer: [0]
    explanation: |
      Utdanning er ein grunnleggjande sosial determinant (bakanforliggjande årsak) som påverkar inntekt, arbeid og levevanar. Dei andre tiltaka rettar seg mot helsetenester eller enkeltåtferd lenger nedstraums.
  - n: 9
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/kortsvar/ovelse-proporsjonal-universalisme]
    type: single
    points: 1
    stem: |
      Helsedirektoratet skriv i kunnskapsoppsummeringa «Kunnskapsoppsummering om skilnadar i helse og livskvalitet i Noreg sidan 2014» at «Det krevst proporsjonale universelle tiltak for å redusere helseskilnadane i Noreg.» Kva ligg i omgrepet «proporsjonale universale tilnærmingar»?
    options:
      - Det betyr tiltak som treff alle, samtidig som verkemiddel og tenester ytterlegare vert tilpassa ulike behov.
      - Det betyr tiltak som går ut på å gjere inntektsskilnaden mindre
      - Det betyr tiltak som går ut på å sørgje for at formueskilnaden og inntektsskilnaden er av same storleiksorden
      - Det betyr at tiltak skal vere retta mot dei som treng det mest og vere skreddarsydd for sårbare grupper
    answer: [0]
    explanation: |
      Proporsjonal universalisme (Marmot) = universelle tiltak for alle, men med innsats og intensitet som aukar i takt med behovet. Alternativ 4 beskriv reint målretta (selektive) tiltak.
  - n: 10
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin, samfunnsmedisin/kortsvar/ovelse-tuberkulosen]
    type: single
    points: 1
    stem: |
      Sunnheitslova av 1860 - helsevesenets grunnlov - var inspirert av to konkurrerande etiologiar, kontagionistar og miasmatikarar. Kva av desse tiltaka var det miasmatikarane ivra mest for?
    options:
      - Segregering (isolasjon av sjuke)
      - Sanitetstiltak
      - Karantene
      - Smittesporing
    answer: [1]
    explanation: |
      Miasmatikarane meinte sjukdom kom frå «dårleg luft» frå forureining og forråtning, og ivra derfor for sanitære tiltak (renovasjon, vatn, kloakk, bustader). Isolasjon, karantene og smittesporing var kontagionistane sine tiltak.
  - n: 11
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: |
      Sunnheitslova vert også kalla "helsevesenets grunnlov". Kva av følgjande påstandar er FEIL?
    options:
      - Sunnheitslova innførte tvungen vaksinasjon mot koppar og tuberkulose
      - Sunnheitslova dreidde seg om tilsyn, førebygging og kamp mot epidemiske, endemiske og smittsame sjukdomar
      - Sunnheitslova vart til før vi visste at infeksjonssjukdomar var forårsaka av smittestoff (bakteriar).
      - Sunnheitslova etablerte permanente sunnheitskommisjonar i alle distrikt, leda av distriktslegen.
    answer: [0]
    explanation: |
      Koppevaksinasjon vart påbode allereie i 1810, og BCG-vaksine mot tuberkulose fanst ikkje før på 1920-talet – sunnheitslova (1860) innførte ingen av delane. Lova kom før bakteriologien (Koch/Pasteur) og oppretta sunnheitskommisjonar leia av distriktslegen.
