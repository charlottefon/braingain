      For enzymkatalyserte reaksjonar er hastigheitskonstanten for danning av ES-kompleks definert som $k_1$, og $k_{-1}$ er hastigheitskonstanten for dissosiering av ES tilbake til fritt enzym og substrat. $k_2$ er hastigheitskonstanten for omdanning til produkt.

      Når $k_{-1} > k_2$, det vil seie når hastigheitskonstanten for dissosiasjon av enzym-substratkomplekset er større enn hastigheitskonstanten for omdanning til produkt, er $K_M$ mest analogt med
    options: ["$K_d$", "$1/k_{cat}$", "$K_a$", "$k_{cat}$"]
    answer: [0]
    explanation: |
      $K_M = \frac{k_{-1} + k_2}{k_1}$. Når $k_{-1} \gg k_2$, blir $K_M \approx k_{-1}/k_1 = K_d$, dissosiasjonskonstanten for ES. Då er $K_M$ eit mål på (omvendt) affinitet.
