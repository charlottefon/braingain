    stem: |
      Me har 5,0 ml med protonert (syreform) toprotisk aminosyre ($\ce{H2A+}$), som har konsentrasjon 0,1 M.

      $K_{a1} = 4{,}6 \times 10^{-3}$

      $K_{a2} = 2{,}0 \times 10^{-10}$

      I undervisningslaboratoriet, titrerer me no prøven med 0,1 M NaOH.

      Berekn pH etter tilsetjing av 7,0 ml NaOH!
    options: ["9,52", "9,88", "2,71", "2,16"]
    answer: [0]
    explanation: |
      $n(\ce{H2A+}) = 5{,}0\text{ ml} \times 0{,}1\text{ M} = 0{,}50$ mmol; $n(\ce{OH-}) = 0{,}70$ mmol.

      Dei første 0,50 mmol $\ce{OH-}$ gjer all $\ce{H2A+}$ om til HA (første ekvivalenspunkt). Dei resterande 0,20 mmol gjer 0,20 mmol HA om til $\ce{A-}$, så det er att 0,30 mmol HA.

      Buffer HA/$\ce{A-}$: $pK_{a2} = -\log(2{,}0\times10^{-10}) = 9{,}70$, og

      $pH = 9{,}70 + \log\frac{0{,}20}{0{,}30} = 9{,}70 - 0{,}18 = 9{,}52$.
