    stem: |
      *Dette er en dra og slipp-oppgave.*

      Plasser følgende tiltak for utjevning av sosial ulikhet på aksen som går fra oppstrøms til nedstrøms (Oppstrøms – Midtstrøms – Nedstrøms):
    parts:
      - { prompt: "Progressiv beskatning", answer: "Oppstrøms" }
      - { prompt: "Fritidstilbud med valgfri kontingent", answer: "Midtstrøms" }
      - { prompt: "Helsetjeneste med mål om å være et lavterskeltilbud til de med mild/moderat depresjon og angst", answer: "Nedstrøms" }
    explanation: |
      Merk: fasit-PDF-en viser ikkje plasseringa – dette er eigenlaga løysing. Progressiv skatt endrar den grunnleggjande inntektsfordelinga i samfunnet (oppstrøms). Eit fritidstilbod med valfri kontingent gjer arenaer for barn/unge tilgjengelege uavhengig av inntekt (midtstrøms, levekår/livsstil). Eit lågterskel helsetilbod behandlar sjukdom som alt har oppstått (nedstrøms).
  - n: 2
    subject: samfunnsmedisin
