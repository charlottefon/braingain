    points: 1
    stem: Hva er sant om hemoglobin/myoglobin?
    options:
      - Hemoglobin er en god bærer av O₂ fordi det har lav affinitet for O₂
      - Hemoglobin er en god bærer av O₂ på grunn av sin variabel affinitet for O₂ (er høy når O₂-konsentrasjonen er høy og lav når O₂-konsentrasjonen er lav)
      - Myoglobin er en bedre bærer av O₂ enn hemoglobin
      - Hemoglobin er en god bærer av O₂ på grunn av sin variable affinitet for O₂ (er lav når O₂-konsentrasjonen er høy og høy når O₂-konsentrasjonen er lav)
