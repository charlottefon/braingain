  - n: 60
    subject: generell-kjemi
    topics: [generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/regnetyper/henderson-hasselbalch, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: text
    points: 10
    stem: |
      Denne oppgaven skal besvares med egne ord. Vær kort og presis. Estimert tid på oppgaven er ca. 15 minutter.

      a) Vis (med formler eller ligninger) sammenhengen mellom respirasjonen og blodets syre/base-balanse.

      b) Hvilke 4 prinsipielt forskjellige syre/base-forstyrrelser kan forekomme i blodet? Forklar, med henvisning til ligningen(e) under (a) hvordan de 4 forskjellige forstyrrelsene fører til endring i pH, og nevn ett eksempel for hver av forstyrrelsene på kliniske tilstander hvor de forekommer.

      c) Hva menes med «kompensasjon» i forbindelse med syre/base-forstyrrelser i blodet? Hvilke former for kompensasjon kan forekomme ved de 4 forskjellige syre/base-forstyrrelsene, og hvordan påvirker disse pH?
    model: |
      **a)** $\ce{CO2 + H2O <=> H2CO3 <=> H+ + HCO3-}$ (karbonsyreanhydrase katalyserer første trinn). Henderson–Hasselbalch for bikarbonatbufferen:

      $$\text{pH} = 6{,}1 + \log\frac{[\ce{HCO3-}]}{0{,}03 \cdot p\ce{CO2}}$$

      (pCO₂ i mmHg; normalt $[\ce{HCO3-}] \approx 24$ mM, pCO₂ ≈ 40 mmHg → pH ≈ 7,4.) Lungene styrer nevneren (pCO₂) via ventilasjonen, nyrene styrer telleren ($\ce{HCO3-}$).

      **b)**

      | Forstyrrelse | Primær endring | pH | Eksempel |
      |---|---|---|---|
      | Respiratorisk acidose | pCO₂ ↑ (hypoventilasjon) | ↓ | KOLS, opioid-/sovemiddelforgiftning, alvorlig astma |
      | Respiratorisk alkalose | pCO₂ ↓ (hyperventilasjon) | ↑ | Angst/panikkanfall, opphold i høyden |
      | Metabolsk acidose | $\ce{HCO3-}$ ↓ (syre tilføres/dannes, eller base tapes) | ↓ | Diabetisk ketoacidose, laktacidose (sjokk), nyresvikt, kraftig diaré |
      | Metabolsk alkalose | $\ce{HCO3-}$ ↑ (syre tapes) | ↑ | Langvarige oppkast (tap av HCl), diuretika |

      **c)** Kompensasjon betyr at kroppen endrer den *andre* komponenten i forholdet $[\ce{HCO3-}]/p\ce{CO2}$ for å bringe pH tilbake mot normalt (7,35–7,45). Metabolske forstyrrelser kompenseres *respiratorisk* (raskt, minutter–timer): hyperventilasjon (Kussmaul-respirasjon) senker pCO₂ ved metabolsk acidose; hypoventilasjon øker pCO₂ ved metabolsk alkalose. Respiratoriske forstyrrelser kompenseres *renalt/metabolsk* (langsomt, dager): nyrene skiller ut mer H⁺ og tar opp mer $\ce{HCO3-}$ ved respiratorisk acidose, og skiller ut $\ce{HCO3-}$ ved respiratorisk alkalose. Kompensasjonen flytter pH mot normalt, men vanligvis ikke helt – og både pCO₂ og $\ce{HCO3-}$ blir da unormale.
    modelSource: Egenlaget løsningsforslag
