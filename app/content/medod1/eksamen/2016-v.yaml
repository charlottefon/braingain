  - n: 64
    subject: proteiner
    topics: [proteiner/enzymkinetikk, proteiner/teori/enzymkatalyse]
    type: single
    points: 2
    stem: |
      To varianter av enzymet ribonuklease A skiller seg fra hverandre i en aminosyre.

      Følgende kinetiske parametere ble målt i aktivitetsmålinger:
      Enzympreparat med ribonuklease A; $V_\text{max}$: 100 mikromol/min; $K_M$ = 10 mM
      Enzympreparat med ribonuklease B; $V_\text{max}$: 1 mikromol/min; $K_M$ = 0,1 mM.

      Basert på denne informasjonen kan vi si at følgende er sant:
    options:
      - a) Ribonuklease B har høyere affinitet til substratet enn ribonuclease A
      - b) Den initiale hastigheten til reaksjonen katalysert av enzym A ved en konsentrasjon av substrat 10 mM er 50 mikromol/min.
      - c) Enzym A forskyver likevekten til produktdannelse i større grad enn enzym B.
      - d) Både svar a og b er korrekte
      - e) Svarene a, b og c er alle korrekte
    answer: [3]
    explanation: |
      a) Lavere $K_M$ (0,1 vs 10 mM) betyr høyere (tilsynelatende) affinitet → B. b) $v_0 = \frac{100 \cdot 10}{10 + 10} = 50$ μmol/min (når $[S] = K_M$ er $v_0 = V_\text{max}/2$). c) Enzymer endrer ikke likevekten, bare hvor raskt den nås. Altså a og b.
  - n: 65
    subject: proteiner
    topics: [proteiner/enzymkinetikk, proteiner/teori/enzymregulering]
    type: multi
    points: 2
    stem: Hvilke(t) av følgende utsagn om Lineweaver-Burk-plott er riktige?
    options:
      - Et Lineweaver-Burk-plott gir estimater av Vmax og Km bare for allosteriske enzymer
      - Alle enzymkatalyserte reaksjoner gir et ikke-lineær Lineweaver-Burk-plott
      - Et Lineweaver-Burk-plott for et klassisk ikke-allosterisk enzym kan gi estimater av Vmax og Km ved lineær ekstrapolering
      - Et Lineweaver-Burk-plott for et klassisk ikke-allosterisk enzym er en rett linje
      - Lineweaver-Burk-plott henviser ikke til enzymkatalyserte reaksjoner
    answer: [2, 3]
    explanation: |
      Lineweaver–Burk er den doble resiproke av Michaelis–Menten: $\frac{1}{v_0} = \frac{K_M}{V_\text{max}}\cdot\frac{1}{[S]} + \frac{1}{V_\text{max}}$. For et Michaelis–Menten-enzym gir det en rett linje med y-skjæring $1/V_\text{max}$ og x-skjæring $-1/K_M$. Allosteriske enzymer følger ikke MM-kinetikk og gir kurvet plott.
