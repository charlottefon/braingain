  # ---------------- Ulikhet i helse ----------------
  - n: 21
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: text
    points: 7
    stem: |
      Norske studier har vist at sosial ulikhet har betydning for 5 års overlevelse av enkelte kreftformer. Hva kan være mulige forklaringer på dette?

      (Normert tid: 17 minutter.)
    model: |
      Forklaringene kan ordnes etter de klassiske forklaringsmodellene for sosial ulikhet i helse:

      - **Helsetjenesten / sen diagnose:** Personer med lav sosioøkonomisk status (SES) oppsøker lege senere, deltar sjeldnere i screening (mammografi, livmorhalsprøve, tarmscreening) og får derfor oftere diagnosen i et senere stadium med dårligere prognose. Lavere helsekompetanse gjør at symptomer tolkes eller formidles annerledes.
      - **Ulik behandling og oppfølging:** Ressurssterke pasienter krever og får oftere rask utredning, henvisning, second opinion og private tilbud; lange reiseavstander og økonomiske/praktiske hindringer (tapt arbeidsinntekt, barnepass) kan gi dårligere etterlevelse av behandling og kontroller.
      - **Atferd/livsstil og komorbiditet:** Røyking, overvekt, alkohol og fysisk inaktivitet er hyppigere ved lav SES. Det gir mer tilleggssykdom (hjerte-kar, KOLS, diabetes), som tåler behandling dårligere og øker dødeligheten – og flere røykerelaterte kreftformer med dårlig prognose.
      - **Materielle forhold:** Dårligere økonomi, bolig og arbeid (fysisk krevende jobber) gjør rehabilitering og tilbakeføring vanskeligere.
      - **Psykososiale forhold:** Mindre sosial støtte, mer stress og mindre opplevd kontroll kan påvirke både mestring, etterlevelse og (via de adaptive systemene) kroppens motstandskraft.
      - **Seleksjon (omvendt kausalitet):** Sykdom kan i seg selv føre til lavere inntekt/jobbtap, slik at syke havner i lavere sosiale lag.

      En god besvarelse viser at ulikheten oppstår *både* før diagnosen (risiko, stadium) og etter (behandling, oppfølging), og nevner at også helsetjenesten selv kan bidra til ulikhet.
    modelSource: Egenlaget løsningsforslag
  # ---------------- Celle 1: generell kjemi ----------------
  - n: 22
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/likevektskonstant-fra-konsentrasjoner]
    type: single
    points: 2
    stem: |
      For reaksjonen: A + 2 B ⇌ 2 C + D ved likevekt, kan vi måle konsentrasjonene av alle reaktanter:

      [A] = 0,02 M
      [B] = 0,001 M
      [C] = 0,1 M
      [D] = 0,05 M

      Hva er $K_c$?
    options: ["250", '$4 \times 10^{-3}$', "25000", '$4 \times 10^{-5}$']
    answer: [2]
    explanation: |
      $K_c = \frac{[C]^2[D]}{[A][B]^2} = \frac{0{,}1^2 \cdot 0{,}05}{0{,}02 \cdot 0{,}001^2} = \frac{5 \times 10^{-4}}{2 \times 10^{-8}} = 2{,}5 \times 10^{4} = 25\,000$. Koeffisientene blir eksponenter.
  - n: 23
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-svak-base-og-salt, generell-kjemi/teori/syre-base-likevekter]
    type: single
    points: 1
    stem: For en svak syre, $K_a = 1{,}0 \times 10^{-5}$. Hva er $pK_b$ for dens konjugerte base?
    options: ["5", '$1{,}0 \times 10^{-14}$', "9", '$1{,}0 \times 10^{-9}$']
    answer: [2]
    explanation: |
      $pK_a = -\log(1{,}0 \times 10^{-5}) = 5$, og for et konjugert par er $pK_a + pK_b = 14$, så $pK_b = 9$. ($1{,}0 \times 10^{-9}$ er $K_b$, ikke $pK_b$.)
  - n: 24
    subject: generell-kjemi
    topics: [generell-kjemi/teori/termodynamikk, generell-kjemi/regnetyper/gibbs-fri-energi]
    type: fill
    points: 3
    stem: Velg riktig alternativ for hvert spørsmål.
    parts:
      - {prompt: "Ved endringen av fase: $\\ce{CO2(g)}$ endres til $\\ce{CO2(s)}$, vil entropien i systemet … (minke / umulig å si / forbli den samme / øke)", answer: minke}
      - {prompt: "Når $\\Delta H < 0$ og $\\Delta S > 0$, er følgende sant: ($\\Delta G = 0$ / $\\Delta G < 0$ / $\\Delta G > 0$ / umulig å si)", answer: "$\\Delta G < 0$"}
      - {prompt: "For en eksoterm reaksjon er følgende alltid oppfylt: ($\\Delta H < 0$ / $\\Delta S < 0$ / $\\Delta G < 0$ / $\\Delta G < \\Delta H$)", answer: "$\\Delta H < 0$"}
    explanation: |
      Gass → fast stoff gir mye mer orden, så $\Delta S < 0$. Med $\Delta H < 0$ og $\Delta S > 0$ blir $\Delta G = \Delta H - T\Delta S$ negativ ved alle temperaturer. «Eksoterm» betyr per definisjon at varme avgis, $\Delta H < 0$ – fortegnet til $\Delta S$ og $\Delta G$ kan variere.
  - n: 25
    subject: generell-kjemi
    topics: [generell-kjemi/teori/kjemisk-likevekt]
    type: single
    points: 1
    stem: |
      Hva er likevektsuttrykket for reaksjonen:

      $\ce{2CCl4(g) + O2(g) <=> 2COCl2(g) + 2Cl2(g)}$
    options:
      - '$K = \dfrac{[\ce{COCl2}]^2[\ce{Cl2}]^2}{[\ce{CCl4}]^2[\ce{O2}]}$'
      - '$K = \dfrac{[\ce{COCl2}]^2[\ce{Cl2}]^2}{2[\ce{CCl4}][\ce{O2}]}$'
      - '$K = \dfrac{2[\ce{COCl2}]2[\ce{Cl2}]}{2[\ce{CCl4}][\ce{O2}]}$'
      - '$K = \dfrac{[\ce{COCl2}][\ce{Cl2}]}{[\ce{CCl4}][\ce{O2}]}$'
    answer: [0]
    explanation: Produkter over brøkstreken, reaktanter under, og hver konsentrasjon opphøyes i sin støkiometriske koeffisient (koeffisientene er eksponenter, ikke faktorer).
  - n: 26
    subject: generell-kjemi
    topics: [generell-kjemi/teori/kjemisk-likevekt]
    type: single
    points: 1
    stem: |
      Likevektsuttrykket for en gasslikevekt er som følger:

      $$K = \frac{[\ce{O2}]^5[\ce{NH3}]^4}{[\ce{NO}]^4[\ce{H2O}]^6}$$

      Hva er reaksjonslikningen for denne likevekten?
    options:
      - '$\ce{8NH3(g) + 10O2(g) <=> 8NO(g) + 12H2O(g)}$'
      - '$\ce{2NO(g) + 3H2O(g) <=> 2NH3(g) + 5/2O2(g)}$'
      - '$\ce{4NO(g) + 6H2O(g) <=> 5O2 + 4NH3(g)}$'
      - '$\ce{4NH3(g) + 5O2(g) <=> 4NO(g) + 6H2O(g)}$'
    answer: [2]
    explanation: $\ce{O2}$ og $\ce{NH3}$ står i telleren (produkter) med eksponentene 5 og 4; NO og $\ce{H2O}$ i nevneren (reaktanter) med eksponentene 4 og 6. Alternativ 4 er den omvendte reaksjonen (gir $1/K$), og alternativ 1 og 2 har andre koeffisienter (gir $K^{-2}$ og $K^{1/2}$).
  - n: 27
    subject: generell-kjemi
