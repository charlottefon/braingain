title: MEDOD1 vår 2016
year: 2016
term: vår
source: medod1/exams/2016-medod1-ny-v2016-med-svar--455763.pdf
note: MEDOD1 (ny), vår 2016. Oppgave 4–15 (Den akutt syke pasient) er utelatt. Oppgave 1–3 er fra det tidligere «Introduksjonskurset» og er tatt med under samfunnsmedisin. Delspørsmål med egne nedtrekks-/flervalgsmenyer (16–20, 24, 28, 30, 63) er gjengitt som utfyllingsoppgaver. Sensorveiledningen som følger settet gjelder en annen oppgave (etisk 7-trinnsanalyse), så langsvar 21 og 60 har egenlagde løsningsforslag.
questions:
  # ---------------- Introduksjonskurs (samfunnsmedisin) ----------------
  - n: 1
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: multi
    points: 6
    stem: |
      29 år gamle Kristin Moe kommer på legevakten en kveld oppunder jul. Hun har vært forkjølt lenge, nå føler hun seg helt elendig, har høy feber, hoster og blir tungpusten av å gå opp en trapp. Legen får vite at hun nettopp har mistet jobben, hun er alenemor til to barn. Hun gruer seg til å være med foreldrene i julen fordi far pleier å drikke for mye på den tiden. Legen tar en blodprøve og lytter på Kristins lunger og finner at hun har lungebetennelse.

      Hvilke av følgende utsagn er sanne?
    options:
      - Å ha stort omsorgsansvar kan svekke immunforsvaret
      - Følelser påvirker immunforsvaret
      - Skam kan svekke immunforsvaret
      - Å miste jobben kan svekke immunforsvaret
      - Ensomhet kan svekke immunforsvaret
      - Redusert immunforsvar kan føre til alvorlige infeksjoner
    answer: [0, 1, 2, 3, 4, 5]
    explanation: Alle utsagnene er sanne. Langvarig psykososialt stress (omsorgsbelastning, jobbtap, skam, ensomhet) virker via de adaptive systemene – nervesystemet, hormonsystemet (bl.a. kortisol) og immunsystemet – og kan svekke immunforsvaret slik at man lettere får alvorlige infeksjoner.
  - n: 2
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker, samfunnsmedisin/kortsvar/ovelse-livslopsperspektivet]
    type: multi
    points: 6
    stem: Hvilke av følgende påstander er sanne?
    options:
      - Mange kroniske sykdommer skyldes at mennesket er genetisk tilpasset et steinalderliv
      - Når leger møter syke mennesker med omsorg kan de skape styrkende endringer i kroppens fysiologi
      - Man kan skille klart mellom fysisk sykdom og sykdom som skyldes psykiske og sosiale faktorer
      - Kreftsykdom er et utslag av organenes evne til å reparere seg selv gjennom ny celledeling
      - Følelser, immunsystem og hormoner (det endokrine systemet) har ingen innvirkning på hverandre
      - Bakterier er generelt farlige for mennesker
      - «Stress» og andre følelsestilstander er fysiologiske endringer som påvirker organ- og cellefunksjon
      - Røyking og høyt kolesterol er farligere hvis man står lavt på den sosiale rangstigen
      - Negative barndomsopplevelser (vold, kriminalitet, trusler, overgrep) gir ikke målbare utslag i helsetilstanden resten av livet
      - I moderne velferdssamfunn lever folk omtrent like lenge uansett hvilken sosioøkonomisk klasse de tilhører
      - Det er som oftest lett å avgjøre om en sykdom er genetisk eller miljøbetinget
      - Når en ektefelle dør viser statistikk at dødeligheten hos gjenlevende ektefelle er mangedoblet det første året
    answer: [0, 1, 3, 6, 7, 11]
    explanation: |
      Kropp, psyke og sosiale forhold henger sammen: følelser og stress er fysiologiske tilstander som virker via nerve-, hormon- og immunsystemet, og samme risikofaktor (røyking, kolesterol) gir større skade lavt på den sosiale rangstigen. Negative barndomsopplevelser gir målbare helseutslag gjennom hele livet (livsløpsperspektivet), og det er en tydelig sosial gradient i levealder også i velferdsstater. Utsagnet om kreft (vevets reparasjonsevne via celledeling er også det som kan løpe løpsk) er et poeng fra det gamle introduksjonskurset.
  - n: 3
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/velferdsstat-og-helsetjeneste, samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: multi
    points: 3
    stem: Hvilke av følgende påstander er sanne?
    options:
      - Selvmordshyppigheten blant kvinner er ca. tre ganger så høy som blant menn
      - Risikoen for å oppleve en psykisk lidelse i løpet av livet er omkring 35–40 prosent
      - For at en sykdom skal kalles kronisk må den vare mer enn 24 måneder
      - "Norge har tre nivåer av legetjenester: fastleger (primærhelsetjenesten), private spesialister (sekundærhelsetjenesten) og sykehus (tertiærhelsetjenesten)"
      - Omtrent halvparten av alle offentlig ansatte i Norge jobber i medisinsk virksomhet
      - Muskel- og skjelettlidelser utgjør det mest utbredte og kostnadskrevende helseproblemet i Norge
    answer: [1, 4, 5]
    explanation: Selvmord er omtrent 2–3 ganger hyppigere blant *menn* enn kvinner. «Kronisk» brukes vanligvis om sykdom som varer mer enn ca. 3–6 måneder, ikke 24. Norge har to forvaltningsnivåer i helsetjenesten – kommunal primærhelsetjeneste og statlig spesialisthelsetjeneste (både sykehus og avtalespesialister) – ikke tre slik det beskrives. Tallene er fra det tidligere introduksjonskurset (2016).
  # ---------------- Nomenklatur ----------------
  - n: 16
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/introduksjon-og-grunnbegreper, nomenklatur/grammatikk/endelsesoversikt, nomenklatur/grammatikk/fjerde-og-femte-deklinasjon]
    type: fill
    points: 5
    stem: Velg riktig alternativ for hvert spørsmål.
    parts:
      - {prompt: "Hva betegner kasus? (Funksjon / Bøyningsmåte / Ordstilling)", answer: Funksjon}
      - {prompt: "Hvor mange deklinasjoner er det på latin? (3 / 5 / 4)", answer: "5"}
      - {prompt: "Etter hvilke deklinasjoner bøyes kjønnsfleksible ord? (Alle / 1+2 og 3 / 3 og 4)", answer: 1+2 og 3}
      - {prompt: "Hvilken preposisjon styrer ablativ? (Ante / Post / Cum)", answer: Cum}
      - {prompt: "Hvilket kjønn har alle substantivene i 5. deklinasjon? (Hankjønn / Hunkjønn / Intetkjønn)", answer: Hankjønn}
    explanation: |
      Kasus angir ordets funksjon i setningen/uttrykket. Latin har 5 deklinasjoner. Kjønnsfleksible ord (adjektiv, partisipp) bøyes etter 1.+2. eller 3. deklinasjon. *Cum* (med) styrer ablativ, mens *ante* og *post* styrer akkusativ. **Merk:** Fasiten oppgir «Hankjønn» for 5. deklinasjon, men det er feil – substantivene i 5. deklinasjon (*caries, facies, res, rabies*) er **hunkjønn** (bare *dies* kan være hankjønn).
