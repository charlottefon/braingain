    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-sterk-syre-og-base]
    type: single
    points: 1
    stem: Konsentrert saltsyre inneholder 12 M HCl i en vannløsning. Hva er pH i saltsyren?
    options: ["−1,1", "1,1", "12", "0"]
    answer: [0]
    explanation: |
      HCl er en sterk syre og protolyseres fullstendig: $[\ce{H3O+}] = 12$ M, så $\text{pH} = -\log 12 = -1{,}08 \approx -1{,}1$. pH kan bli negativ når $[\ce{H3O+}] > 1$ M.
  - n: 30
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-og-h3o-omregning, generell-kjemi/regnetyper/henderson-hasselbalch]
    type: fill
    points: 2
    stem: Velg riktig alternativ for hvert spørsmål.
    parts:
      - {prompt: "I en vannløsning, når $[\\ce{OH-}]$ øker, vil $[\\ce{H3O+}]$ … (øke / være umulig å forutsi / minke / forbli den samme)", answer: minke}
      - {prompt: "For en svak syre, HA, har vi likevekt der $[\\ce{A-}] = [\\ce{HA}]/10$. Hva er pH? (10 / $pK_a$ / $pK_b$ / $pK_a - 1$ / $pK_a + 1$)", answer: "$pK_a - 1$"}
    explanation: |
      $[\ce{H3O+}][\ce{OH-}] = K_w$ er konstant, så når $[\ce{OH-}]$ øker, må $[\ce{H3O+}]$ minke. Henderson–Hasselbalch: $\text{pH} = pK_a + \log\frac{[\ce{A-}]}{[\ce{HA}]} = pK_a + \log\frac{1}{10} = pK_a - 1$.
