      - Kan ikke skje in vitro
      - Forandrer proteinets primære struktur
      - Kan forårsakes av mutasjoner
    answer: [3]
    explanation: Mutasjoner kan destabilisere folden eller eksponere hydrofobe flater og føre til aggregering, som ved sigdcelleanemi (HbS) og amyloidsykdommer. Aggregering skjer også in vitro og endrer ikke aminosyresekvensen.
  - n: "5.77"
