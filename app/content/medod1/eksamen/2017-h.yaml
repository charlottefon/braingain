    options: ["...samme osmolaritet", "...samme elektrolyttkonsentrasjon", "...samme pH", "...samme p(CO2)"]
    answer: [0]
    explanation: Isotonisk betyr samme osmotiske trykk, altså samme totale konsentrasjon av osmotisk aktive partikler. Det gir ingen netto vannbevegelse over en semipermeabel membran.
  - n: "5.27"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/protolyttfordeling, proteiner/aminosyrer/histidin]
    type: single
    points: 1
    stem: |
      Et enzym i nervesystemet har to histidinsidekjeder ($pK_a = 6$) på det aktive setet.
      Enzymet kan bare katalysere en reaksjon hvis en av disse er protonert og den andre uprotonert.
      Hva vil mest sannsynlig være den optimale pH for den enzymkatalyserte reaksjonen?
    options: [pH = 7, pH = 2, pH = 8, pH = 6]
    answer: [3]
    explanation: Andelen enzym med én protonert og én uprotonert His er $2f(1-f)$, der $f$ er andelen protonert. Uttrykket er størst når $f = 0{,}5$, altså når pH = pKa = 6.
  - n: "5.28"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/titrering-aminosyre, generell-kjemi/regnetyper/henderson-hasselbalch]
    type: single
    points: 1
    stem: |
      Vi har 50,0 ml med 0,1 M protonert alanin ($\ce{H2A+}$). Vi titrerer med 0,1 M NaOH.

      $K_{a1} = 4{,}6 \times 10^{-3}$
      $K_{a2} = 2{,}0 \times 10^{-10}$

      Beregn pH etter tilsetting av 70 ml NaOH.
    options: ["9,88", "2,16", "9,52", "2,71"]
    answer: [2]
    explanation: |
      $n(\ce{H2A+}) = 5{,}0$ mmol og $n(\ce{OH-}) = 7{,}0$ mmol. De første 5,0 mmol omdanner alt $\ce{H2A+}$ til HA. De resterende 2,0 mmol omdanner HA til $\ce{A-}$, og vi får 3,0 mmol HA og 2,0 mmol $\ce{A-}$.

      $pK_{a2} = -\log(2{,}0 \times 10^{-10}) = 9{,}70$

      $pH = 9{,}70 + \log\dfrac{2{,}0}{3{,}0} = 9{,}70 - 0{,}18 = 9{,}52$
  - n: "5.29"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/intermolekylaere-krefter]
    type: single
    points: 1
    stem: Hvilken av disse er *ikke* en intermolekylær kraft?
    options: [Dispersjonskraft, En hydrogenbinding, En kovalent binding, Dipol-dipolkraft]
    answer: [2]
    explanation: En kovalent binding er en *intra*molekylær binding (delte elektronpar) som holder atomene sammen i molekylet. De andre virker mellom molekyler.
  - n: "5.30"
    subject: generell-kjemi
