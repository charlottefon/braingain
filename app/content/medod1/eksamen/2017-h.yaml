      - Alle utsagnene er riktige
    answer: [3]
    explanation: Resonans mellom C=O og nitrogenets frie elektronpar gir C–N-bindingen ca. 40 % dobbeltbindingskarakter. Peptidgruppen (O, C, N, H) blir dermed plan og stiv uten fri rotasjon, nesten alltid i trans-konfigurasjon. Rotasjonen skjer om φ og ψ (bindingene til Cα).
  - n: "5.67"
    subject: proteiner
