    options: [Fri diffusjon, Reseptor-mediert endocytose, Nedbryting av liposomer, Aterosklerose]
    answer: [1]
    explanation: LDL-partikler bindes til LDL-reseptorer i klatrinkledde groper, tas inn ved reseptormediert endocytose og brytes ned i lysosomer, som frigjør kolesterolet.
  - n: "5.5"
