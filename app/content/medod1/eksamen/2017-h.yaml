    options: [Hydrogenperoksid, Vanlig oksygen, Superoksid, Hydroksylradikalet]
    answer: [0]
    explanation: Et radikal har ett eller flere uparede elektroner. $\ce{H2O2}$ har bare parede elektroner. Den er en reaktiv oksygenforbindelse, men ikke et radikal. $\ce{O2}$ er et biradikal (to uparede elektroner), og superoksid ($\ce{O2^{.-}}$) og hydroksylradikalet ($\ce{.OH}$) har ett hver.

  # ---------------- Del 5: syre–base i blod ----------------
  - n: "5.40"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: |
      En 60 år gammel kvinne var i syden og pådro seg tarminfeksjon. Da hun kom hjem var hun slapp og i dårlig allmenntilstand, og hun ble derfor innlagt på sykehus. Syre/base-status ved ankomst viste følgende verdier: pH = 7,13, $p\ce{CO2}$ = 2,3 kPa.
      Anslå verdien for BE («Base Excess»). (Bruk Siggaard-Andersen-diagrammet.)
    figure: Siggaard-Andersen acid-base chart (vedlegg til eksamen).
    options: [Ca. -5 mmol/L, Ca. -22 mmol/L, Ca. +2 mmol/L, Ca. +15 mmol/L]
    answer: [1]
    explanation: |
      Både pH og $p\ce{CO2}$ er lave, så det er en metabolsk acidose. Med Henderson–Hasselbalch:

      $[\ce{HCO3-}] = 0{,}23 \times p\ce{CO2} \times 10^{pH - 6{,}1} = 0{,}23 \times 2{,}3 \times 10^{1{,}03} \approx 5{,}7$ mmol/L

      Normalverdien er ca. 24 mmol/L, så det er et stort baseunderskudd. Punktet i diagrammet ligger ved BE ≈ −22 mmol/L.
  - n: "5.41"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: |
      Fortsettelse av oppgave 5.40 (pH = 7,13, $p\ce{CO2}$ = 2,3 kPa).
      Hva slags syre/base-forstyrrelse forelå?
    options:
      - Respiratorisk alkalose med metabolsk kompensasjon
      - Respiratorisk acidose med metabolsk kompensasjon
      - Respiratorisk alkalose uten kompensasjon
      - Metabolsk acidose med respiratorisk kompensasjon
    answer: [3]
    explanation: Lav pH betyr acidose. Lavt $p\ce{CO2}$ kan ikke forklare acidosen, så den er metabolsk (lav $\ce{HCO3-}$, negativ BE). Pasienten hyperventilerer for å blåse av $\ce{CO2}$ og løfte pH. Det er respiratorisk kompensasjon.
  - n: "5.42"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: |
      Fortsettelse av forrige oppgave (5.40).
      Hva kan årsaken være til syre/base-forstyrrelsen?
    options: [KOLS (dårlig lungefunksjon), Langvarig diaré, Akutt hyperventilering, Langvarige brekninger]
    answer: [1]
    explanation: Tarmsekret er rikt på bikarbonat, så langvarig diaré gir tap av $\ce{HCO3-}$ og metabolsk acidose. Brekninger gir tap av HCl (metabolsk alkalose), KOLS gir respiratorisk acidose og hyperventilering respiratorisk alkalose.
  - n: "5.43"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: En 72 år gammel mann med kronisk obstruktiv lungesykdom («KOLS») ble innlagt på grunn av tiltagende kortpustethet. Røntgen av lungene viste venstresidig lungebetennelse. Syre/base-status ved innkomst i sykehuset var pH 7,29, $p\ce{CO2}$ 9,0 kPa. Hva slags syre/base-forstyrrelse forelå?
    options:
      - Respiratorisk acidose med metabolsk kompensasjon
      - Respiratorisk alkalose uten kompensasjon
      - Metabolsk alkalose med respiratorisk kompensasjon
      - Både metabolsk og respiratorisk acidose
    answer: [0]
    explanation: |
      Lav pH og høyt $p\ce{CO2}$ betyr respiratorisk acidose.

      $[\ce{HCO3-}] = 0{,}23 \times 9{,}0 \times 10^{7{,}29 - 6{,}1} \approx 2{,}07 \times 15{,}5 \approx 32$ mmol/L

      Det er forhøyet (positiv BE), altså metabolsk kompensasjon. Ved kronisk hyperkapni (KOLS) holder nyrene tilbake bikarbonat.
  - n: "5.44"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: "Fortsettelse fra spørsmål 5.43. Pasienten ble behandlet med antibiotika og oksygentilførsel. Etter noen timer var syre/base-status: pH 7,24, $p\\ce{CO2}$ 11,0 kPa. Hvordan vurderer du utviklingen av pasientens tilstand?"
    options:
      - Pasientens respirasjonssvikt er forverret, men metabolsk kompensasjon er uendret.
      - Pasienten har i tillegg fått en metabolsk acidose.
      - Pasienten er begynt å hyperventilere.
      - Pasienten er bedre pga. oksygentilførsel.
    answer: [0]
    explanation: $p\ce{CO2}$ har steget (9 → 11 kPa) og pH falt. Hypoventilasjonen er altså verre, og hos KOLS-pasienter kan oksygentilførsel i seg selv forverre hyperkapnien. Punktet flytter seg langs samme BE-linje i diagrammet, så den metabolske komponenten er uendret.
  - n: "5.45"
    subject: cellebiologi
    topics: [cellebiologi/sammensatte-tema/blodets-ph-regulering-og-hyperventilering, generell-kjemi/teori/karbonsyre-og-blodets-ph, cellebiologi/sammensatte-tema/syre-base-forstyrrelser-og-blodgass]
    type: single
    points: 1
    stem: Fortsettelse fra forrige spørsmål (5.44). Pasienten ble vurdert for respiratorbehandling. Hvis $p\ce{CO2}$ ved hjelp av respirator normaliseres til ca. 5,3 kPa i løpet av kort tid, hva slags syre/base-forstyrrelse (om noen) foreligger da?
    options: [Respiratorisk alkalose, Metabolsk alkalose, Metabolsk acidose, Respiratorisk acidose]
    answer: [1]
    explanation: Den renale kompensasjonen (forhøyet $\ce{HCO3-}$, positiv BE) forsvinner ikke på timer. Når $p\ce{CO2}$ raskt blir normalt, står det forhøyede bikarbonatet igjen alene, og pasienten får en metabolsk alkalose (posthyperkapnisk).

