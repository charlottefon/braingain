    topics: [organisk-kjemi/biomolekyler/monosakkarider, lab/ovelser/karbohydrater]
    type: single
    points: 1
    stem: |
      Hvilket av alternativene nedenfor er riktig?

      Fischer-projeksjon av sukkeret på bildet (ovenfra og ned):

      | | | |
      |---|:---:|---|
      | | CHO | |
      | H | C | OH |
      | HO | C | H |
      | H | C | OH |
      | | CH₂OH | |
    options:
      - Sukrose gir positivt utslag på både Benedicts og Barfoeds test
      - Sukrose er et reduserende disakkarid
      - Sukkeret på bildet foreligger på D-form
      - Maltose er et monosakkarid
    answer: [2]
    explanation: OH på det nederste kirale karbonet (C4) står til høyre, så sukkeret er på D-form (D-xylose). Sukrose er ikke-reduserende og gir negativ Benedict og Barfoed, og maltose er et disakkarid.
  - n: "5.60"
    subject: organisk-kjemi
    topics: [organisk-kjemi/grunnlag/enantiomerer-diastereomerer-meso, organisk-kjemi/grunnlag/kiralitet-og-r-s]
    type: single
    points: 1
    stem: |
      Hvor mange stereoisomerer er mulig for følgende molekyl?

      $\ce{CH3-CH(OH)-CH(Br)-CH2-CH(CH3)-CH2CH3}$

      ```smiles
      CC(O)C(Br)CC(C)CC
      ```
    options: ["2", "6", "4", "8"]
    answer: [3]
    explanation: Molekylet har tre kirale sentre, C2 (OH), C3 (Br) og C5 (CH₃). Det er ingen symmetri som gir meso-former, så antallet er $2^3 = 8$.
  - n: "5.61"
    subject: organisk-kjemi
    topics: [organisk-kjemi/navnsetting/alkener-og-alkyner]
    type: single
    points: 1
    stem: |
      Hva er IUPAC-navnet på forbindelsen på bildet?

      $\ce{CH3C#CCH2CH2CH(CH3)CH3}$

      ```smiles
      CC#CCCC(C)C
      ```
    options: [2-Metyl-6-hepten, 6-Metyl-2-heptyn, 6-Metyl-2-heptan, 6-Metyl-2-hepten]
    answer: [1]
    explanation: Kjeden har syv karboner med trippelbinding (-yn). Trippelbindingen skal få lavest nummer (C2), og da sitter metylgruppen på C6. Navnet blir 6-metyl-2-heptyn (6-metylhept-2-yn).
  - n: "5.62"
    subject: organisk-kjemi
    topics: [organisk-kjemi/navnsetting/alkener-og-alkyner]
    type: single
    points: 1
    stem: |
      Hva er IUPAC-navnet på forbindelsen på bildet?

      $\ce{H2C=C(CH3)CH=CH2}$

      ```smiles
      C=C(C)C=C
      ```
    options: ["2-Metyl-1,1-dibutadien", "2-Metyl-1,3-butyl", "2-Metyl-1,3-butadien", "2-Metyl-1,1-dibuten"]
    answer: [2]
    explanation: Fire karboner med to dobbeltbindinger (C1=C2 og C3=C4) gir 1,3-butadien. Med metyl på C2 blir navnet 2-metyl-1,3-butadien (isopren).
  - n: "5.63"
    subject: organisk-kjemi
    topics: [organisk-kjemi/reaksjoner/hydrohalogenering]
    type: single
    points: 1
    stem: 2-Metylpropen reagerer med hydrogenbromid og danner et av de følgende alternativene. Hvilket?
    options:
      - 50% 1-Bromo-2-metylpropan og 50 % 2-Bromo-2-metylpropan
      - 80% 1-Bromo-2-metylpropan og 20 % 2-Bromo-2-metylpropan
      - 2-Bromo-2-metylpropan
      - 1-Bromo-2-metylpropan
    answer: [2]
    explanation: Markovnikovs regel sier at H går til karbonet med flest H (C1). Da dannes det stabile tertiære karbokationet på C2, og Br havner der. Produktet er 2-bromo-2-metylpropan (tert-butylbromid).
  - n: "5.64"
    subject: organisk-kjemi
