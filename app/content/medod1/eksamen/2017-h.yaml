    answer: [1]
    explanation: Ved pH < pI er proteinet netto protonert og positivt ladet. MBP er rikt på Lys og Arg, og den positive ladningen binder det til de negativt ladde fosfolipidene i myelinmembranen.
  - n: "5.31"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/termodynamikk]
    type: single
    points: 1
