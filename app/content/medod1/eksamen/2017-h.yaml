title: MEDOD1 høst 2017
year: 2017
term: høst
source: medod1/exams/2017-medod1-h2017-med-svar--705807.pdf
note: Semestereksamen, bare flervalg (1 poeng per oppgave). Del 2 (akuttmedisin) og oppgave 1.2–1.5 (innføring i fysiologi/medisinsk historie) er utelatt. Til celledelen fulgte periodesystemet, Siggaard-Andersen-diagrammet og aminosyrenes strukturer som vedlegg.
questions:
  # ---------------- Del 1 ----------------
  - n: "1.1"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/velferdsstat-og-helsetjeneste]
    type: single
    points: 1
    stem: Hvilken pasientgruppe er den offentlige tannhelsetjenesten *ikke* pliktig til å prioritere?
    options:
      - Barn inntil 18 år
      - Ungdom som fyller 19-20 år i behandlingsåret
      - Psykisk utviklingshemmede på institusjon
      - Voksne betalende pasienter
    answer: [3]
    explanation: Tannhelsetjenesteloven pålegger fylkeskommunen å gi et regelmessig og oppsøkende tilbud til prioriterte grupper. Det gjelder barn og ungdom (0–18 år og 19–20 år), psykisk utviklingshemmede og eldre, langtidssyke og uføre i institusjon eller hjemmesykepleie. Voksne betalende kan få behandling, men er ikke en prioritert gruppe.

  # ---------------- Del 3: Medisinsk nomenklatur ----------------
  - n: "3.1"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/introduksjon-og-grunnbegreper, nomenklatur/grammatikk/adnominal-genitiv]
    type: single
    points: 1
    stem: Hvilken kasus uttrykker eieform?
    options: [Akkusativ, Genitiv, Nominativ, Ablativ]
    answer: [1]
    explanation: Genitiv svarer på «hvem/hva sin?», for eksempel *fractura femoris* = lårbeinets brudd.
  - n: "3.2"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/introduksjon-og-grunnbegreper, nomenklatur/grammatikk/ordstilling-og-uttrykk]
    type: single
    points: 1
    stem: Hvilken kasus styrer preposisjonene *post* og *ante*?
    options: [Akkusativ, Nominativ, Ablativ, Genitiv]
    answer: [0]
    explanation: '*post* (etter) og *ante* (før) styrer akkusativ, f.eks. *status post commotionem cerebri*. Preposisjoner som *cum*, *sine*, *in* (= i/på) og *de* styrer ablativ.'
  - n: "3.3"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adjektiv-1-2-og-perfektum-partisipp, nomenklatur/grammatikk/introduksjon-og-grunnbegreper]
    type: single
    points: 1
    stem: Hva kalles adjektiver og partisipper med et fellesnavn?
    options: [Deklinasjoner, Preposisjoner, Attributter, Nominalia]
    answer: [2]
    explanation: Adjektiver og partisipper står som *attributter* til et substantiv og samsvarer med det i kjønn, tall og kasus. «Nominalia» er en videre samlebetegnelse som også omfatter substantivene.
  - n: "3.4"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/tredje-deklinasjon-m-f, nomenklatur/grammatikk/tredje-deklinasjon-n]
    type: single
    points: 1
    stem: Hvilke(t) kjønn finnes i 3. deklinasjon?
    options: [Alle de nevnte, Hunkjønn, Intetkjønn, Hankjønn]
    answer: [0]
    explanation: 3. deklinasjon har ord av alle tre kjønn, f.eks. *dolor* (m.), *regio* (f.) og *corpus* (n.).
  - n: "3.5"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/ordstilling-og-uttrykk]
    type: single
    points: 1
    stem: Hva skal et latinskspråklig, medisinsk uttrykk starte med?
    options:
      - Et substantiv i valgfri kasus
      - Et substantiv i nominativ
      - Et substantiv i enten nominativ eller genitiv
      - Et substantiv i genitiv
    answer: [1]
    explanation: Hovedordet står først og i nominativ. Deretter kommer attributter og genitivsledd, f.eks. *fractura colli femoris*.
  - n: "3.6"
    subject: nomenklatur
    topics: [nomenklatur/grammatikk/adjektiv-3-deklinasjon-og-presens-partisipp]
    type: single
    points: 1
    stem: Hvilket av følgende alternativ er et eksempel på presens partisipp?
    options: [Perforatoribus, Perforator, Perforatus, Perforans]
    answer: [3]
    explanation: Presens partisipp ender på *-ans/-ens* (gen. *-antis/-entis*) og betyr «-ende», f.eks. *ulcus perforans* = gjennomborende sår. *Perforatus* er perfektum partisipp («gjennomboret»).
