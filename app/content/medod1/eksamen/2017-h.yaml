    answer: [2]
    explanation: Trypsin kløyver på karboksylsiden av Lys og Arg. Ala-Glu-Arg | Gly-Asp gir et tripeptid og et dipeptid.
  - n: "5.68"
    subject: proteiner
    topics: [proteiner/teori/proteinstruktur, proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: Et allosterisk dimerisk enzym påvirkes av et medikament som dissosierer enzymets subenheter uten å påvirke aktiviteten til de adskilte subenhetene. Hvilket strukturnivå er mest påvirket av dette medikamentet?
    options: [Kvarternær struktur, Primær struktur, Primær og tertiær struktur, Primær og sekundær struktur]
    answer: [0]
    explanation: Kvartærstrukturen er sammensetningen av flere polypeptidkjeder (subenheter). Når subenhetene skilles, er bare kvartærstrukturen berørt. De enkelte subenhetene er fortsatt aktive, så tertiærstrukturen er intakt.
  - n: "5.69"
    subject: proteiner
