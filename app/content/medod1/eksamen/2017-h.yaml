    explanation: Lipoproteinene kan frakte kolesterol fordi overflaten er *hydrofil* (fosfolipidhoder, apoproteiner, fritt kolesterol). Den hydrofobe lasten (kolesterolestere, triglyserider) ligger inni.
  - n: "5.8"
