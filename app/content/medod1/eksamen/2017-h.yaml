    options: [Kloroplast, Gjærcelle, Bakteriofag, Mitokondria]
    answer: [2]
    explanation: Bakteriofager (virus) er ca. 20–200 nm, under lysmikroskopets oppløsningsgrense (~0,2 µm). Gjærceller, kloroplaster og mitokondrier (ca. 0,5–10 µm) kan ses i lysmikroskop.
  - n: "5.4"
    subject: cellebiologi
