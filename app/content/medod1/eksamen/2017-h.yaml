    type: single
    points: 1
    stem: Hvilket av de følgende utsagnene er korrekt for enhver (S)-enantiomer?
    options:
      - Den roterer plan-polarisert lys til høyre
      - Den roterer plan-polarisert lys til venstre
      - Den er speilbilde av den korresponderende (R)-enantiomeren
      - Den er en rasemisk form
    answer: [2]
    explanation: R/S er en geometrisk konvensjon (CIP) og sier ingenting om dreieretningen (+/−), som må måles. (S) og (R) er per definisjon speilbilder. En racemisk blanding inneholder begge i like mengder.
  - n: "5.65"
    subject: organisk-kjemi
    topics: [organisk-kjemi/grunnlag/kiralitet-og-r-s, organisk-kjemi/grunnlag/enantiomerer-diastereomerer-meso]
    type: single
    points: 1
    stem: |
      Hvilken av de tre alternativene er enantiomer til strukturforbindelsen i firkanten på bildet?

      Alle fire strukturene er kilformler av et karbon med to H, én Br og én CH₃ ($\ce{CH3CH2Br}$), tegnet i ulike orienteringer (I, II og III).
    figure: "Firkant: C med H opp, H (stiplet kile) og Br (fylt kile) ned til venstre, CH₃ ned til høyre. I, II og III viser det samme settet substituenter (H, H, Br, CH₃) rotert/vendt på ulike måter."
    options: [II, III, I, Ingen av dem.]
    answer: [3]
    explanation: Karbonet har to like substituenter (to H). Det er altså ikke et kiralt senter, og bromoetan er akiral. Alle tegningene viser samme molekyl, og det finnes ingen enantiomer.

  # ---------------- Del 5: proteiner ----------------
