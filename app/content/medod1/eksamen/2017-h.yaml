  # ---------------- Del 5: Celle – generell kjemi ----------------
  - n: "5.11"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/kjemisk-likevekt]
    type: single
    points: 1
    stem: Hva stemmer for en reaksjon som har nådd likevekt?
    options:
      - Hastigheten av foroverreaksjonen er lik hastigheten av den omvendte reaksjonen.
      - Mengden av produkter er lik mengden av reaktanter.
      - Likevektskonstanten av foroverreaksjonen er lik likevektskonstanten av den omvendte reaksjonen.
      - $\Delta G^0$ av foroverreaksjonen er lik $\Delta G^0$ av den omvendte reaksjonen.
    answer: [0]
    explanation: Likevekt er en dynamisk tilstand der forover- og bakoverreaksjonen går like fort, så konsentrasjonene ikke endres. Mengdene trenger ikke være like. $K_\text{bak} = 1/K_\text{forover}$, og $\Delta G^0_\text{bak} = -\Delta G^0_\text{forover}$.
  - n: "5.12"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/atomer-og-elektroner]
    type: single
    points: 1
    stem: Grunnstoffene innen samme gruppe i det periodiske system har...
    options: [samme antall elektroner, lignende kjemiske egenskaper, lignende massetall, identiske orbitaler]
    answer: [1]
    explanation: Grunnstoffer i samme gruppe har samme antall valenselektroner (samme ytre elektronkonfigurasjon). Det er valenselektronene som bestemmer de kjemiske egenskapene.
  - n: "5.13"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/henderson-hasselbalch, generell-kjemi/teori/buffere]
    type: single
    points: 1
    stem: I en løsning som inneholder den svake syren HA og dens konjugerte base $\ce{A-}$, har vi $[\ce{HA}] = [\ce{A-}]$. Hva er pH i løsningen?
    options: ['$-\log([\ce{A-}]/[\ce{HA}])$', '$pK_a$', '$K_a$', '7']
    answer: [1]
    explanation: Henderson–Hasselbalch gir $pH = pK_a + \log([\ce{A-}]/[\ce{HA}]) = pK_a + \log 1 = pK_a$.
  - n: "5.14"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-og-h3o-omregning, generell-kjemi/teori/karbonsyre-og-blodets-ph]
    type: single
    points: 1
    stem: |
      pH 7,4 i blod tilsvarer 40 nM hydroniumioner ($\ce{H3O+}$).
      Hvilken hydroniumionkonsentrasjon ($\ce{H3O+}$) tilsvarer pH 7,1 i blod?
    options: ["40 µM", "80 nM", "0,8 µM", "16 nM"]
    answer: [1]
    explanation: |
      $[\ce{H3O+}] = 10^{-7{,}1} = 7{,}9 \times 10^{-8}$ M ≈ 80 nM.

      Snarvei: en nedgang i pH på 0,3 tilsvarer en dobling av $[\ce{H3O+}]$, fordi $10^{0{,}3} \approx 2$. Da blir det 40 nM × 2 = 80 nM.
  - n: "5.15"
    subject: generell-kjemi
    topics: [cellebiologi/sammensatte-tema/saliva-og-salivas-kjemi, generell-kjemi/teori/loselighet-og-komplekser]
    type: single
    points: 1
    stem: Tannemalje inneholder hydroksyapatitt. Hvilket av de følgende alternativene øker løseligheten til hydroksyapatitt?
    options: [høy pH, fosfat, fluorid, lav pH]
    answer: [3]
    explanation: $\ce{Ca10(PO4)6(OH)2}$ inneholder basiske anioner ($\ce{OH-}$, $\ce{PO4^3-}$). Ved lav pH protoneres de, og likevekten forskyves mot oppløsning. Fosfat virker som fellesion og senker løseligheten. Fluorid gir det mindre løselige fluorapatitt.
  - n: "5.16"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/isoelektrisk-punkt]
    type: single
    points: 1
    stem: "Ved det isoelektriske punktet til et molekyl:"
    options: ['$K_c = 0$', 'pH = 7', 'elektrisk nettoladning = 0', 'pH = $pK_a$']
    answer: [2]
    explanation: pI er definert som den pH der molekylet har netto ladning null (for en aminosyre dominerer da zwitterionet). For en enkel aminosyre er pI gjennomsnittet av de to pKa-ene rundt den nøytrale formen, ikke én pKa og ikke nødvendigvis 7.
  - n: "5.17"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-sterk-syre-og-base]
    type: single
    points: 1
    stem: I laboratoriet har en forsker en stamløsning av 10 M NaOH. Hva er dens pH-verdi?
    options: ["10", "-1", "13", "15"]
    answer: [3]
    explanation: $[\ce{OH-}] = 10$ M gir $pOH = -\log 10 = -1$, og da er $pH = 14 - (-1) = 15$. pH-skalaen er ikke begrenset til 0–14 for svært konsentrerte løsninger.
  - n: "5.18"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/gibbs-fri-energi, generell-kjemi/teori/termodynamikk]
    type: single
    points: 1
    stem: |
      En stipendiat analyserer en biokjemisk reaksjon med hjelp av kalorimetri. Hun måler de følgende verdiene:

      $\Delta H = -13{,}2$ kcal/mol
      $\Delta S = +44$ cal/(mol K)

      Hva kan vi si om reaksjonen basert på dette?
    options:
      - Reaksjonen er eksergon og eksoterm.
      - Reaksjonen er endergon og eksoterm.
      - Reaksjonen er endergon og endoterm.
      - Reaksjonen er eksergon og endoterm.
    answer: [0]
    explanation: $\Delta H < 0$ betyr at reaksjonen er eksoterm. Med $\Delta S > 0$ blir $-T\Delta S < 0$, så $\Delta G = \Delta H - T\Delta S < 0$ ved alle temperaturer. Reaksjonen er altså eksergon.
  - n: "5.19"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/ph-svak-base-og-salt, generell-kjemi/teori/syre-base-likevekter]
    type: single
    points: 1
    stem: For en svak syre er $K_a = 1{,}0 \times 10^{-4}$. Hva er $pK_b$ for dens konjugerte base?
    options: ['$1{,}0 \times 10^{-14}$', '10', '4', '$1{,}0 \times 10^{-10}$']
    answer: [1]
    explanation: $pK_a = 4$, og $pK_a + pK_b = 14$ (ved 25 °C), så $pK_b = 10$. $1{,}0 \times 10^{-10}$ er $K_b$, ikke $pK_b$.
  - n: "5.20"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/standard-cellepotensial]
    type: single
    points: 1
    stem: |
      Vi har gitt standard reduksjonspotensial for disse to halvreaksjonene:

      $\ce{Fe^3+(aq) + e- -> Fe^2+(aq)}$ $E^0 = +0{,}771$ V
      $\ce{Ni^2+(aq) + 2e- -> Ni(s)}$ $E^0 = -0{,}250$ V

      Hva er da standard cellepotensialet til følgende reaksjon?

      $\ce{2Fe^3+(aq) + Ni(s) -> 2Fe^2+(aq) + Ni^2+(aq)}$
    options: ["+0,521 V", "-1,792 V", "+1,792 V", "+1,021 V"]
    answer: [3]
    explanation: |
      $\ce{Fe^3+}$ reduseres (katode) og Ni oksideres (anode):

      $E^\circ_\text{celle} = E^\circ_\text{katode} - E^\circ_\text{anode} = 0{,}771 - (-0{,}250) = +1{,}021$ V

      Potensialet skal ikke ganges med 2.
  - n: "5.21"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/kombinere-likevektskonstanter]
    type: single
    points: 1
    stem: |
      Vi har følgende to reaksjoner:

      $\ce{A + B <=> C + D}$ (reaksjon 1)
      $\ce{C <=> E}$ (reaksjon 2)

      Vi kan måle likevektskonstantene til begge reaksjonene:

      $K_c = 2 \times 10^3$ (reaksjon 1)
      $K_c = 100$ (reaksjon 2)

      Hva blir da likevektskonstanten til følgende reaksjon: $\ce{A + B <=> D + E}$
    options: ['2100', '20', '$2 \times 10^3$', '$2 \times 10^5$']
    answer: [3]
    explanation: Reaksjon 1 + reaksjon 2 gir $\ce{A + B <=> D + E}$ (C strykes). Når reaksjoner summeres, multipliseres K-ene, så $K = 2 \times 10^3 \times 100 = 2 \times 10^5$.
  - n: "5.22"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/protolyttfordeling, generell-kjemi/teori/flerprotiske-syrer-og-aminosyrer]
    type: single
    points: 1
    stem: |
      Fosforsyre ($\ce{H3PO4}$) er triprotisk og har følgende likevektskonstanter til de tre protolysereaksjonene:

      $K_{a1} = 6{,}9 \times 10^{-3}$
      $K_{a2} = 6{,}2 \times 10^{-8}$
      $K_{a3} = 4{,}8 \times 10^{-13}$

      Hva er den dominerende protolyttformen ved pH = 8?
    options: ['$\ce{PO4^3-}$', '$\ce{H3PO4}$', '$\ce{HPO4^2-}$', '$\ce{H2PO4-}$']
    answer: [2]
    explanation: pKa-ene er 2,16, 7,21 og 12,32. pH 8 ligger mellom pKa2 og pKa3, så $\ce{HPO4^2-}$ dominerer. Forholdet er $[\ce{HPO4^2-}]/[\ce{H2PO4-}] = 10^{8-7{,}21} \approx 6$.
  - n: "5.23"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/intermolekylaere-krefter]
    type: single
    points: 1
    stem: Hvor mange hydrogenbindinger deltar et vannmolekyl normalt i?
    options: ["1", "2", "3", "4"]
    answer: [3]
    explanation: Vann har to H som kan doneres og to frie elektronpar på O som kan ta imot. Det gir opptil fire hydrogenbindinger i et tetraedrisk nettverk, slik som i is.
  - n: "5.24"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/syrer-baser-og-ph, generell-kjemi/teori/syre-base-likevekter]
    type: single
    points: 1
    stem: Hvilket av de følgende alternativene er *ikke* korrekt?
    options: ['$K_w = -\log[\ce{H2O}]$', '$K_w = K_a \times K_b$', '$K_w = 1{,}0 \times 10^{-14}$', '$K_w = [\ce{H3O+}][\ce{OH-}]$']
    answer: [0]
    explanation: Vannets ioneprodukt er $K_w = [\ce{H3O+}][\ce{OH-}] = 1{,}0 \times 10^{-14}$ ved 25 °C, og for et konjugert syre–base-par er $K_a K_b = K_w$. $[\ce{H2O}]$ inngår ikke, og det er ingen logaritme i definisjonen.
  - n: "5.25"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/kompleksdannelse-og-loselighet, generell-kjemi/regnetyper/fellesioneffekt]
    type: single
    points: 1
    stem: Medisinstudenten Jens har 100 ml av en mettet vannløsning av AgCl. Hvordan kan han øke løseligheten til AgCl?
    options: [Ved å minke pH., Ved å tilsette ammoniakk (NH3)., Ved å tilsette NaCl., Ved å tilsette mer AgCl(s).]
    answer: [1]
    explanation: $\ce{NH3}$ danner komplekset $\ce{[Ag(NH3)2]+}$. Det fjerner fritt $\ce{Ag+}$, og mer AgCl løses (Le Châtelier). NaCl gir fellesioneffekt og *lavere* løselighet. $\ce{Cl-}$ er en svært svak base, så pH har liten effekt. Mer fast stoff endrer ikke løseligheten.
  - n: "5.26"
    subject: generell-kjemi
    topics: [generell-kjemi/teori/losninger-og-konsentrasjon, generell-kjemi/regnetyper/osmolaritet-ekvivalenter-ionestyrke]
    type: single
