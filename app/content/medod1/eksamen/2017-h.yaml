      - Sitrusfrukter kan øke jernabsorbsjonen.
      - Utskillelsen av jern er nøye regulert.
      - Jernoverskudd er bra for antioksidantforsvaret.
      - Jernmangel fører alltid til anemi (blodmangel).
    answer: [0]
    explanation: Vitamin C (askorbinsyre) reduserer $\ce{Fe^3+}$ til det lettere absorberbare $\ce{Fe^2+}$ og danner løselige komplekser med jern. Jernbalansen reguleres gjennom *opptaket* (hepcidin), ikke utskillelsen. Fritt jern fremmer dannelse av radikaler (Fenton-reaksjonen). Lette former for jernmangel gir tomme lagre uten anemi.
