    answer: [3]
    explanation: Gly-X-Y, der X ofte er prolin og Y ofte hydroksyprolin. Gly (minst sidekjede) må sitte i hver tredje posisjon inne i trippelheliksen. Pro/Hyp gir den karakteristiske knekken, og Hyp stabiliserer heliksen via H-bindinger. Hydroksyleringen krever vitamin C.
  - n: "5.75"
    subject: proteiner
    topics: [proteiner/teori/folding-og-modifisering]
    type: single
    points: 1
    stem: Hva er sant om denaturering av et protein?
    options:
      - Den ødelegger primærstrukturen
      - Kan være reversibel
      - Skjer kun ved lav pH (<2)
      - Den forandrer proteinets primære struktur
    answer: [1]
    explanation: Denaturering ødelegger den native 3D-strukturen (sekundær, tertiær, kvartær), men ikke peptidbindingene. Anfinsens forsøk med ribonuklease viste at et protein kan foldes tilbake når denatureringsmidlet fjernes. Varme, pH-ytterpunkter, urea, detergenter og andre midler kan alle denaturere.
  - n: "5.76"
