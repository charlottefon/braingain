    options: [Mitokondria, Plasmamembran, Endoplasmatisk retikulum (ER)., Kjernemembran]
    answer: [2]
    explanation: ER er et sammenhengende nettverk av membransekker og -rør gjennom hele cytoplasma. I mange celler utgjør det over halvparten av all membran.
