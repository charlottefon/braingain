      - Enzymer endrer likevektskonstanten for en gitt reaksjon
      - Den katalytiske aktiviteten er ikke avhengig av temperatur
    answer: [0]
    explanation: Enzymer stabiliserer overgangstilstanden og senker $\Delta G^\ddagger$. De virker i katalytiske mengder, endrer ikke K, og aktiviteten avhenger sterkt av temperatur og pH.
