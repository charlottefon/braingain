  - n: "5.33"
    subject: generell-kjemi
    topics: [generell-kjemi/regnetyper/loselighetsprodukt]
    type: single
    points: 1
    stem: |
      $\ce{BaSO4}$ er relativt tungtløselig og brukes som kontrastmiddel ved røntgenanalyser.
      I en mettet vannløsning av $\ce{BaSO4}$ har vi $[\ce{SO4^2-}] = 1{,}05 \times 10^{-5}$ M.
