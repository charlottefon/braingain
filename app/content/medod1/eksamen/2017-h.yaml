      - Kinase A er mindre fosforylert selv
      - Kinase A blir ikke translatert
    answer: [0]
    explanation: En kinase overfører fosfat fra ATP til Ser/Thr/Tyr på substratproteinene sine. Hemmes kinasen, blir substratene mindre fosforylert. Hemmeren påvirker aktiviteten, ikke syntesen av enzymet.
