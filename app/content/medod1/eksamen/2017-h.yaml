    stem: Hvilke av disse egenskapene karakteriserer peptidbindingen i proteiner?
    figure: "Dipeptid ⁺H₃N–CHR₁–CO–NH–CHR₂–COO⁻ med peptidbindingen (C–N mellom C=O og N–H) markert."
