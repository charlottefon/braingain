  # ---------------- Del 4: Samfunnsmedisin ----------------
  - n: "4.1"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: I samfunnsmedisin opereres det med begrepet «populasjonsstrategi». Hva menes det med dette?
    options:
      - Man henvender seg til alle innbyggere i en spesiell aldersgruppe i befolkningen
      - Man henvender seg til alle som trenger det i befolkningen
      - Man sammenligner effekten av samme tiltak i to befolkningsgrupper
      - Man henvender seg til alle uavhengig av risikoprofilen til den enkelte
    answer: [3]
    explanation: Befolkningsstrategien (Rose) prøver å flytte hele risikofordelingen i befolkningen, uansett individuell risiko. Høyrisikostrategien retter seg bare mot dem med høy risiko.
  - n: "4.2"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva er den beste definisjonen på relativ fattigdom?
    options:
      - Å ha mindre ressurser enn gjennomsnittsinnbyggeren.
      - Å ha for lite ressurser til å realisere drømmene sine
      - Å ha for lite ressurser til å kunne kjøpe seg det man trenger
      - Å ha for lite ressurser til å kunne delta i samfunnet på lik linje med andre
    answer: [3]
    explanation: Relativ fattigdom betyr så begrensede ressurser sammenlignet med flertallet at man helt eller delvis ekskluderes fra vanlig deltakelse i samfunnet. «For lite til det man trenger» ligner mer på absolutt fattigdom.
  - n: "4.3"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: "Det som har hatt størst betydning for økningen i forventet levealder i befolkningen de siste 100 år er:"
    options:
      - Oppdagelsen av antibiotika
      - Mer avansert behandling av hjertekarsykdom
      - Innføringen av fastlegeordningen
      - Redusert spedbarnsdødelighet
    answer: [3]
    explanation: Forventet levealder ved fødsel er svært følsom for dødsfall tidlig i livet. Fallet i spedbarnsdødeligheten (bedre levekår, ernæring, hygiene) står for mest av økningen, mer enn medisinsk behandling.
  - n: "4.4"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/folkehelse-og-forebygging]
    type: single
    points: 1
    stem: "Hvilke tiltak har størst potensial for å redusere helseskadene av alkoholbruk i Norge:"
    options:
      - Redusere antallet utsalgssteder for alkohol
      - Forbud mot å selge alkohol til berusete personer
      - Informere om skadevirkningene av alkohol
      - Å oppfordre fastleger til å diskutere alkoholbruk med alle pasienter som viser tegn på avhengighet
    answer: [0]
    explanation: Strukturelle tiltak som begrenser tilgjengeligheten (færre utsalgssteder, kortere åpningstider, høy pris) senker totalforbruket i hele befolkningen. Det har best dokumentert effekt. Informasjon og individrettede tiltak har liten effekt på befolkningsnivå.
  - n: "4.5"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva måler vi med relativ ulikhetsindeks?
    options:
      - Forskjellen i den materielle velstanden i forskjellige sosiale grupper
      - Forskjellen i utdanning i forskjellige sosiale grupper
      - Forskjellen i sykelighet eller dødelighet i forskjellige utdanningsgrupper
      - Forskjellen i bruttoinntekt i forskjellige sosiale grupper
    answer: [2]
    explanation: Relativ ulikhetsindeks (RII) er et mål på *helseulikhet*. Den sammenligner sykelighet eller dødelighet i bunnen og toppen av den sosiale gradienten (f.eks. utdanning) og bruker hele fordelingen. Den måler ikke forskjellen i selve inntekten eller utdanningen.
  - n: "4.6"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak, samfunnsmedisin/temaer/hva-er-samfunnsmedisin]
    type: single
    points: 1
    stem: Hvilke tiltak vil du karakterisere som mest «midtstrøms» i forhold til bekjempelse av tannråte i befolkningen?
    options:
      - Gratis tannhelsetjeneste til barn og ungdom med fokus på forebygging
      - Det innføres en ordning med «fasttannlege» etter samme modell som «fastlege» for å sikre god oppfølging av pasienter
      - Øke avgifter på sukkerholdig mat og drikke
      - Påbud om fluor i all tannkrem
    answer: [0]
    explanation: "Det offisielle svaret begrunnes med at tiltaket er forebyggende og retter seg mot levevaner hos barn og unge. **Merk:** Etter klassifiseringen i dagens kurs (Dahl mfl., kursledelsen) er gratis helsetjenester *nedstrøms*, fordi de virker gjennom helsetjenesten. Avgifter på sukker (prisregulering av levevaner) regnes som *midtstrøms*. Med dagens pensum ville «Øke avgifter på sukkerholdig mat og drikke» vært det mest naturlige svaret."
  - n: "4.7"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Ulikheter i helse i Norge i dag
    options:
      - Skyldes hovedsakelig forskjeller i tilgang på helsetjenester
      - Skyldes hovedsakelig forskjeller i kunnskap om hva som er sunt
      - Skyldes hovedsakelig forskjeller i boligstandard
      - Skyldes hovedsakelig forskjeller i helsevaner
    answer: [3]
    explanation: I Norge er tilgangen til helsetjenester og boligstandarden relativt jevn. Røyking, kosthold og fysisk aktivitet følger en tydelig sosial gradient og forklarer mye av forskjellene i hjerte- og karsykdom og kreft (atferds-/kulturforklaringen). Helsevanene er igjen formet av materielle og psykososiale forhold, så kunnskap alene forklarer lite.
  - n: "4.8"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-arsaker]
    type: single
    points: 1
    stem: Hva er den mest plausible forklaringen på økende sosiale ulikheter i helse i Norge?
    options:
      - Sosial mobilitet har gjort de lavere sosiale gruppene mer marginaliserte og homogene
      - Sosialt vanskeligstilte grupper får mindre hjelp når de oppsøker helsevesenet
      - Det er en økende andel fattige barnefamilier i befolkningen
      - Kunnskapen om hvordan man skal leve sunt er i økende grad ulikt fordelt mellom ulike sosiale grupper
    answer: [0]
    explanation: Utdanningseksplosjonen og den sosiale mobiliteten gjør at de som blir igjen med lav utdanning, er en mindre og mer selektert gruppe med opphopning av helseproblemer og andre ulemper. Gapet til resten øker derfor. Dette er en seleksjonsforklaring.
  - n: "4.9"
    subject: samfunnsmedisin
    topics: [samfunnsmedisin/temaer/sosial-ulikhet-tiltak]
    type: single
    points: 1
    stem: "Den mest effektive måten å forebygge sosiale ulikheter i helse gjennom fysisk aktivitet er:"
    options:
      - Informasjonskampanjer om hva som er anbefalt treningsmengde per dag
      - Obligatorisk fysisk aktivitet hver dag i grunnskolen.
      - Å gi folk individuelt tilpasset rådgivning om trening på legekontoret
      - Støtte opprettelsen av flere treningssentre
    answer: [1]
    explanation: Daglig fysisk aktivitet i skolen når alle barn uansett sosial bakgrunn og krever ingen egen innsats eller egne ressurser. Informasjon, individuell rådgivning og treningssentre benyttes mest av de ressurssterke og kan øke ulikheten.

  # ---------------- Del 5: Celle – cellebiologi ----------------
  - n: "5.1"
    subject: cellebiologi
    topics: [cellebiologi/cellen/energi-og-eukaryotenes-opprinnelse, cellebiologi/organeller/mitokondrier]
    type: single
    points: 1
    stem: For ca. 1 billion år siden - som resultat av endosymbiose med prokaryote celler og opphav av en ny organelle - utviklet tidlige eukaryote celler evnen til å nyttiggjøre en av de følgende komponentene i atmosfæren. Hvilken?
    options: [ATP, Nitrogen, Oksygen, Karbondioksid]
    answer: [2]
    explanation: En aerob bakterie tatt opp ved endosymbiose ble til mitokondriet. Det gjorde cellen i stand til aerob respirasjon med O₂ som siste elektronakseptor.
  - n: "5.2"
    subject: cellebiologi
