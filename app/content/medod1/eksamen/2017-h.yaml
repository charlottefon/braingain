      - "...det ikke er oksygenradikaler i pustegassen."
    answer: [1]
    explanation: Høyt $p\ce{O2}$ over tid øker dannelsen av reaktive oksygenforbindelser i vevet (særlig i lungene), og skaden avhenger av både dose og varighet. Radikalene dannes i kroppen, ikke i pustegassen.
