    stem: "Kollagen består av tre langstrakte polypeptidkjeder kalt α-kjeder, spiralisert rundt hverandre i en langstrakt trippelspiral (trippelheliks), hvor hver av α-kjedene viser karakteristisk repeterende mønster av tre aminosyrer: glysin-x-y. Hvilke aminosyrer er ofte i x- og y-posisjon?"
