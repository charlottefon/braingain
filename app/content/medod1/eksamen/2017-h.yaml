      - De inneholder mitokondria.
      - De bruker RNA (mRNA) for å flytte genetisk informasjon fra DNA til proteinstruktur.
    answer: [3]
    explanation: Det sentrale dogmet (DNA → RNA → protein) gjelder alle celler. Prokaryoter deler seg ved binær fisjon, ikke mitose, og mangler mitokondrier og kloroplaster.
  - n: "5.3"
    subject: cellebiologi
