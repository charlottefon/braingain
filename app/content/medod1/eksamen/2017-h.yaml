    answer: [1]
    explanation: Oligomere proteiner har per definisjon flere subenheter (kvartærstruktur). Mange er enzymer, og oligomeri er typisk for allosterisk regulerte proteiner, som hemoglobin og aspartattranskarbamoylase.
  - n: "5.80"
    subject: proteiner
