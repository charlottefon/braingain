      - Bare i samme (parallell) retning
      - Ingen av de andre alternativene er riktige
      - Både motsatt (antiparallell) og samme (parallell) retning
      - Bare i motsatt (antiparallell) retning
    answer: [2]
    explanation: β-tråder kan ligge antiparallelt (oftest, med rette H-bindinger) eller parallelt, og et flak kan også være blandet.
  - n: "5.70"
    subject: proteiner
    topics: [proteiner/teori/myoglobin-og-hemoglobin, proteiner/aminosyrer/valin]
    type: single
    points: 1
    stem: Mutasjoner i hemoglobin- (Hb)-gener fører til unormal binding og tilførsel av oksygen. Hb-mutanten HbS er knyttet til sigdcelleanemi. HbS aggregerer og former langstrakte fibrer som til og med endrer formen på røde blodceller og kan hindre blodstrømmen i kapillærene. Hva er den molekylære mekanismen for aggregering av HbS?
    options:
      - HbS er posttranslasjonelt modifisert
      - Mutasjonen fører til repulsive elektrostatiske interaksjoner og HbS-subenheter interagerer ikke med hverandre for å danne tetramerer
      - Hem-gruppen i hver HbS-subenhet stabler seg på toppen av hverandre
      - Mutasjonen fører til at en hydrofob aminosyre er plassert i overflaten av HbS-subenhetene, noe som fremkaller uriktige interaksjoner mellom subenhetene
    answer: [3]
    explanation: I HbS er Glu6 i β-kjeden byttet ut med Val. Den hydrofobe valinen på overflaten passer inn i en hydrofob lomme på et annet (deoksy)Hb-molekyl. Tetramerene polymeriserer da til lange fibrer.
  - n: "5.71"
    subject: proteiner
    topics: [proteiner/enzymkinetikk]
    type: single
    points: 1
    stem: "Michaelis-Menten kinetikk: Hvis et normalt enzym har $V_{max}$ = 100 mikromol produkt/min og $K_M$ = 10 mM, mens en sykdomsassosiert mutant har $V_{max}$ = 30 mikromol produkt/min og $K_M$ = 20 mM, hva er riktig svar?"
    options:
      - Mutanten har høyere affinitet til substratet enn det normale enzymet
      - Ingen av de andre alternativene er korrekte
      - Den initiale hastigheten til reaksjonen katalysert av det muterte enzymet ved en konsentrasjon av substrat 20 mM er 15 mikromol produkt/min.
      - Mutanten forskyver likevekten til produktdannelse i større grad enn det normale enzymet
    answer: [2]
    explanation: |
      $V_0 = \dfrac{V_{max}[S]}{K_M + [S]} = \dfrac{30 \times 20}{20 + 20} = 15$ µmol/min. Når $[S] = K_M$, er $V_0 = V_{max}/2$.

      Mutanten har høyere $K_M$ og dermed *lavere* affinitet. Enzymer endrer ikke likevekten.
  - n: "5.72"
    subject: proteiner
    topics: [proteiner/enzymkinetikk, proteiner/teori/enzymregulering]
    type: single
    points: 1
    stem: Med hvilken av følgende typer reversibel hemming kan du endre et enzyms $V_{max}$, men ikke $K_M$?
    options: [Kompetitiv, Nonkompetitiv, Unkompetitiv, Allosterisk]
    answer: [1]
    explanation: En ren nonkompetitiv hemmer binder E og ES like godt. Da senkes $V_{max}$, mens $K_M$ er uendret. Kompetitiv hemming øker $K_M$, og unkompetitiv hemming senker både $V_{max}$ og $K_M$.
