      - Involverer ikke aminosyrerester av enzymet
      - Skjer i det aktive setet
    answer: [3]
    explanation: Substratet bindes i det aktive setet, hovedsakelig med ikke-kovalente interaksjoner (H-bindinger, ionebindinger, hydrofobe interaksjoner) til aminosyrerester i setet. Kovalente intermediater forekommer i noen mekanismer, men bindingen er ikke avhengig av dem.
  - n: "5.78"
